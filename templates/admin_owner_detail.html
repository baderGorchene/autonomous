<!DOCTYPE html>
<html lang="{{ lang }}">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ _('Edit Owner') }} - {{ owner.name if owner.name else owner.email }}</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/tailwindcss@2.2.19/dist/tailwind.min.css">
    <style>
        body { font-family: 'Inter', sans-serif; }
    </style>
</head>
<body class="bg-gray-100 p-4">
    <div class="max-w-3xl mx-auto bg-white p-8 rounded-lg shadow-md">
        <h1 class="text-3xl font-bold mb-6">{{ _('Edit Owner') }}: {{ owner.name if owner.name else owner.email }}</h1>

        <div class="mb-6">
            <a href="/admin" class="text-blue-600 hover:underline">{{ _('Back to Admin Dashboard') }}</a>
        </div>

        <form action="/admin/owners/{{ owner.id }}" method="post" class="space-y-6">
            <div>
                <label for="name" class="block text-sm font-medium text-gray-700">{{ _('Name') }}</label>
                <input type="text" name="name" id="name" value="{{ owner.name if owner.name else '' }}" class="mt-1 block w-full border border-gray-300 rounded-md shadow-sm p-2 focus:ring-blue-500 focus:border-blue-500">
            </div>

            <div>
                <label for="email" class="block text-sm font-medium text-gray-700">{{ _('Email') }}</label>
                <input type="email" name="email" id="email" value="{{ owner.email }}" class="mt-1 block w-full border border-gray-300 rounded-md shadow-sm p-2 focus:ring-blue-500 focus:border-blue-500">
            </div>

            <div>
                <label for="phone" class="block text-sm font-medium text-gray-700">{{ _('Phone') }}</label>
                <input type="text" name="phone" id="phone" value="{{ owner.phone if owner.phone else '' }}" class="mt-1 block w-full border border-gray-300 rounded-md shadow-sm p-2 focus:ring-blue-500 focus:border-blue-500">
            </div>

            <div>
                <label for="subscription_status" class="block text-sm font-medium text-gray-700">{{ _('Subscription Status') }}</label>
                <select name="subscription_status" id="subscription_status" class="mt-1 block w-full border border-gray-300 rounded-md shadow-sm p-2 focus:ring-blue-500 focus:border-blue-500">
                    <option value="free" {% if owner.subscription_status == 'free' %}selected{% endif %}>{{ _('Free') }}</option>
                    <option value="premium" {% if owner.subscription_status == 'premium' %}selected{% endif %}>{{ _('Premium') }}</option>
                    <option value="cancelled" {% if owner.subscription_status == 'cancelled' %}selected{% endif %}>{{ _('Cancelled') }}</option>
                </select>
            </div>

            <div class="flex items-center">
                <input type="checkbox" name="is_admin" id="is_admin" value="True" {% if owner.is_admin %}checked{% endif %} class="h-4 w-4 text-blue-600 focus:ring-blue-500 border-gray-300 rounded">
                <label for="is_admin" class="ml-2 block text-sm text-gray-900">{{ _('Is Admin') }}</label>
            </div>

            <div>
                <button type="submit" class="w-full flex justify-center py-2 px-4 border border-transparent rounded-md shadow-sm text-sm font-medium text-white bg-blue-600 hover:bg-blue-700 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-blue-500">
                    {{ _('Update Owner') }}
                </button>
            </div>
        </form>

        <form action="/admin/owners/{{ owner.id }}/delete" method="post" class="mt-6">
            <button type="submit" class="w-full flex justify-center py-2 px-4 border border-transparent rounded-md shadow-sm text-sm font-medium text-white bg-red-600 hover:bg-red-700 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-red-500" onsubmit="return confirm('{{ _('Are you sure you want to delete this owner?') }}');">
                {{ _('Delete Owner') }}
            </button>
        </form>
    </div>
</body>
</html>
