<!DOCTYPE html>
<html lang="{{ locale }}">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ title }} - {{ owner.name }}</title>
    <link rel="stylesheet" href="/static/css/styles.css">
</head>
<body>
    <div class="container">
        <div class="language-toggle">
            <a href="?lang=en" class="{{ 'active' if locale == 'en' }}">English</a> |
            <a href="?lang=ar" class="{{ 'active' if locale == 'ar' }}">العربية</a> |
            <a href="?lang=fr" class="{{ 'active' if locale == 'fr' }}">Français</a>
        </div>
        <h1>{{ gettext("Manage Owner") }}: {{ owner.name }}</h1>

        <form action="{{ url_for('admin_update_owner', owner_id=owner.id) }}" method="post">
            <div class="form-group">
                <label for="name">{{ gettext("Name") }}:</label>
                <input type="text" id="name" name="name" value="{{ owner.name }}" required>
            </div>
            <div class="form-group">
                <label for="email">{{ gettext("Email") }}:</label>
                <input type="email" id="email" name="email" value="{{ owner.email }}" required>
            </div>
            <div class="form-group">
                <label for="phone">{{ gettext("Phone") }}:</label>
                <input type="text" id="phone" name="phone" value="{{ owner.phone if owner.phone else '' }}">
            </div>
            <div class="form-group">
                <label for="subscription_status">{{ gettext("Subscription Status") }}:</label>
                <select id="subscription_status" name="subscription_status">
                    <option value="free" {% if owner.subscription_status == 'free' %}selected{% endif %}>{{ gettext("Free") }}</option>
                    <option value="premium" {% if owner.subscription_status == 'premium' %}selected{% endif %}>{{ gettext("Premium") }}</option>
                    <option value="cancelled" {% if owner.subscription_status == 'cancelled' %}selected{% endif %}>{{ gettext("Cancelled") }}</option>
                </select>
            </div>
            <div class="form-group">
                <input type="checkbox" id="is_admin" name="is_admin" {% if owner.is_admin %}checked{% endif %}>
                <label for="is_admin">{{ gettext("Is Admin") }}</label>
            </div>
            <div class="form-actions">
                <button type="submit">{{ gettext("Update Owner") }}</button>
            </div>
        </form>
        <a href="{{ url_for('admin_dashboard') }}" class="back-link">{{ gettext("Back to Admin Dashboard") }}</a>
    </div>
</body>
</html>
