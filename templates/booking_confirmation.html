<!DOCTYPE html>
<html lang="{{ request.state.lang }}">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ _('Booking Confirmed') }} - BookSlot</title>
    <link rel="stylesheet" href="/static/style.css">
</head>
<body>
    <div class="container">
        <h1>{{ _('Booking Confirmed!') }}</h1>
        <p>{{ message }}</p>
        <p>{{ _('You will receive an email confirmation shortly.') }}</p>
        <p><a href="/">{{ _('Go to homepage') }}</a></p>
        <p>
            <a href="{{ request.url|urlencode('lang', 'en') }}">English</a> |
            <a href="{{ request.url|urlencode('lang', 'ar') }}">العربية</a> |
            <a href="{{ request.url|urlencode('lang', 'fr') }}">Français</a>
        </p>
    </div>
</body>
</html>
