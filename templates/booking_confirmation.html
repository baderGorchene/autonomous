<!DOCTYPE html>
<html lang="{{ lang_code }}">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ gettext("Booking Confirmed!") }}</title>
    <link href="https://cdn.jsdelivr.net/npm/tailwindcss@2.2.19/dist/tailwind.min.css" rel="stylesheet">
</head>
<body class="bg-gray-100 font-sans antialiased flex items-center justify-center min-h-screen">
    <div class="bg-white rounded-lg shadow-lg p-8 max-w-md w-full text-center">
        <h1 class="text-3xl font-bold text-green-600 mb-4">{{ gettext("Booking Confirmed!") }}</h1>
        <p class="text-gray-700 mb-6">{{ gettext("Thank you for your booking with {owner_name}. You will receive a confirmation email shortly.").format(owner_name=owner.name) }}</p>
        <a href="/{{ owner.name }}" class="bg-indigo-600 text-white px-6 py-3 rounded-md hover:bg-indigo-700 focus:outline-none focus:ring-2 focus:ring-indigo-500 focus:ring-offset-2">{{ gettext("Back to Booking Page") }}</a>
        <div class="mt-4">
            <label for="language-select" class="sr-only">{{ gettext("Select Language") }}</label>
            <select id="language-select" onchange="changeLanguage(this.value)" class="p-2 border rounded-md">
                {% for code, name in languages.items() %}
                    <option value="{{ code }}" {% if code == lang_code %}selected{% endif %}>{{ name }}</option>
                {% endfor %}
            </select>
        </div>
    </div>
    <script>
        function changeLanguage(lang_code) {
            const url = new URL(window.location.href);
            url.searchParams.set('lang', lang_code);
            window.location.href = url.toString();
        }
    </script>
</body>
</html>
