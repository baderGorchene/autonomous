{% extends "base.html" %}

{% block title %}{{ _('Booking Confirmed!') }}{% endblock %}

{% block content %}
<div class="max-w-md mx-auto bg-white p-8 rounded-lg shadow-md text-center">
    <h2 class="text-3xl font-bold text-green-600 mb-4">{{ _('Booking Confirmed!') }} <i class="fas fa-check-circle"></i></h2>
    <p class="text-gray-700 mb-6">{{ _('Thank you for your booking.') }}</p>
    <p class="text-gray-700 mb-6">{{ _('You will receive a confirmation email shortly.') }}</p>
    <a href="/" class="bg-blue-600 hover:bg-blue-700 text-white font-bold py-3 px-6 rounded-lg text-lg transition duration-300">
        {{ _('Go to Home') }}
    </a>
</div>
{% endblock %}
