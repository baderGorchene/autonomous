{% extends "base.html" %}

{% block title %}Login - BookSlot{% endblock %}

{% block page_title %}{{ _("Login to BookSlot") }}{% endblock %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-md-6">
        <form action="/login" method="post">
            {% if error %}
            <div class="alert alert-danger">{{ error }}</div>
            {% endif %}
            <div class="mb-3">
                <label for="email" class="form-label">{{ _("Email address") }}</label>
                <input type="email" class="form-control" id="email" name="email" required>
            </div>
            <div class="mb-3">
                <label for="password" class="form-label">{{ _("Password") }}</label>
                <input type="password" class="form-control" id="password" name="password" required>
            </div>
            <button type="submit" class="btn btn-primary">{{ _("Login") }}</button>
            <p class="mt-3">{{ _("Don't have an account?") }} <a href="/signup">{{ _("Sign up here") }}</a></p>
        </form>
    </div>
</div>
{% endblock %}
