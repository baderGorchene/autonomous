{% extends "base.html" %}
{% block title %}{{ _('Login') }}{% endblock %}
{% block content %}
<div class="container login-container">
    <h2>{{ _('Login to BookSlot') }}</h2>
    {% if error %}
    <div class="alert alert-danger">{{ error }}</div>
    {% endif %}
    <form action="/login" method="post">
        <div class="mb-3">
            <label for="email" class="form-label">{{ _('Email address') }}</label>
            <input type="email" class="form-control" id="email" name="email" required>
        </div>
        <div class="mb-3">
            <label for="password" class="form-label">{{ _('Password') }}</label>
            <input type="password" class="form-control" id="password" name="password" required>
        </div>
        <button type="submit" class="btn btn-primary">{{ _('Login') }}</button>
    </form>
    <p class="mt-3">{{ _('Don\'t have an account?') }} <a href="/signup">{{ _('Sign Up') }}</a></p>
</div>
{% endblock %}
