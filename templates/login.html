<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ _('Login') }} - BookSlot</title>
    <link rel="stylesheet" href="/static/style.css">
</head>
<body>
    <div class="container">
        <h1>{{ _('Login to BookSlot') }}</h1>
        {% if error %}
            <p style="color: red;">{{ error }}</p>
        {% endif %}
        <form action="/login" method="post">
            <label for="email">{{ _('Email') }}:</label>
            <input type="email" id="email" name="email" required>
            <label for="password">{{ _('Password') }}:</label>
            <input type="password" id="password" name="password" required>
            <button type="submit">{{ _('Login') }}</button>
        </form>
        <p>{{ _('Don\'t have an account?') }} <a href="/signup">{{ _('Sign Up here') }}</a></p>
        <div class="language-toggle">
            <a href="{{ request.url|urlencode('locale', 'en') }}">English</a> |
            <a href="{{ request.url|urlencode('locale', 'ar') }}">العربية</a> |
            <a href="{{ request.url|urlencode('locale', 'fr') }}">Français</a>
        </div>
    </div>
</body>
</html>
