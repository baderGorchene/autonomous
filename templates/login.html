<!DOCTYPE html>
<html lang="{{ request.cookies.get('lang', 'en') }}">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ _('Login') }} - BookSlot</title>
</head>
<body>
    <h1>{{ _('Login to BookSlot') }}</h1>
    {% if error_message %}
        <p style="color: red;">{{ error_message }}</p>
    {% endif %}
    <form action="/login" method="post">
        <label for="email">{{ _('Email:') }}</label><br>
        <input type="email" id="email" name="email" required><br><br>
        
        <label for="password">{{ _('Password:') }}</label><br>
        <input type="password" id="password" name="password" required><br><br>
        
        <input type="submit" value="{{ _('Login') }}">
    </form>
    <p>{{ _('Don\'t have an account?') }} <a href="/signup">{{ _('Sign Up here') }}</a></p>
    <p>
        <a href="/set_lang/en">English</a> |
        <a href="/set_lang/ar">العربية</a> |
        <a href="/set_lang/fr">Français</a>
    </p>
</body>
</html>
