<!DOCTYPE html>
<html lang="{{ request.state.locale }}">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ _('Login - BookSlot') }}</title>
</head>
<body>
    <h1>{{ _('Login') }}</h1>
    <form action="/login" method="post">
        <label for="email">{{ _('Email:') }}</label><br>
        <input type="email" id="email" name="email" required><br>
        <label for="password">{{ _('Password:') }}</label><br>
        <input type="password" id="password" name="password" required><br>
        <input type="submit" value="{{ _('Login') }}">
    </form>
    <p>{{ _('Don\'t have an account?') }} <a href="/signup">{{ _('Sign Up') }}</a></p>
    <div>
        <a href="?lang=en">English</a> | <a href="?lang=ar">العربية</a> | <a href="?lang=fr">Français</a>
    </div>
</body>
</html>
