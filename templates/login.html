<!DOCTYPE html>
<html lang="{{ request.state.lang }}">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ gettext("Login - BookSlot") }}</title>
    <link href="https://cdn.jsdelivr.net/npm/tailwindcss@2.2.19/dist/tailwind.min.css" rel="stylesheet">
</head>
<body class="bg-gray-100 flex items-center justify-center min-h-screen">
    <div class="bg-white p-8 rounded-lg shadow-md w-full max-w-md">
        <h1 class="text-2xl font-bold mb-6 text-center text-gray-800">{{ gettext("Log In to Your BookSlot Account") }}</h1>
        
        {% if msg %}
            <div class="bg-blue-100 border border-blue-400 text-blue-700 px-4 py-3 rounded relative mb-4" role="alert">
                <span class="block sm:inline">{{ msg }}</span>
            </div>
        {% endif %}

        <form action="/login" method="post" class="space-y-4">
            <div>
                <label for="username" class="block text-sm font-medium text-gray-700">{{ gettext("Email") }}</label>
                <input type="email" id="username" name="username" required class="mt-1 block w-full px-3 py-2 border border-gray-300 rounded-md shadow-sm focus:outline-none focus:ring-blue-500 focus:border-blue-500">
            </div>
            <div>
                <label for="password" class="block text-sm font-medium text-gray-700">{{ gettext("Password") }}</label>
                <input type="password" id="password" name="password" required class="mt-1 block w-full px-3 py-2 border border-gray-300 rounded-md shadow-sm focus:outline-none focus:ring-blue-500 focus:border-blue-500">
            </div>
            <div>
                <button type="submit" class="w-full flex justify-center py-2 px-4 border border-transparent rounded-md shadow-sm text-sm font-medium text-white bg-blue-600 hover:bg-blue-700 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-blue-500">
                    {{ gettext("Log In") }}
                </button>
            </div>
        </form>
        <p class="mt-6 text-center text-sm text-gray-600">
            {{ gettext("Don't have an account?") }}
            <a href="/signup" class="font-medium text-blue-600 hover:text-blue-500">{{ gettext("Sign Up") }}</a>
        </p>

        <div class="mt-8 text-center">
            <h3 class="text-lg font-semibold mb-2">{{ gettext("Change Language:") }}</h3>
            <div class="flex justify-center space-x-4">
                <a href="{{ request.url|update_query_param('lang', 'en') }}" class="text-blue-500 hover:underline">English</a>
                <a href="{{ request.url|update_query_param('lang', 'ar') }}" class="text-blue-500 hover:underline">العربية</a>
                <a href="{{ request.url|update_query_param('lang', 'fr') }}" class="text-blue-500 hover:underline">Français</a>
            </div>
        </div>
    </div>
</body>
</html>
