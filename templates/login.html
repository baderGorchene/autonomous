<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>{{ _('Login') }} - BookSlot</title><link rel="stylesheet" href="/static/style.css"></head><body><div class="container"><h1>{{ _('Login to BookSlot') }}</h1>{% if error_message %}<p class="error-message">{{ error_message }}</p>{% endif %}<form action="/login" method="post"><label for="username">{{ _('Email') }}:</label><input type="email" id="username" name="username" required><label for="password">{{ _('Password') }}:</label><input type="password" id="password" name="password" required><button type="submit">{{ _('Log In') }}</button></form><p>{{ _('Don\'t have an account?') }} <a href="/signup">{{ _('Sign Up') }}</a></p></div></body></html>
