<!DOCTYPE html><html lang="{{ current_locale }}"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>{{ gettext("Login") }} - BookSlot</title><script src="https://cdn.tailwindcss.com"></script></head><body class="bg-gray-100 flex items-center justify-center min-h-screen p-4"><div class="bg-white p-8 rounded-lg shadow-md w-full max-w-md"><h1 class="text-2xl font-bold mb-6 text-center">{{ gettext("Login to BookSlot") }}</h1>{% if message %}<div class="bg-green-100 border border-green-400 text-green-700 px-4 py-3 rounded relative mb-4" role="alert"><span class="block sm:inline">{{ message }}</span></div>{% endif %}{% if error %}<div class="bg-red-100 border border-red-400 text-red-700 px-4 py-3 rounded relative mb-4" role="alert"><span class="block sm:inline">{{ error }}</span></div>{% endif %}<form action="/token" method="post" class="space-y-4"><div><label for="username" class="block text-sm font-medium text-gray-700">{{ gettext("Email") }}</label><input type="email" id="username" name="username" required class="mt-1 block w-full px-3 py-2 border border-gray-300 rounded-md shadow-sm focus:outline-none focus:ring-indigo-500 focus:border-indigo-500 sm:text-sm"></div><div><label for="password" class="block text-sm font-medium text-gray-700">{{ gettext("Password") }}</label><input type="password" id="password" name="password" required class="mt-1 block w-full px-3 py-2 border border-gray-300 rounded-md shadow-sm focus:outline-none focus:ring-indigo-500 focus:border-indigo-500 sm:text-sm"></div><button type="submit" class="w-full flex justify-center py-2 px-4 border border-transparent rounded-md shadow-sm text-sm font-medium text-white bg-indigo-600 hover:bg-indigo-700 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-indigo-500">{{ gettext("Login") }}</button></form><p class="mt-4 text-center text-sm text-gray-600">{{ gettext("Don't have an account?") }} <a href="/signup" class="font-medium text-indigo-600 hover:text-indigo-500">{{ gettext("Sign up") }}</a></p><div class="mt-6 text-center"><a href="?lang=en" class="text-indigo-600 hover:underline mx-2">English</a><a href="?lang=ar" class="text-indigo-600 hover:underline mx-2">العربية</a><a href="?lang=fr" class="text-indigo-600 hover:underline mx-2">Français</a></div></div></body></html>
