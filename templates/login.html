<!DOCTYPE html>
<html lang="{{ lang }}">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ _('Login') }} - BookSlot</title>
    <link rel="stylesheet" href="/static/css/style.css">
</head>
<body>
    <div class="container">
        <h1>{{ _('Login to BookSlot') }}</h1>
        <form action="/token" method="post">
            <label for="username">{{ _('Email') }}:</label>
            <input type="email" id="username" name="username" required>
            <label for="password">{{ _('Password') }}:</label>
            <input type="password" id="password" name="password" required>
            <button type="submit">{{ _('Login') }}</button>
        </form>
        <p>{{ _('Don\'t have an account?') }} <a href="/signup">{{ _('Sign up') }}</a></p>
        <div class="language-toggle">
            <a href="{{ current_url|urlencode('lang', 'en') }}">English</a>
            <a href="{{ current_url|urlencode('lang', 'ar') }}">العربية</a>
            <a href="{{ current_url|urlencode('lang', 'fr') }}">Français</a>
        </div>
    </div>
</body>
</html>
