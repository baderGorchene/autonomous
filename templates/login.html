<!DOCTYPE html>
<html lang="{{ request.cookies.get('locale', 'en') }}">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ _('Login to BookSlot') }}</title>
    <link rel="stylesheet" href="/static/style.css">
</head>
<body>
    <div class="auth-container">
        <h2>{{ _('Login') }}</h2>
        {% if error %}
            <p class="error-message">{{ error }}</p>
        {% endif %}
        <form action="/login" method="post">
            <label for="email">{{ _('Email:') }}</label>
            <input type="email" id="email" name="email" required>
            
            <label for="password">{{ _('Password:') }}</label>
            <input type="password" id="password" name="password" required>
            
            <button type="submit">{{ _('Login') }}</button>
        </form>
        <p>{{ _("Don't have an account?") }} <a href="/signup">{{ _('Sign Up') }}</a></p>
        <form action="/set-locale" method="post" style="text-align: center; margin-top: 20px;">
            <select name="locale" onchange="this.form.submit()">
                <option value="en" {% if request.cookies.get('locale') == 'en' %}selected{% endif %}>English</option>
                <option value="ar" {% if request.cookies.get('locale') == 'ar' %}selected{% endif %}>العربية</option>
                <option value="fr" {% if request.cookies.get('locale') == 'fr' %}selected{% endif %}>Français</option>
            </select>
        </form>
    </div>
</body>
</html>
