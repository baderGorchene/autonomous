<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>{{ request.state.gettext("Login") }}</title></head><body><h1>{{ request.state.gettext("Login") }}</h1>{% if error %}<p style="color: red;">{{ error }}</p>{% endif %}{% if message %}<p style="color: green;">{{ message }}</p>{% endif %}<form action="/token" method="post"><label for="username">{{ request.state.gettext("Email") }}:</label><input type="email" id="username" name="username" required><br><label for="password">{{ request.state.gettext("Password") }}:</label><input type="password" id="password" name="password" required><br><button type="submit">{{ request.state.gettext("Log In") }}</button></form><p>{{ request.state.gettext("Don't have an account?") }} <a href="/signup">{{ request.state.gettext("Sign up here") }}</a></p></body></html>
