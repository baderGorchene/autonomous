{% extends "base.html" %}
{% block title %}{{ request.state.gettext('Login') }}{% endblock %}
{% block content %}
    <h2>{{ request.state.gettext('Login') }}</h2>
    <form action="/token" method="post">
        <label for="username">{{ request.state.gettext('Email:') }}</label>
        <input type="email" id="username" name="username" required><br>
        <label for="password">{{ request.state.gettext('Password:') }}</label>
        <input type="password" id="password" name="password" required><br>
        <button type="submit">{{ request.state.gettext('Login') }}</button>
    </form>
{% endblock %}
