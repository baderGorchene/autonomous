<!DOCTYPE html>
<html lang="{{ request.state.lang }}">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ _('Login - BookSlot') }}</title>
    <link rel="stylesheet" href="/static/style.css">
</head>
<body>
    <div class="container">
        <h1>{{ _('Login to Your Account') }}</h1>
        {% if error %}
            <p class="error">{{ error }}</p>
        {% endif %}
        <form action="/login" method="post">
            <label for="email">{{ _('Email') }}:</label>
            <input type="email" id="email" name="email" value="{{ email if email else '' }}" required>

            <label for="password">{{ _('Password') }}:</label>
            <input type="password" id="password" name="password" required>

            <button type="submit">{{ _('Login') }}</button>
        </form>
        <p>{{ _('Don\'t have an account?') }} <a href="/signup">{{ _('Sign Up here') }}</a></p>
        <p>
            <a href="{{ request.url|urlencode('lang', 'en') }}">English</a> |
            <a href="{{ request.url|urlencode('lang', 'ar') }}">العربية</a> |
            <a href="{{ request.url|urlencode('lang', 'fr') }}">Français</a>
        </p>
    </div>
</body>
</html>
