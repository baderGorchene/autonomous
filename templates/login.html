<!DOCTYPE html>
<html lang="{{ current_locale() }}">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ title }} - BookSlot</title>
    <link rel="stylesheet" href="/static/style.css">
</head>
<body>
    <div class="container">
        <h1>{{ _("Login to BookSlot") }}</h1>
        {% if error %}
            <p style="color: red;">{{ error }}</p>
        {% endif %}
        {% if message %}
            <p style="color: green;">{{ message }}</p>
        {% endif %}
        <form action="/token" method="post">
            <label for="username">{{ _("Email:") }}</label>
            <input type="email" id="username" name="username" required>
            <label for="password">{{ _("Password:") }}</label>
            <input type="password" id="password" name="password" required>
            <button type="submit">{{ _("Login") }}</button>
        </form>
        <p>{{ _("Don't have an account?") }} <a href="/register">{{ _("Register here") }}</a></p>

        <div class="language-selector">
            <form action="/set-language-redirect" method="post" style="display:inline;">
                <input type="hidden" name="lang" value="en">
                <button type="submit" {% if current_locale() == 'en' %}disabled{% endif %}>English</button>
            </form>
            <form action="/set-language-redirect" method="post" style="display:inline;">
                <input type="hidden" name="lang" value="ar">
                <button type="submit" {% if current_locale() == 'ar' %}disabled{% endif %}>العربية</button>
            </form>
            <form action="/set-language-redirect" method="post" style="display:inline;">
                <input type="hidden" name="lang" value="fr">
                <button type="submit" {% if current_locale() == 'fr' %}disabled{% endif %}>Français</button>
            </form>
        </div>
    </div>
</body>
</html>
