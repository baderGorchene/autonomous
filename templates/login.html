<!DOCTYPE html>
<html lang="{{ current_locale }}">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ _("Login") }} - BookSlot</title>
    <link rel="stylesheet" href="/static/css/style.css">
</head>
<body>
    <div class="container">
        <h1>{{ _("Login to Your BookSlot Account") }}</h1>
        {% if error %}
            <p class="error-message">{{ error }}</p>
        {% endif %}
        <form action="/token" method="post">
            <label for="username">{{ _("Email:") }}</label>
            <input type="email" id="username" name="username" required>

            <label for="password">{{ _("Password:") }}</label>
            <input type="password" id="password" name="password" required>
            
            <button type="submit">{{ _("Login") }}</button>
        </form>
        <p>{{ _("Don't have an account?") }} <a href="/signup">{{ _("Sign up here") }}</a></p>
        <div class="language-switcher">
            <a href="/toggle-lang?lang=en" {% if current_locale == 'en' %}class="active"{% endif %}>English</a> |
            <a href="/toggle-lang?lang=ar" {% if current_locale == 'ar' %}class="active"{% endif %}>العربية</a> |
            <a href="/toggle-lang?lang=fr" {% if current_locale == 'fr' %}class="active"{% endif %}>Français</a>
        </div>
    </div>
</body>
</html>
