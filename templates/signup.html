{% extends "base.html" %}
{% block title %}{{ _("Sign Up") }}{% endblock %}
{% block content %}
<div class="container">
    <h1>{{ _("Owner Sign Up") }}</h1>
    <form action="/signup?lang={{ lang }}" method="post">
        {% if error %}<p class="error">{{ error }}</p>{% endif %}
        <label for="name">{{ _("Your Name") }}:</label>
        <input type="text" id="name" name="name" required>
        <label for="email">{{ _("Email") }}:</label>
        <input type="email" id="email" name="email" required>
        <label for="password">{{ _("Password") }}:</label>
        <input type="password" id="password" name="password" required>
        <label for="business_name">{{ _("Business Name") }}:</label>
        <input type="text" id="business_name" name="business_name" required>
        <label for="slug">{{ _("Booking Page URL Slug") }} (e.g., your-business):</label>
        <input type="text" id="slug" name="slug" required>
        <button type="submit">{{ _("Sign Up") }}</button>
    </form>
    <p>{{ _("Already have an account?") }} <a href="/login?lang={{ lang }}">{{ _("Login") }}</a></p>
</div>
{% endblock %}
