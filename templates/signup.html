{% extends "base.html" %}
{% block title %}{{ _('Sign Up') }} - BookSlot{% endblock %}
{% block content %}
    <h2>{{ _('Create your BookSlot account') }}</h2>
    {% if error %}
        <div class="alert alert-danger">{{ error }}</div>
    {% endif %}
    <form action="/signup" method="post">
        <div class="form-group">
            <label for="name">{{ _('Your Name') }}:</label>
            <input type="text" id="name" name="name" required>
        </div>
        <div class="form-group">
            <label for="email">{{ _('Email') }}:</label>
            <input type="email" id="email" name="email" required>
        </div>
        <div class="form-group">
            <label for="password">{{ _('Password') }}:</label>
            <input type="password" id="password" name="password" required>
        </div>
        <div class="form-group">
            <label for="business_name">{{ _('Business Name') }}:</label>
            <input type="text" id="business_name" name="business_name" required>
        </div>
        <div class="form-group">
            <label for="slug">{{ _('Your Booking URL (e.g., bookslot.app/your-name)') }}:</label>
            <input type="text" id="slug" name="slug" pattern="[a-z0-9-]+" title="{{ _('Lowercase letters, numbers, and hyphens only') }}" required>
        </div>
        <div class="form-group">
            <label for="phone">{{ _('Phone Number (for WhatsApp notifications)') }}:</label>
            <input type="tel" id="phone" name="phone" placeholder="+1234567890">
        </div>
        <button type="submit" class="btn">{{ _('Sign Up') }}</button>
    </form>
    <p>{{ _('Already have an account?') }} <a href="/login">{{ _('Login') }}</a></p>
{% endblock %}
