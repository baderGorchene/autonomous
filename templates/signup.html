<!DOCTYPE html>
<html lang="{{ request.state.locale }}">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ _('Sign Up - BookSlot') }}</title>
</head>
<body>
    <h1>{{ _('Sign Up') }}</h1>
    <form action="/signup" method="post">
        <label for="name">{{ _('Your Name:') }}</label><br>
        <input type="text" id="name" name="name" required><br>
        <label for="email">{{ _('Email:') }}</label><br>
        <input type="email" id="email" name="email" required><br>
        <label for="password">{{ _('Password:') }}</label><br>
        <input type="password" id="password" name="password" required><br>
        <label for="business_name">{{ _('Business Name:') }}</label><br>
        <input type="text" id="business_name" name="business_name" required><br>
        <label for="slug">{{ _('Booking Page URL (e.g., your-name):') }} bookslot.app/</label><br>
        <input type="text" id="slug" name="slug" pattern="^[a-z0-9-]+$" title="{{ _('Lowercase letters, numbers, and hyphens only.') }}" required><br>
        <label for="phone">{{ _('Phone Number (for WhatsApp notifications, optional):') }}</label><br>
        <input type="tel" id="phone" name="phone"><br>
        <input type="submit" value="{{ _('Sign Up') }}">
    </form>
    <p>{{ _('Already have an account?') }} <a href="/login">{{ _('Log In') }}</a></p>
    <div>
        <a href="?lang=en">English</a> | <a href="?lang=ar">العربية</a> | <a href="?lang=fr">Français</a>
    </div>
</body>
</html>
