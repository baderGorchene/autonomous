<!DOCTYPE html>
<html lang="{{ current_locale }}">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ _("Sign Up") }} - BookSlot</title>
    <link rel="stylesheet" href="/static/css/style.css">
</head>
<body>
    <div class="container">
        <h1>{{ _("Create Your BookSlot Account") }}</h1>
        {% if error %}
            <p class="error-message">{{ error }}</p>
        {% endif %}
        <form action="/signup" method="post">
            <label for="name">{{ _("Your Name:") }}</label>
            <input type="text" id="name" name="name" value="{{ name or '' }}" required>

            <label for="email">{{ _("Email:") }}</label>
            <input type="email" id="email" name="email" value="{{ email or '' }}" required>

            <label for="password">{{ _("Password:") }}</label>
            <input type="password" id="password" name="password" required>

            <label for="business_name">{{ _("Business Name:") }}</label>
            <input type="text" id="business_name" name="business_name" value="{{ business_name or '' }}" required>

            <label for="slug">{{ _("Your Booking Page URL (e.g., bookslot.app/your-slug):") }}</label>
            <input type="text" id="slug" name="slug" value="{{ slug or '' }}" required>
            
            <button type="submit">{{ _("Sign Up") }}</button>
        </form>
        <p>{{ _("Already have an account?") }} <a href="/login">{{ _("Log in here") }}</a></p>
        <div class="language-switcher">
            <a href="/toggle-lang?lang=en" {% if current_locale == 'en' %}class="active"{% endif %}>English</a> |
            <a href="/toggle-lang?lang=ar" {% if current_locale == 'ar' %}class="active"{% endif %}>العربية</a> |
            <a href="/toggle-lang?lang=fr" {% if current_locale == 'fr' %}class="active"{% endif %}>Français</a>
        </div>
    </div>
</body>
</html>
