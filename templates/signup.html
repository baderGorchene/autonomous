<!DOCTYPE html>
<html lang="{{ request.state.lang }}">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ _('Sign Up - BookSlot') }}</title>
    <link rel="stylesheet" href="/static/style.css">
</head>
<body>
    <div class="container">
        <h1>{{ _('Create Your BookSlot Account') }}</h1>
        {% if error %}
            <p class="error">{{ error }}</p>
        {% endif %}
        <form action="/signup" method="post">
            <label for="name">{{ _('Your Name') }}:</label>
            <input type="text" id="name" name="name" value="{{ name if name else '' }}" required>

            <label for="email">{{ _('Email') }}:</label>
            <input type="email" id="email" name="email" value="{{ email if email else '' }}" required>

            <label for="password">{{ _('Password') }}:</label>
            <input type="password" id="password" name="password" required>

            <label for="business_name">{{ _('Business Name') }}:</label>
            <input type="text" id="business_name" name="business_name" value="{{ business_name if business_name else '' }}" required>

            <label for="slug">{{ _('Your Booking Page URL (e.g., bookslot.app/your-name)') }}:</label>
            <input type="text" id="slug" name="slug" value="{{ slug if slug else '' }}" required>

            <label for="phone">{{ _('Phone Number (for WhatsApp notifications, optional)') }}:</label>
            <input type="tel" id="phone" name="phone" value="{{ phone if phone else '' }}">

            <button type="submit">{{ _('Sign Up') }}</button>
        </form>
        <p>{{ _('Already have an account?') }} <a href="/login">{{ _('Login here') }}</a></p>
        <p>
            <a href="{{ request.url|urlencode('lang', 'en') }}">English</a> |
            <a href="{{ request.url|urlencode('lang', 'ar') }}">العربية</a> |
            <a href="{{ request.url|urlencode('lang', 'fr') }}">Français</a>
        </p>
    </div>
</body>
</html>
