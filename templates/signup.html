<!-- templates/signup.html -->
{% extends "base.html" %}
{% block title %}{{ _("Sign Up") }}{% endblock %}

{% block content %}
<div class="container mx-auto p-4 flex justify-center items-center min-h-[calc(100vh-160px)]">
    <div class="bg-white shadow-md rounded-lg p-8 w-full max-w-md">
        <h1 class="text-3xl font-bold mb-6 text-center">{{ _("Sign Up for BookSlot") }}</h1>
        <form action="/signup" method="post" class="space-y-4">
            <div>
                <label for="name" class="block text-sm font-medium text-gray-700">{{ _("Your Name") }}:</label>
                <input type="text" id="name" name="name" required
                       class="mt-1 block w-full border border-gray-300 rounded-md shadow-sm p-2">
            </div>
            <div>
                <label for="email" class="block text-sm font-medium text-gray-700">{{ _("Email") }}:</label>
                <input type="email" id="email" name="email" required
                       class="mt-1 block w-full border border-gray-300 rounded-md shadow-sm p-2">
            </div>
            <div>
                <label for="phone" class="block text-sm font-medium text-gray-700">{{ _("Phone Number (WhatsApp)") }}:</label>
                <input type="tel" id="phone" name="phone"
                       class="mt-1 block w-full border border-gray-300 rounded-md shadow-sm p-2" placeholder="+1234567890">
            </div>
            <div>
                <label for="password" class="block text-sm font-medium text-gray-700">{{ _("Password") }}:</label>
                <input type="password" id="password" name="password" required
                       class="mt-1 block w-full border border-gray-300 rounded-md shadow-sm p-2">
            </div>
            <button type="submit"
                    class="w-full px-4 py-2 bg-blue-600 text-white rounded-md hover:bg-blue-700 focus:outline-none focus:ring-2 focus:ring-blue-500 focus:ring-offset-2">
                {{ _("Sign Up") }}
            </button>
        </form>
        <p class="mt-6 text-center text-gray-600">
            {{ _("Already have an account?") }} <a href="/login" class="text-blue-600 hover:underline">{{ _("Login here") }}</a>
        </p>
    </div>
</div>
{% endblock %}
