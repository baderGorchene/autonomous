{% extends "base.html" %}

{% block title %}{{ _("Sign Up") }} - BookSlot{% endblock %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-md-6">
        <div class="card mt-5">
            <div class="card-header text-center">
                <h3>{{ _("Owner Sign Up") }}</h3>
            </div>
            <div class="card-body">
                <form id="signupForm">
                    <div class="mb-3">
                        <label for="name" class="form-label">{{ _("Your Name") }}</label>
                        <input type="text" class="form-control" id="name" required>
                    </div>
                    <div class="mb-3">
                        <label for="email" class="form-label">{{ _("Email address") }}</label>
                        <input type="email" class="form-control" id="email" required>
                    </div>
                    <div class="mb-3">
                        <label for="business_name" class="form-label">{{ _("Business Name") }}</label>
                        <input type="text" class="form-control" id="business_name" required>
                    </div>
                    <div class="mb-3">
                        <label for="slug" class="form-label">{{ _("Public Page URL Slug (e.g., your-business-name)") }}</label>
                        <input type="text" class="form-control" id="slug" required>
                    </div>
                    <div class="mb-3">
                        <label for="phone" class="form-label">{{ _("Phone Number (Optional)") }}</label>
                        <input type="tel" class="form-control" id="phone">
                    </div>
                    <div class="mb-3">
                        <label for="password" class="form-label">{{ _("Password") }}</label>
                        <input type="password" class="form-control" id="password" required>
                    </div>
                    <button type="submit" class="btn btn-primary w-100">{{ _("Sign Up") }}</button>
                </form>
                <div class="mt-3 text-center">
                    {{ _("Already have an account?") }} <a href="/login?lang={{ locale }}">{{ _("Login") }}</a>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}

{% block scripts_extra %}
<script>
    document.getElementById('signupForm').addEventListener('submit', async function(event) {
        event.preventDefault();
        const name = document.getElementById('name').value;
        const email = document.getElementById('email').value;
        const business_name = document.getElementById('business_name').value;
        const slug = document.getElementById('slug').value;
        const phone = document.getElementById('phone').value;
        const password = document.getElementById('password').value;

        try {
            const response = await fetch('/signup', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json',
                },
                body: JSON.stringify({ name, email, business_name, slug, phone, password })
            });

            if (response.ok) {
                alert('Account created successfully! Please log in.');
                window.location.href = '/login?lang={{ locale }}';
            } else {
                const errorData = await response.json();
                alert('Sign up failed: ' + (errorData.detail || 'An error occurred'));
            }
        } catch (error) {
            console.error('Network error:', error);
            alert('A network error occurred during sign up.');
        }
    });
</script>
{% endblock %}
