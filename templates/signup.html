<!DOCTYPE html>
<html lang="{{ lang }}">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ _("BookSlot Signup") }}</title>
    <link rel="stylesheet" href="/static/css/style.css">
</head>
<body>
    <header>
        <div class="container">
            <h1>{{ _("BookSlot") }}</h1>
            <div class="language-toggle">
                <a href="?lang=en">EN</a> | <a href="?lang=ar">AR</a> | <a href="?lang=fr">FR</a>
            </div>
        </div>
    </header>

    <main class="container">
        <section class="signup-section">
            <h2>{{ _("Create your BookSlot Account") }}</h2>
            {% if error_message %}
            <p class="error-message">{{ error_message }}</p>
            {% endif %}
            <form action="/auth/signup?lang={{ lang }}" method="post" class="signup-form">
                <div class="form-group">
                    <label for="name">{{ _("Your Name") }}:</label>
                    <input type="text" id="name" name="name" required>
                </div>
                <div class="form-group">
                    <label for="business_name">{{ _("Business Name") }}:</label>
                    <input type="text" id="business_name" name="business_name" required>
                </div>
                <div class="form-group">
                    <label for="slug">{{ _("Your Booking Page Link (e.g., your-name)") }}:</label>
                    <input type="text" id="slug" name="slug" required pattern="[a-z0-9-]+" title="{{ _('Only lowercase letters, numbers, and hyphens') }}">
                </div>
                <div class="form-group">
                    <label for="email">{{ _("Email") }}:</label>
                    <input type="email" id="email" name="email" required>
                </div>
                <div class="form-group">
                    <label for="password">{{ _("Password") }}:</label>
                    <input type="password" id="password" name="password" required>
                </div>
                <button type="submit" class="button-primary">{{ _("Sign Up") }}</button>
            </form>
            <p>{{ _("Already have an account?") }} <a href="/auth/login?lang={{ lang }}">{{ _("Log in here") }}</a></p>
        </section>
    </main>

    <footer>
        <div class="container">
            <p>&copy; 2023 BookSlot</p>
        </div>
    </footer>
</body>
</html>
