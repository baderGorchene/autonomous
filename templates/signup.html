{% extends "base.html" %}

{% block title %}{{ _("Sign Up") }}{% endblock %}

{% block content %}
<div class="max-w-md mx-auto bg-white p-8 rounded-lg shadow-md mt-10">
    <h2 class="text-3xl font-bold text-center text-gray-800 mb-6">{{ _("Create your BookSlot account") }}</h2>
    <form action="/signup" method="post" class="space-y-4">
        <div>
            <label for="name" class="block text-sm font-medium text-gray-700">{{ _("Your Name") }}</label>
            <input type="text" id="name" name="name" required
                   class="mt-1 block w-full px-3 py-2 border border-gray-300 rounded-md shadow-sm focus:outline-none focus:ring-blue-500 focus:border-blue-500 sm:text-sm">
        </div>
        <div>
            <label for="email" class="block text-sm font-medium text-gray-700">{{ _("Email Address") }}</label>
            <input type="email" id="email" name="email" required
                   class="mt-1 block w-full px-3 py-2 border border-gray-300 rounded-md shadow-sm focus:outline-none focus:ring-blue-500 focus:border-blue-500 sm:text-sm">
        </div>
        <div>
            <label for="password" class="block text-sm font-medium text-gray-700">{{ _("Password") }}</label>
            <input type="password" id="password" name="password" required
                   class="mt-1 block w-full px-3 py-2 border border-gray-300 rounded-md shadow-sm focus:outline-none focus:ring-blue-500 focus:border-blue-500 sm:text-sm">
        </div>
        <div>
            <label for="business_name" class="block text-sm font-medium text-gray-700">{{ _("Business Name") }}</label>
            <input type="text" id="business_name" name="business_name" required
                   class="mt-1 block w-full px-3 py-2 border border-gray-300 rounded-md shadow-sm focus:outline-none focus:ring-blue-500 focus:border-blue-500 sm:text-sm">
        </div>
        <div>
            <label for="phone" class="block text-sm font-medium text-gray-700">{{ _("Phone Number (Optional)") }}</label>
            <input type="tel" id="phone" name="phone"
                   class="mt-1 block w-full px-3 py-2 border border-gray-300 rounded-md shadow-sm focus:outline-none focus:ring-blue-500 focus:border-blue-500 sm:text-sm">
        </div>
        <div>
            <label for="slug" class="block text-sm font-medium text-gray-700">{{ _("Your Booking Page URL (e.g., your-business-name)") }}</label>
            <div class="mt-1 flex rounded-md shadow-sm">
                <span class="inline-flex items-center px-3 rounded-l-md border border-r-0 border-gray-300 bg-gray-50 text-gray-500 sm:text-sm">
                    bookslot.app/
                </span>
                <input type="text" id="slug" name="slug" required pattern="^[a-z0-9-]+$" title="{{ _('Lowercase letters, numbers, and hyphens only') }}"
                       class="flex-1 block w-full px-3 py-2 border border-gray-300 rounded-r-md focus:outline-none focus:ring-blue-500 focus:border-blue-500 sm:text-sm">
            </div>
            <p class="mt-2 text-sm text-gray-500">{{ _("This will be your unique booking page URL.") }}</p>
        </div>
        <button type="submit"
                class="w-full flex justify-center py-2 px-4 border border-transparent rounded-md shadow-sm text-sm font-medium text-white bg-blue-600 hover:bg-blue-700 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-blue-500">
            {{ _("Sign Up") }}
        </button>
    </form>
    <p class="mt-6 text-center text-sm text-gray-600">
        {{ _("Already have an account?") }}
        <a href="/login" class="font-medium text-blue-600 hover:text-blue-500">{{ _("Login here") }}</a>
    </p>
</div>
{% endblock %}
