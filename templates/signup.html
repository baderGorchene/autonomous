{% extends "base.html" %}
{% block title %}{{ _('Sign Up') }}{% endblock %}
{% block content %}
<div class="container signup-container">
    <h2>{{ _('Sign Up for BookSlot') }}</h2>
    {% if error %}
    <div class="alert alert-danger">{{ error }}</div>
    {% endif %}
    <form action="/signup" method="post">
        <div class="mb-3">
            <label for="name" class="form-label">{{ _('Your Name') }}</label>
            <input type="text" class="form-control" id="name" name="name" required>
        </div>
        <div class="mb-3">
            <label for="email" class="form-label">{{ _('Email address') }}</label>
            <input type="email" class="form-control" id="email" name="email" required>
        </div>
        <div class="mb-3">
            <label for="password" class="form-label">{{ _('Password') }}</label>
            <input type="password" class="form-control" id="password" name="password" required>
        </div>
        <div class="mb-3">
            <label for="business_name" class="form-label">{{ _('Business Name') }}</label>
            <input type="text" class="form-control" id="business_name" name="business_name" required>
        </div>
        <div class="mb-3">
            <label for="slug" class="form-label">{{ _('Your Booking Page URL Slug (e.g., bookslot.app/your-slug)') }}</label>
            <input type="text" class="form-control" id="slug" name="slug" required pattern="^[a-z0-9]+(?:-[a-z0-9]+)*$" title="Slug must be lowercase alphanumeric, separated by hyphens.">
        </div>
        <button type="submit" class="btn btn-primary">{{ _('Sign Up') }}</button>
    </form>
    <p class="mt-3">{{ _('Already have an account?') }} <a href="/login">{{ _('Login') }}</a></p>
</div>
{% endblock %}
