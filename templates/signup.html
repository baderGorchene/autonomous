{% extends "base.html" %}

{% block title %}{{ _('Sign Up for BookSlot') }}{% endblock %}

{% block content %}
<div class="max-w-md mx-auto bg-white p-8 rounded-lg shadow-md">
    <h2 class="text-2xl font-bold text-gray-800 mb-6 text-center">{{ _('Sign Up') }}</h2>
    <form action="/signup" method="post" class="space-y-4">
        <div>
            <label for="name" class="block text-gray-700 text-sm font-bold mb-2">{{ _('Your Name') }}:</label>
            <input type="text" id="name" name="name" required class="shadow appearance-none border rounded w-full py-2 px-3 text-gray-700 leading-tight focus:outline-none focus:shadow-outline">
        </div>
        <div>
            <label for="email" class="block text-gray-700 text-sm font-bold mb-2">{{ _('Email') }}:</label>
            <input type="email" id="email" name="email" required class="shadow appearance-none border rounded w-full py-2 px-3 text-gray-700 leading-tight focus:outline-none focus:shadow-outline">
        </div>
        <div>
            <label for="password" class="block text-gray-700 text-sm font-bold mb-2">{{ _('Password') }}:</label>
            <input type="password" id="password" name="password" required class="shadow appearance-none border rounded w-full py-2 px-3 text-gray-700 mb-3 leading-tight focus:outline-none focus:shadow-outline">
        </div>
        <div>
            <label for="business_name" class="block text-gray-700 text-sm font-bold mb-2">{{ _('Business Name') }}:</label>
            <input type="text" id="business_name" name="business_name" required class="shadow appearance-none border rounded w-full py-2 px-3 text-gray-700 leading-tight focus:outline-none focus:shadow-outline">
        </div>
        <div>
            <label for="slug" class="block text-gray-700 text-sm font-bold mb-2">{{ _('Your Booking Page URL (e.g., your-name)') }}:</label>
            <div class="flex">
                <span class="inline-flex items-center px-3 rounded-l-md border border-r-0 border-gray-300 bg-gray-50 text-gray-500 text-sm">
                    bookslot.app/
                </span>
                <input type="text" id="slug" name="slug" required pattern="[a-z0-9-]+" title="{{ _('Lowercase letters, numbers, and hyphens only.') }}" class="flex-1 shadow appearance-none border rounded-r-md w-full py-2 px-3 text-gray-700 leading-tight focus:outline-none focus:shadow-outline">
            </div>
            <p class="text-xs text-gray-500 mt-1">{{ _('This will be your unique public booking page link.') }}</p>
        </div>
        <div>
            <label for="phone" class="block text-gray-700 text-sm font-bold mb-2">{{ _('Phone Number (e.g., +1234567890 for WhatsApp notifications)') }}:</label>
            <input type="tel" id="phone" name="phone" class="shadow appearance-none border rounded w-full py-2 px-3 text-gray-700 leading-tight focus:outline-none focus:shadow-outline">
        </div>
        <button type="submit" class="bg-blue-600 hover:bg-blue-700 text-white font-bold py-2 px-4 rounded focus:outline-none focus:shadow-outline w-full">
            {{ _('Create Account') }}
        </button>
    </form>
    <p class="mt-6 text-center text-gray-600">
        {{ _('Already have an account?') }} <a href="/login" class="text-blue-600 hover:text-blue-800 font-bold">{{ _('Login') }}</a>
    </p>
</div>
{% endblock %}
