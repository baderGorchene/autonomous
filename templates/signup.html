<!DOCTYPE html>
<html lang="{{ request.cookies.get('locale', 'en') }}">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ _('Sign Up for BookSlot') }}</title>
    <link rel="stylesheet" href="/static/style.css">
</head>
<body>
    <div class="auth-container">
        <h2>{{ _('Sign Up') }}</h2>
        {% if error %}
            <p class="error-message">{{ error }}</p>
        {% endif %}
        <form action="/signup" method="post">
            <label for="name">{{ _('Your Name:') }}</label>
            <input type="text" id="name" name="name" required>

            <label for="email">{{ _('Email:') }}</label>
            <input type="email" id="email" name="email" required>

            <label for="password">{{ _('Password:') }}</label>
            <input type="password" id="password" name="password" required>
            
            <label for="business_name">{{ _('Business Name:') }}</label>
            <input type="text" id="business_name" name="business_name" required>
            
            <label for="slug">{{ _('Booking Page URL (e.g., your-name):') }}</label>
            <span>bookslot.app/</span><input type="text" id="slug" name="slug" pattern="[a-zA-Z0-9-]+" title="{{ _('Only letters, numbers, and hyphens allowed.') }}" required>
            
            <label for="phone">{{ _('Phone Number (for WhatsApp notifications, optional):') }}</label>
            <input type="tel" id="phone" name="phone" placeholder="{{ _('e.g., +15551234567') }}">
            
            <button type="submit">{{ _('Create Account') }}</button>
        </form>
        <p>{{ _('Already have an account?') }} <a href="/login">{{ _('Login') }}</a></p>
        <form action="/set-locale" method="post" style="text-align: center; margin-top: 20px;">
            <select name="locale" onchange="this.form.submit()">
                <option value="en" {% if request.cookies.get('locale') == 'en' %}selected{% endif %}>English</option>
                <option value="ar" {% if request.cookies.get('locale') == 'ar' %}selected{% endif %}>العربية</option>
                <option value="fr" {% if request.cookies.get('locale') == 'fr' %}selected{% endif %}>Français</option>
            </select>
        </form>
    </div>
</body>
</html>
