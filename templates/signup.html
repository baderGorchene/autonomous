{% extends "base.html" %}

{% block title %}Signup - BookSlot{% endblock %}

{% block page_title %}{{ _("Sign Up for BookSlot") }}{% endblock %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-md-8">
        <form action="/signup" method="post">
            {% if error %}
            <div class="alert alert-danger">{{ error }}</div>
            {% endif %}
            <div class="mb-3">
                <label for="name" class="form-label">{{ _("Your Name") }}</label>
                <input type="text" class="form-control" id="name" name="name" required>
            </div>
            <div class="mb-3">
                <label for="business_name" class="form-label">{{ _("Your Business Name") }}</label>
                <input type="text" class="form-control" id="business_name" name="business_name" required>
            </div>
            <div class="mb-3">
                <label for="slug" class="form-label">{{ _("Custom URL Slug (e.g., bookslot.app/your-slug)") }}</label>
                <input type="text" class="form-control" id="slug" name="slug" required pattern="[a-z0-9-]+" title="{{ _('Only lowercase letters, numbers, and hyphens') }}">
            </div>
            <div class="mb-3">
                <label for="email" class="form-label">{{ _("Email address") }}</label>
                <input type="email" class="form-control" id="email" name="email" required>
            </div>
            <div class="mb-3">
                <label for="phone" class="form-label">{{ _("Phone Number (Optional, for WhatsApp notifications)") }}</label>
                <input type="tel" class="form-control" id="phone" name="phone">
            </div>
            <div class="mb-3">
                <label for="password" class="form-label">{{ _("Password") }}</label>
                <input type="password" class="form-control" id="password" name="password" required minlength="6">
            </div>
            <button type="submit" class="btn btn-primary">{{ _("Sign Up") }}</button>
            <p class="mt-3">{{ _("Already have an account?") }} <a href="/login">{{ _("Login here") }}</a></p>
        </form>
    </div>
</div>
{% endblock %}
