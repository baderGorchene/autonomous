{% extends "base.html" %}
{% block title %}{{ 'Sign Up' | i18n }}{% endblock %}
{% block content %}
<div class="max-w-md mx-auto bg-white p-8 rounded-lg shadow-md mt-10">
    <h2 class="text-2xl font-bold text-center mb-6">{{ 'Create Your BookSlot Account' | i18n }}</h2>
    {% if error %}
        <p class="error-message text-center">{{ error | i18n }}</p>
    {% endif %}
    <form hx-post="/signup" hx-swap="outerHTML" hx-target="#signup-form-container" id="signup-form-container">
        <div class="mb-4">
            <label for="name" class="block text-gray-700 text-sm font-bold mb-2">{{ 'Your Name' | i18n }}:</label>
            <input type="text" id="name" name="name" class="shadow appearance-none border rounded w-full py-2 px-3 text-gray-700 leading-tight focus:outline-none focus:shadow-outline" required>
        </div>
        <div class="mb-4">
            <label for="email" class="block text-gray-700 text-sm font-bold mb-2">{{ 'Email' | i18n }}:</label>
            <input type="email" id="email" name="email" class="shadow appearance-none border rounded w-full py-2 px-3 text-gray-700 leading-tight focus:outline-none focus:shadow-outline" required>
        </div>
        <div class="mb-4">
            <label for="password" class="block text-gray-700 text-sm font-bold mb-2">{{ 'Password' | i18n }}:</label>
            <input type="password" id="password" name="password" class="shadow appearance-none border rounded w-full py-2 px-3 text-gray-700 leading-tight focus:outline-none focus:shadow-outline" required>
        </div>
        <div class="mb-4">
            <label for="business_name" class="block text-gray-700 text-sm font-bold mb-2">{{ 'Business Name' | i18n }}:</label>
            <input type="text" id="business_name" name="business_name" class="shadow appearance-none border rounded w-full py-2 px-3 text-gray-700 leading-tight focus:outline-none focus:shadow-outline" required>
        </div>
        <div class="mb-4">
            <label for="phone" class="block text-gray-700 text-sm font-bold mb-2">{{ 'Phone Number (optional)' | i18n }}:</label>
            <input type="tel" id="phone" name="phone" class="shadow appearance-none border rounded w-full py-2 px-3 text-gray-700 leading-tight focus:outline-none focus:shadow-outline">
        </div>
        <div class="mb-6">
            <label for="slug" class="block text-gray-700 text-sm font-bold mb-2">{{ 'Your Booking Page URL' | i18n }} (bookslot.app/):</label>
            <input type="text" id="slug" name="slug" class="shadow appearance-none border rounded w-full py-2 px-3 text-gray-700 leading-tight focus:outline-none focus:shadow-outline" pattern="^[a-z0-9-]+$" title="{{ 'Only lowercase letters, numbers, and hyphens allowed.' | i18n }}" required>
        </div>
        <div class="flex items-center justify-between">
            <button type="submit" class="bg-indigo-600 hover:bg-indigo-700 text-white font-bold py-2 px-4 rounded focus:outline-none focus:shadow-outline">
                {{ 'Sign Up' | i18n }}
            </button>
            <a class="inline-block align-baseline font-bold text-sm text-indigo-600 hover:text-indigo-800" href="/login">
                {{ 'Already have an account? Log In' | i18n }}
            </a>
        </div>
    </form>
</div>
{% endblock %}
