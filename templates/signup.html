{% extends "base.html" %}
{% block title %}{{ request.state.gettext('Sign Up') }}{% endblock %}
{% block content %}
    <h2>{{ request.state.gettext('Sign Up') }}</h2>
    <form action="/signup" method="post">
        <label for="name">{{ request.state.gettext('Your Name:') }}</label>
        <input type="text" id="name" name="name" required><br>
        <label for="email">{{ request.state.gettext('Email:') }}</label>
        <input type="email" id="email" name="email" required><br>
        <label for="password">{{ request.state.gettext('Password:') }}</label>
        <input type="password" id="password" name="password" required><br>
        <label for="business_name">{{ request.state.gettext('Business Name:') }}</label>
        <input type="text" id="business_name" name="business_name" required><br>
        <label for="slug">{{ request.state.gettext('Booking Page URL Slug (e.g., your-name):') }}</label>
        <input type="text" id="slug" name="slug" required><br>
        <button type="submit">{{ request.state.gettext('Register') }}</button>
    </form>
{% endblock %}
