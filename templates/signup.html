<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ gettext('Sign Up') }}</title>
    <link rel="stylesheet" href="/static/style.css">
</head>
<body>
    <div class="container">
        <h1>{{ gettext('Sign Up for BookSlot') }}</h1>
        {% if error %}
            <p style="color: red;">{{ error }}</p>
        {% endif %}
        <form action="/signup" method="post">
            <label for="name">{{ gettext('Your Name') }}:</label>
            <input type="text" id="name" name="name" required>
            <label for="email">{{ gettext('Email') }}:</label>
            <input type="email" id="email" name="email" required>
            <label for="password">{{ gettext('Password') }}:</label>
            <input type="password" id="password" name="password" required>
            <label for="business_name">{{ gettext('Business Name') }}:</label>
            <input type="text" id="business_name" name="business_name" required>
            <label for="slug">{{ gettext('Your unique booking page link (e.g., bookslot.app/your-slug)') }}:</label>
            <input type="text" id="slug" name="slug" required>
            <button type="submit">{{ gettext('Sign Up') }}</button>
        </form>
        <p>{{ gettext('Already have an account?') }} <a href="/login">{{ gettext('Login') }}</a></p>
    </div>
</body>
</html>
