<!DOCTYPE html>
<html lang="{{ current_locale }}">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ title }}</title>
    <link href="https://cdn.jsdelivr.net/npm/tailwindcss@2.2.19/dist/tailwind.min.css" rel="stylesheet">
</head>
<body class="bg-gray-100 flex items-center justify-center min-h-screen">
    <div class="bg-white p-8 rounded-lg shadow-md w-full max-w-md">
        <h2 class="text-2xl font-bold text-gray-800 mb-6 text-center">{{ _("Sign Up for BookSlot") }}</h2>
        {% if error_message %}
        <div class="mb-4 bg-red-100 border border-red-400 text-red-700 px-4 py-2 rounded text-sm text-center">
            {{ error_message }}
        </div>
        {% endif %}
        <form action="/signup" method="POST" class="space-y-4">
            <div>
                <label for="name" class="block text-sm font-medium text-gray-700">{{ _("Your Name") }}</label>
                <input type="text" id="name" name="name" required class="mt-1 block w-full border border-gray-300 rounded-md shadow-sm p-2 focus:ring-indigo-500 focus:border-indigo-500" placeholder="e.g. Sarah Connor">
            </div>
            <div>
                <label for="business_name" class="block text-sm font-medium text-gray-700">{{ _("Business Name") }}</label>
                <input type="text" id="business_name" name="business_name" class="mt-1 block w-full border border-gray-300 rounded-md shadow-sm p-2 focus:ring-indigo-500 focus:border-indigo-500" placeholder="e.g. Sarah's Hair Studio">
            </div>
            <div>
                <label for="slug" class="block text-sm font-medium text-gray-700">{{ _("Booking Page Link") }}</label>
                <div class="mt-1 flex rounded-md shadow-sm">
                    <span class="inline-flex items-center px-3 rounded-l-md border border-r-0 border-gray-300 bg-gray-50 text-gray-500 text-sm">/book/</span>
                    <input type="text" id="slug" name="slug" class="flex-1 block w-full rounded-none rounded-r-md border border-gray-300 p-2 focus:ring-indigo-500 focus:border-indigo-500" placeholder="sarah-hair-studio">
                </div>
            </div>
            <div>
                <label for="email" class="block text-sm font-medium text-gray-700">{{ _("Email Address") }}</label>
                <input type="email" id="email" name="email" required class="mt-1 block w-full border border-gray-300 rounded-md shadow-sm p-2 focus:ring-indigo-500 focus:border-indigo-500" placeholder="you@example.com">
            </div>
            <div>
                <label for="phone" class="block text-sm font-medium text-gray-700">{{ _("Phone Number (optional)") }}</label>
                <input type="text" id="phone" name="phone" class="mt-1 block w-full border border-gray-300 rounded-md shadow-sm p-2 focus:ring-indigo-500 focus:border-indigo-500" placeholder="+1234567890">
            </div>
            <div>
                <label for="password" class="block text-sm font-medium text-gray-700">{{ _("Password") }}</label>
                <input type="password" id="password" name="password" required class="mt-1 block w-full border border-gray-300 rounded-md shadow-sm p-2 focus:ring-indigo-500 focus:border-indigo-500" placeholder="••••••••">
            </div>
            <button type="submit" class="bg-indigo-600 text-white py-2 px-4 rounded-md hover:bg-indigo-700 transition-colors w-full font-medium">{{ _("Sign Up") }}</button>
        </form>
        <script>
            const bizInput = document.getElementById('business_name');
            const nameInput = document.getElementById('name');
            const slugInput = document.getElementById('slug');
            function updateSlug() {
                if (!slugInput.dataset.manual) {
                    const source = bizInput.value || nameInput.value;
                    slugInput.value = source.toLowerCase().replace(/[^a-z0-9]+/g, '-').replace(/^-+|-+$/g, '');
                }
            }
            bizInput.addEventListener('input', updateSlug);
            nameInput.addEventListener('input', () => { if (!bizInput.value) updateSlug(); });
            slugInput.addEventListener('input', () => { slugInput.dataset.manual = 'true'; });
        </script>
        <p class="mt-6 text-center text-gray-600">{{ _("Already have an account?") }} <a href="/login" class="text-indigo-600 hover:underline">{{ _("Login here") }}</a></p>
    </div>
</body>
</html>
