<!DOCTYPE html>
<html lang="{{ request.state.lang }}">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ gettext("Sign Up - BookSlot") }}</title>
    <link href="https://cdn.jsdelivr.net/npm/tailwindcss@2.2.19/dist/tailwind.min.css" rel="stylesheet">
</head>
<body class="bg-gray-100 flex items-center justify-center min-h-screen">
    <div class="bg-white p-8 rounded-lg shadow-md w-full max-w-md">
        <h1 class="text-2xl font-bold mb-6 text-center text-gray-800">{{ gettext("Create Your BookSlot Account") }}</h1>
        
        {% if msg %}
            <div class="bg-blue-100 border border-blue-400 text-blue-700 px-4 py-3 rounded relative mb-4" role="alert">
                <span class="block sm:inline">{{ msg }}</span>
            </div>
        {% endif %}

        <form action="/signup" method="post" class="space-y-4">
            <div>
                <label for="name" class="block text-sm font-medium text-gray-700">{{ gettext("Your Name") }}</label>
                <input type="text" id="name" name="name" required class="mt-1 block w-full px-3 py-2 border border-gray-300 rounded-md shadow-sm focus:outline-none focus:ring-blue-500 focus:border-blue-500">
            </div>
            <div>
                <label for="email" class="block text-sm font-medium text-gray-700">{{ gettext("Email") }}</label>
                <input type="email" id="email" name="email" required class="mt-1 block w-full px-3 py-2 border border-gray-300 rounded-md shadow-sm focus:outline-none focus:ring-blue-500 focus:border-blue-500">
            </div>
            <div>
                <label for="password" class="block text-sm font-medium text-gray-700">{{ gettext("Password") }}</label>
                <input type="password" id="password" name="password" required class="mt-1 block w-full px-3 py-2 border border-gray-300 rounded-md shadow-sm focus:outline-none focus:ring-blue-500 focus:border-blue-500">
            </div>
            <div>
                <label for="business_name" class="block text-sm font-medium text-gray-700">{{ gettext("Business Name") }}</label>
                <input type="text" id="business_name" name="business_name" required class="mt-1 block w-full px-3 py-2 border border-gray-300 rounded-md shadow-sm focus:outline-none focus:ring-blue-500 focus:border-blue-500">
            </div>
            <div>
                <label for="slug" class="block text-sm font-medium text-gray-700">
                    {{ gettext("Your Booking Page URL (e.g., bookslot.app/") }}<span class="font-bold">your-name</span>{{ gettext(")") }}
                </label>
                <input type="text" id="slug" name="slug" required pattern="^[a-z0-9-]+" title="{{ gettext('Only lowercase letters, numbers, and hyphens allowed.') }}" class="mt-1 block w-full px-3 py-2 border border-gray-300 rounded-md shadow-sm focus:outline-none focus:ring-blue-500 focus:border-blue-500">
            </div>
            <div>
                <label for="phone" class="block text-sm font-medium text-gray-700">{{ gettext("Phone Number (Optional)") }}</label>
                <input type="tel" id="phone" name="phone" class="mt-1 block w-full px-3 py-2 border border-gray-300 rounded-md shadow-sm focus:outline-none focus:ring-blue-500 focus:border-blue-500">
            </div>
            <div>
                <button type="submit" class="w-full flex justify-center py-2 px-4 border border-transparent rounded-md shadow-sm text-sm font-medium text-white bg-blue-600 hover:bg-blue-700 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-blue-500">
                    {{ gettext("Sign Up") }}
                </button>
            </div>
        </form>
        <p class="mt-6 text-center text-sm text-gray-600">
            {{ gettext("Already have an account?") }}
            <a href="/login" class="font-medium text-blue-600 hover:text-blue-500">{{ gettext("Log in") }}</a>
        </p>

        <div class="mt-8 text-center">
            <h3 class="text-lg font-semibold mb-2">{{ gettext("Change Language:") }}</h3>
            <div class="flex justify-center space-x-4">
                <a href="{{ request.url|update_query_param('lang', 'en') }}" class="text-blue-500 hover:underline">English</a>
                <a href="{{ request.url|update_query_param('lang', 'ar') }}" class="text-blue-500 hover:underline">العربية</a>
                <a href="{{ request.url|update_query_param('lang', 'fr') }}" class="text-blue-500 hover:underline">Français</a>
            </div>
        </div>
    </div>
</body>
</html>
