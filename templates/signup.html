<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>{{ _('Sign Up') }} - BookSlot</title><link rel="stylesheet" href="/static/style.css"></head><body><div class="container"><h1>{{ _('Create Your BookSlot Account') }}</h1>{% if error_message %}<p class="error-message">{{ error_message }}</p>{% endif %}<form action="/signup" method="post"><label for="name">{{ _('Your Name') }}:</label><input type="text" id="name" name="name" required><label for="email">{{ _('Email') }}:</label><input type="email" id="email" name="email" required><label for="password">{{ _('Password') }}:</label><input type="password" id="password" name="password" required><label for="business_name">{{ _('Business Name') }}:</label><input type="text" id="business_name" name="business_name" required><label for="slug">{{ _('Public Booking Page URL Slug') }} (e.g., bookslot.app/your-slug):</label><input type="text" id="slug" name="slug" pattern="^[a-z0-9-]+$" minlength="3" maxlength="50" title="{{ _('Lowercase letters, numbers, and hyphens only. Min 3, max 50 characters.') }}" required><label for="phone">{{ _('Phone Number (for WhatsApp notifications, optional)') }}:</label><input type="tel" id="phone" name="phone"><button type="submit">{{ _('Sign Up') }}</button></form><p>{{ _('Already have an account?') }} <a href="/login">{{ _('Log In') }}</a></p></div></body></html>
