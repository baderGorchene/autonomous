<!DOCTYPE html>
<html lang="{{ lang }}">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ gettext('Sign Up - BookSlot') }}</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@picocss/pico@1/css/pico.min.css">
    <style>
        body { display: flex; flex-direction: column; min-height: 100vh; }
        main { flex-grow: 1; display: flex; align-items: center; justify-content: center; }
        .container { max-width: 500px; margin: auto; padding: 1rem; }
        .error-message { color: var(--pico-del-color); margin-top: 1rem; }
        .language-toggle { text-align: right; margin-bottom: 1rem; }
    </style>
</head>
<body>
    <nav class="container-fluid">
        <ul>
            <li><strong>BookSlot</strong></li>
        </ul>
        <ul>
            <li><a href="/login">{{ gettext('Login') }}</a></li>
            <li>
                <details role="list" dir="rtl">
                    <summary aria-haspopup="listbox" role="link" class="secondary">{{ gettext('Language') }}</summary>
                    <ul role="listbox">
                        <li><a href="?lang=en">English</a></li>
                        <li><a href="?lang=ar">العربية</a></li>
                        <li><a href="?lang=fr">Français</a></li>
                    </ul>
                </details>
            </li>
        </ul>
    </nav>
    <main class="container">
        <article>
            <hgroup>
                <h1>{{ gettext('Sign Up') }}</h1>
                <h2>{{ gettext('Create your BookSlot account') }}</h2>
            </hgroup>
            {% if error %}
                <p class="error-message">{{ error }}</p>
            {% endif %}
            <form action="/signup" method="post">
                <label for="name">{{ gettext('Your Name') }}</label>
                <input type="text" id="name" name="name" required>

                <label for="email">{{ gettext('Email') }}</label>
                <input type="email" id="email" name="email" required>

                <label for="password">{{ gettext('Password') }}</label>
                <input type="password" id="password" name="password" required>

                <label for="business_name">{{ gettext('Business Name') }}</label>
                <input type="text" id="business_name" name="business_name" required>

                <label for="slug">{{ gettext('Your Booking Page URL (e.g., bookslot.app/your-name)') }}</label>
                <input type="text" id="slug" name="slug" pattern="^[a-z0-9-]+$" title="{{ gettext('Only lowercase letters, numbers, and hyphens allowed.') }}" required>

                <label for="phone">{{ gettext('Phone Number (Optional, for WhatsApp notifications)') }}</label>
                <input type="tel" id="phone" name="phone">

                <button type="submit">{{ gettext('Sign Up') }}</button>
            </form>
            <p>{{ gettext('Already have an account?') }} <a href="/login">{{ gettext('Login here') }}</a></p>
        </article>
    </main>
</body>
</html>
