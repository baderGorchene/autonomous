<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ _("Sign Up for BookSlot") }}</title>
    <link rel="stylesheet" href="/static/css/style.css">
</head>
<body>
    <header>
        <h1>{{ _("BookSlot") }}</h1>
        <nav>
            <a href="/login">{{ _("Login") }}</a>
            <a href="{{ request.url|urlencode('lang', 'en') }}">EN</a>
            <a href="{{ request.url|urlencode('lang', 'ar') }}">AR</a>
            <a href="{{ request.url|urlencode('lang', 'fr') }}">FR</a>
        </nav>
    </header>
    <main>
        <h2>{{ _("Create Your Account") }}</h2>
        {% if error %}<p class="error">{{ error }}</p>{% endif %}
        <form action="/signup" method="post">
            <label for="name">{{ _("Your Name") }}</label>
            <input type="text" id="name" name="name" required>
            
            <label for="business_name">{{ _("Business Name") }}</label>
            <input type="text" id="business_name" name="business_name" required>
            
            <label for="email">{{ _("Email") }}</label>
            <input type="email" id="email" name="email" required>
            
            <label for="password">{{ _("Password") }}</label>
            <input type="password" id="password" name="password" required>
            
            <button type="submit">{{ _("Sign Up") }}</button>
        </form>
        <p>{{ _("Already have an account?") }} <a href="/login">{{ _("Login here") }}</a></p>
    </main>
    <footer>
        <p>&copy; 2023 BookSlot</p>
    </footer>
</body>
</html>
