<form hx-put="/admin/owners/{{ owner.id }}"
      hx-target="#owner-details-modal-content"
      hx-swap="outerHTML"
      hx-indicator="#edit-spinner-{{ owner.id }}">
    <div class="grid grid-cols-1 gap-y-6 sm:grid-cols-2 sm:gap-x-8">
        <div>
            <label for="name" class="block text-sm font-medium text-gray-700">{{ gettext("Name") }}</label>
            <div class="mt-1">
                <input type="text" name="name" id="name" value="{{ owner.name if owner.name else '' }}" class="shadow-sm focus:ring-indigo-500 focus:border-indigo-500 block w-full sm:text-sm border-gray-300 rounded-md">
            </div>
        </div>
        <div>
            <label for="email" class="block text-sm font-medium text-gray-700">{{ gettext("Email") }}</label>
            <div class="mt-1">
                <input type="email" name="email" id="email" value="{{ owner.email }}" class="shadow-sm focus:ring-indigo-500 focus:border-indigo-500 block w-full sm:text-sm border-gray-300 rounded-md">
            </div>
        </div>
        <div>
            <label for="phone" class="block text-sm font-medium text-gray-700">{{ gettext("Phone") }}</label>
            <div class="mt-1">
                <input type="text" name="phone" id="phone" value="{{ owner.phone if owner.phone else '' }}" class="shadow-sm focus:ring-indigo-500 focus:border-indigo-500 block w-full sm:text-sm border-gray-300 rounded-md">
            </div>
        </div>
        <div>
            <label for="subscription_status" class="block text-sm font-medium text-gray-700">{{ gettext("Subscription Status") }}</label>
            <div class="mt-1">
                <select name="subscription_status" id="subscription_status" class="shadow-sm focus:ring-indigo-500 focus:border-indigo-500 block w-full sm:text-sm border-gray-300 rounded-md">
                    <option value="free" {% if owner.subscription_status == 'free' %}selected{% endif %}>{{ gettext("Free") }}</option>
                    <option value="premium" {% if owner.subscription_status == 'premium' %}selected{% endif %}>{{ gettext("Premium") }}</option>
                    <option value="cancelled" {% if owner.subscription_status == 'cancelled' %}selected{% endif %}>{{ gettext("Cancelled") }}</option>
                </select>
            </div>
        </div>
        <div>
            <label for="is_admin" class="block text-sm font-medium text-gray-700">{{ gettext("Is Admin") }}</label>
            <div class="mt-1">
                <input type="checkbox" name="is_admin" id="is_admin" {% if owner.is_admin %}checked{% endif %} class="h-4 w-4 text-indigo-600 focus:ring-indigo-500 border-gray-300 rounded">
            </div>
        </div>
        <div>
            <label for="new_password" class="block text-sm font-medium text-gray-700">{{ gettext("New Password (Leave blank to keep current)") }}</label>
            <div class="mt-1">
                <input type="password" name="new_password" id="new_password" class="shadow-sm focus:ring-indigo-500 focus:border-indigo-500 block w-full sm:text-sm border-gray-300 rounded-md">
            </div>
        </div>
    </div>
    <div class="mt-6">
        <button type="submit" class="inline-flex justify-center py-2 px-4 border border-transparent shadow-sm text-sm font-medium rounded-md text-white bg-indigo-600 hover:bg-indigo-700 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-indigo-500">
            {{ gettext("Save Changes") }}
        </button>
        <span id="edit-spinner-{{ owner.id }}" class="htmx-indicator ml-2">
            <svg class="animate-spin h-5 w-5 text-indigo-500" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24">
                <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
                <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path>
            </svg>
        </span>
    </div>
    {% if message %}
        <div class="mt-4 p-3 bg-green-100 text-green-700 rounded-md" role="alert">
            {{ message }}
        </div>
    {% endif %}
    {% if error %}
        <div class="mt-4 p-3 bg-red-100 text-red-700 rounded-md" role="alert">
            {{ error }}
        </div>
    {% endif %}
</form>
