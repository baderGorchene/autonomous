<!DOCTYPE html>
<html lang="{{ locale }}">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ _("BookSlot - Simple Booking Page") }}</title>
    <link href="https://cdn.jsdelivr.net/npm/tailwindcss@2.2.19/dist/tailwind.min.css" rel="stylesheet">
</head>
<body class="bg-gray-100 flex items-center justify-center min-h-screen">
    <div class="bg-white p-8 rounded shadow-md text-center max-w-md w-full">
        <h1 class="text-3xl font-bold mb-4">{{ _("Welcome to BookSlot!") }}</h1>
        <p class="text-gray-700 mb-6">{{ _("Your dead-simple booking page for local services.") }}</p>
        <div class="space-y-4">
            <a href="/signup" class="block w-full bg-blue-500 text-white py-2 px-4 rounded hover:bg-blue-600 transition duration-200">{{ _("Sign Up") }}</a>
            <a href="/login" class="block w-full bg-gray-300 text-gray-800 py-2 px-4 rounded hover:bg-gray-400 transition duration-200">{{ _("Log In") }}</a>
        </div>
        <div class="mt-6">
            <a href="{{ request.url|urlencode('lang', 'en') }}" class="text-sm text-gray-600 hover:text-blue-500 mr-2">English</a>
            <a href="{{ request.url|urlencode('lang', 'ar') }}" class="text-sm text-gray-600 hover:text-blue-500 mr-2">العربية</a>
            <a href="{{ request.url|urlencode('lang', 'fr') }}" class="text-sm text-gray-600 hover:text-blue-500">Français</a>
        </div>
    </div>
</body>
</html>
