{% extends "base.html" %}
{% block title %}{{ _('Profile') }}{% endblock %}
{% block content %}
<div class="container profile-container">
    <h2>{{ _('Update Your Profile') }}</h2>
    {% if success %}
    <div class="alert alert-success">{{ success }}</div>
    {% endif %}
    {% if error %}
    <div class="alert alert-danger">{{ error }}</div>
    {% endif %}
    <form action="/profile" method="post">
        <div class="mb-3">
            <label for="name" class="form-label">{{ _('Your Name') }}</label>
            <input type="text" class="form-control" id="name" name="name" value="{{ owner.name }}" required>
        </div>
        <div class="mb-3">
            <label for="email" class="form-label">{{ _('Email address') }}</label>
            <input type="email" class="form-control" id="email" name="email" value="{{ owner.email }}" disabled>
            <small class="form-text text-muted">{{ _('Email cannot be changed.') }}</small>
        </div>
        <div class="mb-3">
            <label for="business_name" class="form-label">{{ _('Business Name') }}</label>
            <input type="text" class="form-control" id="business_name" name="business_name" value="{{ owner.business_name }}" required>
        </div>
        <div class="mb-3">
            <label for="phone" class="form-label">{{ _('Phone Number (for WhatsApp notifications)') }}</label>
            <input type="text" class="form-control" id="phone" name="phone" value="{{ owner.phone or '' }}">
        </div>
        <button type="submit" class="btn btn-primary">{{ _('Update Profile') }}</button>
    </form>
    <p class="mt-3"><a href="/dashboard">{{ _('Back to Dashboard') }}</a></p>
</div>
{% endblock %}
