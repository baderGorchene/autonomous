{% extends "base.html" %}

{% block title %}{{ _('Edit Profile') }}{% endblock %}

{% block content %}
<div class="max-w-md mx-auto bg-white p-8 rounded-lg shadow-md mt-10">
    <h2 class="text-2xl font-bold text-center text-gray-800 mb-6">{{ _('Edit Your Profile') }}</h2>
    
    {% if msg %}
    <div class="bg-green-100 border border-green-400 text-green-700 px-4 py-3 rounded relative mb-4" role="alert">
        <span class="block sm:inline">{{ msg }}</span>
    </div>
    {% endif %}

    <form action="/dashboard/profile" method="post" class="space-y-4">
        <div>
            <label for="name" class="block text-sm font-medium text-gray-700">{{ _('Your Name') }}</label>
            <input type="text" name="name" id="name" value="{{ owner.name }}" required
                   class="mt-1 block w-full px-3 py-2 border border-gray-300 rounded-md shadow-sm focus:outline-none focus:ring-blue-500 focus:border-blue-500 sm:text-sm">
        </div>
        <div>
            <label for="business_name" class="block text-sm font-medium text-gray-700">{{ _('Business Name') }}</label>
            <input type="text" name="business_name" id="business_name" value="{{ owner.business_name }}" required
                   class="mt-1 block w-full px-3 py-2 border border-gray-300 rounded-md shadow-sm focus:outline-none focus:ring-blue-500 focus:border-blue-500 sm:text-sm">
        </div>
        <div>
            <label for="phone" class="block text-sm font-medium text-gray-700">{{ _('Your Phone (Optional, for WhatsApp notifications)') }}</label>
            <input type="tel" name="phone" id="phone" value="{{ owner.phone if owner.phone else '' }}"
                   class="mt-1 block w-full px-3 py-2 border border-gray-300 rounded-md shadow-sm focus:outline-none focus:ring-blue-500 focus:border-blue-500 sm:text-sm">
        </div>
        <button type="submit" class="w-full flex justify-center py-2 px-4 border border-transparent rounded-md shadow-sm text-sm font-medium text-white bg-blue-600 hover:bg-blue-700 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-blue-500">
            {{ _('Update Profile') }}
        </button>
    </form>
    <p class="mt-6 text-center text-sm text-gray-600">
        <a href="/dashboard" class="font-medium text-blue-600 hover:text-blue-500">{{ _('Back to Dashboard') }}</a>
    </p>
</div>
{% endblock %}
