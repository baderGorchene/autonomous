<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ owner.business_name }} - {{ _('Book an Appointment') }}</title>
    <link rel="stylesheet" href="/static/css/booking_page.css">
</head>
<body>
    <div class="container">
        <h1>{{ owner.business_name }}</h1>
        <p>{{ _('Welcome to our booking page. Please select a service and a time slot.') }}</p>
        
        <form id="bookingForm" action="/book/{{ owner.slug }}" method="post">
            <label for="service">{{ _('Service') }}:</label>
            <select id="service" name="service_name" required>
                <option value="">{{ _('Select a service') }}</option>
                {% for service in owner.services_json %}
                <option value="{{ service.name }}">{{ service.name }} - {{ service.duration_minutes }} {{ _('minutes') }}</option>
                {% endfor %}
            </select>

            <label for="date">{{ _('Date') }}:</label>
            <input type="date" id="date" name="booking_date" required>

            <label for="time">{{ _('Time') }}:</label>
            <input type="time" id="time" name="booking_time" required>

            <label for="customer_name">{{ _('Your Name') }}:</label>
            <input type="text" id="customer_name" name="customer_name" required>

            <label for="customer_email">{{ _('Your Email') }}:</label>
            <input type="email" id="customer_email" name="customer_email" required>

            <label for="customer_phone">{{ _('Your Phone (WhatsApp preferred)') }}:</label>
            <input type="tel" id="customer_phone" name="customer_phone">

            <button type="submit">{{ _('Book Now') }}</button>
        </form>

        {% if error_message %}
        <p class="error-message">{{ error_message }}</p>
        {% endif %}

        <div class="language-toggle">
            <a href="?lang=en">English</a> |
            <a href="?lang=ar">العربية</a> |
            <a href="?lang=fr">Français</a>
        </div>
    </div>
    <script src="/static/js/booking_page.js"></script>
</body>
</html>
