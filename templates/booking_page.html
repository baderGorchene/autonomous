<!DOCTYPE html>
<html lang="{{ request.state.lang }}">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ owner.business_name }} - {{ _('Book an Appointment') }}</title>
    <link href="https://cdn.jsdelivr.net/npm/tailwindcss@2.2.19/dist/tailwind.min.css" rel="stylesheet">
    <style>
        /* Custom styles for mobile-first approach */
        @media (max-width: 768px) {
            .container {
                padding: 1rem;
            }
        }
        .lang-toggle a {
            padding: 0.25rem 0.5rem;
            border-radius: 0.25rem;
            text-decoration: none;
            color: #4A5568; /* gray-700 */
        }
        .lang-toggle a.active {
            background-color: #E2E8F0; /* gray-200 */
            font-weight: bold;
        }
    </style>
</head>
<body class="bg-gray-100 text-gray-900 font-sans leading-normal tracking-normal">
    <div class="container mx-auto p-4 md:p-8">
        <header class="text-center mb-8">
            <h1 class="text-4xl font-bold text-blue-600 mb-2">{{ owner.business_name }}</h1>
            <p class="text-xl text-gray-700">{{ _('Book your next appointment with ease.') }}</p>
            <div class="mt-4 lang-toggle">
                <a href="{{ request.url|update_query_param('lang', 'en') }}" class="{{ 'active' if request.state.lang == 'en' }}">English</a>
                <a href="{{ request.url|update_query_param('lang', 'ar') }}" class="{{ 'active' if request.state.lang == 'ar' }}">العربية</a>
                <a href="{{ request.url|update_query_param('lang', 'fr') }}" class="{{ 'active' if request.state.lang == 'fr' }}">Français</a>
            </div>
        </header>

        <main class="bg-white p-6 rounded-lg shadow-xl max-w-2xl mx-auto">
            {% if error %}
                <div class="bg-red-100 border border-red-400 text-red-700 px-4 py-3 rounded relative mb-4" role="alert">
                    <strong class="font-bold">{{ _('Error!') }}</strong>
                    <span class="block sm:inline">{{ error }}</span>
                </div>
            {% endif %}

            <h2 class="text-2xl font-semibold mb-6 text-center">{{ _('Book an Appointment') }}</h2>

            <form action="/book/{{ owner.slug }}?lang={{ request.state.lang }}" method="post" class="space-y-6">
                <!-- Customer Details -->
                <div>
                    <label for="customer_name" class="block text-sm font-medium text-gray-700">{{ _('Your Name') }}</label>
                    <input type="text" id="customer_name" name="customer_name" required
                           class="mt-1 block w-full px-3 py-2 border border-gray-300 rounded-md shadow-sm focus:outline-none focus:ring-blue-500 focus:border-blue-500 sm:text-sm">
                </div>
                <div>
                    <label for="customer_email" class="block text-sm font-medium text-gray-700">{{ _('Your Email') }}</label>
                    <input type="email" id="customer_email" name="customer_email" required
                           class="mt-1 block w-full px-3 py-2 border border-gray-300 rounded-md shadow-sm focus:outline-none focus:ring-blue-500 focus:border-blue-500 sm:text-sm">
                </div>
                <div>
                    <label for="customer_phone" class="block text-sm font-medium text-gray-700">{{ _('Your Phone Number (Optional)') }}</label>
                    <input type="tel" id="customer_phone" name="customer_phone"
                           class="mt-1 block w-full px-3 py-2 border border-gray-300 rounded-md shadow-sm focus:outline-none focus:ring-blue-500 focus:border-blue-500 sm:text-sm">
                </div>

                <!-- Service Selection -->
                <div>
                    <label for="service_name" class="block text-sm font-medium text-gray-700">{{ _('Select Service') }}</label>
                    <select id="service_name" name="service_name" required
                            class="mt-1 block w-full pl-3 pr-10 py-2 text-base border-gray-300 focus:outline-none focus:ring-blue-500 focus:border-blue-500 sm:text-sm rounded-md">
                        <option value="">-- {{ _('Please choose a service') }} --</option>
                        {% if services %}
                            {% for service in services %}
                                <option value="{{ service.name }}">{{ service.name }} ({{ service.duration }} {{ _('min') }} - {{ service.price|format_currency(request.state.lang) }})</option>
                            {% endfor %}
                        {% else %}
                            <!-- Fallback for testing with mock price if no services are set -->
                            <option value="Default Service">{{ _('Default Service') }} (60 {{ _('min') }} - {{ mock_service_price|format_currency(request.state.lang) }})</option>
                        {% endif %}
                    </select>
                </div>

                <!-- Date and Time Selection -->
                <div>
                    <label for="booking_date" class="block text-sm font-medium text-gray-700">{{ _('Select Date') }}</label>
                    <input type="date" id="booking_date" name="booking_date" required
                           class="mt-1 block w-full px-3 py-2 border border-gray-300 rounded-md shadow-sm focus:outline-none focus:ring-blue-500 focus:border-blue-500 sm:text-sm">
                </div>
                <div>
                    <label for="booking_time" class="block text-sm font-medium text-gray-700">{{ _('Select Time') }}</label>
                    <select id="booking_time" name="booking_time" required
                            class="mt-1 block w-full pl-3 pr-10 py-2 text-base border-gray-300 focus:outline-none focus:ring-blue-500 focus:border-blue-500 sm:text-sm rounded-md">
                        <option value="">-- {{ _('Please choose a time') }} --</option>
                        <!-- Example times, actual implementation would dynamically load based on availability -->
                        <option value="09:00 AM">09:00 AM</option>
                        <option value="10:00 AM">10:00 AM</option>
                        <option value="11:00 AM">11:00 AM</option>
                        <option value="01:00 PM">01:00 PM</option>
                        <option value="02:00 PM">02:00 PM</option>
                    </select>
                </div>

                <!-- Submit Button -->
                <button type="submit"
                        class="w-full flex justify-center py-2 px-4 border border-transparent rounded-md shadow-sm text-sm font-medium text-white bg-blue-600 hover:bg-blue-700 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-blue-500">
                    {{ _('Confirm Booking') }}
                </button>
            </form>
        </main>
    </div>
</body>
</html>
