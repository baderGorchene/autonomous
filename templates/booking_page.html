<!DOCTYPE html>
<html lang="{{ current_lang }}">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ owner.business_name if owner else _('Booking Page') }}</title>
    <style>
        body { font-family: sans-serif; margin: 0; background-color: #f0f2f5; color: #333; display: flex; justify-content: center; align-items: flex-start; min-height: 100vh; padding: 20px; box-sizing: border-box; }
        .container { background: #fff; padding: 30px; border-radius: 10px; box-shadow: 0 6px 20px rgba(0,0,0,0.1); max-width: 500px; width: 100%; box-sizing: border-box; }
        .header { text-align: center; margin-bottom: 25px; }
        .header h1 { color: #007bff; margin-bottom: 5px; font-size: 2.2em; }
        .header p { color: #555; font-size: 1.1em; line-height: 1.5; }
        .lang-toggle { text-align: center; margin-bottom: 20px; }
        .lang-toggle a { margin: 0 8px; text-decoration: none; color: #007bff; font-weight: bold; }
        .lang-toggle a:hover { text-decoration: underline; }
        .form-group { margin-bottom: 20px; }
        .form-group label { display: block; margin-bottom: 8px; font-weight: bold; color: #444; font-size: 1em; }
        .form-group input[type="text"], .form-group input[type="email"], .form-group input[type="tel"], .form-group select, .form-group input[type="date"], .form-group input[type="time"] {
            width: calc(100% - 24px); /* Account for padding and border */
            padding: 12px;
            border: 1px solid #ccc;
            border-radius: 6px;
            font-size: 1em;
            box-sizing: border-box;
            transition: border-color 0.3s ease;
        }
        .form-group input:focus, .form-group select:focus { border-color: #007bff; outline: none; }
        .btn-submit { background-color: #28a745; color: white; padding: 14px 25px; border: none; border-radius: 6px; cursor: pointer; font-size: 1.1em; width: 100%; transition: background-color 0.3s ease; }
        .btn-submit:hover { background-color: #218838; }
        .error-message { color: #dc3545; margin-top: 10px; text-align: center; font-weight: bold; }
        .success-message { color: #28a745; margin-top: 10px; text-align: center; font-weight: bold; }

        /* Responsive adjustments */
        @media (max-width: 768px) {
            .container { padding: 20px; margin: 10px; }
            .header h1 { font-size: 1.8em; }
            .header p { font-size: 0.95em; }
            .form-group input, .form-group select { padding: 10px; }
            .btn-submit { padding: 12px; font-size: 1em; }
        }

        @media (max-width: 480px) {
            body { padding: 10px; }
            .container { border-radius: 5px; }
            .header h1 { font-size: 1.6em; }
            .header p { font-size: 0.9em; }
            .lang-toggle a { margin: 0 5px; font-size: 0.9em; }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="lang-toggle">
            <a href="{{ request.url | update_query_param('lang', 'en') }}">English</a> |
            <a href="{{ request.url | update_query_param('lang', 'ar') }}">العربية</a> |
            <a href="{{ request.url | update_query_param('lang', 'fr') }}">Français</a>
        </div>

        <div class="header">
            <h1>{{ owner.business_name if owner else _('BookSlot') }}</h1>
            <p>{{ _('Book your service with') }} {{ owner.name if owner else '' }} {{ _('today!') }}</p>
        </div>

        <form id="bookingForm">
            <div class="form-group">
                <label for="customer_name">{{ _('Your Name') }}:</label>
                <input type="text" id="customer_name" name="customer_name" required>
            </div>
            <div class="form-group">
                <label for="customer_email">{{ _('Your Email') }}:</label>
                <input type="email" id="customer_email" name="customer_email" required>
            </div>
            <div class="form-group">
                <label for="customer_phone">{{ _('Your Phone (Optional)') }}:</label>
                <input type="tel" id="customer_phone" name="customer_phone">
            </div>
            <div class="form-group">
                <label for="service_name">{{ _('Select a Service') }}:</label>
                <select id="service_name" name="service_name" required>
                    <option value="">{{ _('Choose a service') }}</option>
                    {% for service in services %}
                        <option value="{{ service.name }}">{{ service.name }} - {{ service.duration }} {{ _('min') }} - {{ service.price | format_currency(current_lang, service.currency) }}</option>
                    {% endfor %}
                </select>
            </div>
            <div class="form-group">
                <label for="booking_date">{{ _('Date') }}:</label>
                <input type="date" id="booking_date" name="booking_date" required>
            </div>
            <div class="form-group">
                <label for="booking_time">{{ _('Time') }}:</label>
                <input type="time" id="booking_time" name="booking_time" required>
            </div>
            <button type="submit" class="btn-submit">{{ _('Book Now') }}</button>
            <div id="message" class="error-message" style="display:none;"></div>
        </form>
    </div>

    <script>
        document.getElementById('bookingForm').addEventListener('submit', async function(event) {
            event.preventDefault();
            const ownerSlug = window.location.pathname.split('/')[1];
            const messageDiv = document.getElementById('message');
            messageDiv.style.display = 'none';
            messageDiv.className = 'error-message';
            messageDiv.textContent = '';

            const formData = new FormData(this);
            const bookingData = Object.fromEntries(formData.entries());

            try {
                const response = await fetch(`/${ownerSlug}/book`, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify(bookingData)
                });

                if (!response.ok) {
                    const errorData = await response.json();
                    throw new Error(errorData.detail || '{{ _('Booking failed.') }}');
                }

                // If successful, redirect to a confirmation page or show a success message
                window.location.href = `/${ownerSlug}/booking-confirmation?name=${encodeURIComponent(bookingData.customer_name)}&service=${encodeURIComponent(bookingData.service_name)}&date=${encodeURIComponent(bookingData.booking_date)}&time=${encodeURIComponent(bookingData.booking_time)}&lang={{ current_lang }}`;

            } catch (error) {
                messageDiv.textContent = error.message;
                messageDiv.style.display = 'block';
            }
        });
    </script>
</body>
</html>
