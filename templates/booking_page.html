<!DOCTYPE html>
<html lang="{{ request.cookies.get('locale', 'en') }}">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ _('Book with') }} {{ owner.business_name }}</title>
    <link rel="stylesheet" href="/static/style.css">
    <script src="/static/script.js" defer></script>
</head>
<body class="booking-page">
    <header>
        <div class="container">
            <h1>{{ owner.business_name }}</h1>
            <p>{{ _('Book your service easily and quickly.') }}</p>
            <form action="/set-locale" method="post" style="display: inline-block; float: right;">
                <select name="locale" onchange="this.form.submit()">
                    <option value="en" {% if request.cookies.get('locale') == 'en' %}selected{% endif %}>English</option>
                    <option value="ar" {% if request.cookies.get('locale') == 'ar' %}selected{% endif %}>العربية</option>
                    <option value="fr" {% if request.cookies.get('locale') == 'fr' %}selected{% endif %}>Français</option>
                </select>
            </form>
        </div>
    </header>

    <main class="container">
        {% if error %}
            <p class="error-message">{{ error }}</p>
        {% endif %}

        <form action="/bookslot.app/{{ owner.slug }}/book" method="post" class="booking-form">
            <h3>{{ _('Your Details') }}</h3>
            <div class="form-group">
                <label for="customer_name">{{ _('Your Name:') }}</label>
                <input type="text" id="customer_name" name="customer_name" required>
            </div>
            <div class="form-group">
                <label for="customer_email">{{ _('Your Email:') }}</label>
                <input type="email" id="customer_email" name="customer_email" required>
            </div>
            <div class="form-group">
                <label for="customer_phone">{{ _('Your Phone Number (optional, for WhatsApp notifications):') }}</label>
                <input type="tel" id="customer_phone" name="customer_phone" placeholder="{{ _('e.g., +15551234567') }}">
            </div>

            <h3>{{ _('Select Service and Time') }}</h3>
            <div class="form-group">
                <label for="service_name">{{ _('Service:') }}</label>
                <select id="service_name" name="service_name" required>
                    <option value="">{{ _('Choose a service') }}</option>
                    {% for service in services %}
                        <option value="{{ service.name }}" data-duration="{{ service.duration_minutes }}">{{ service.name }} - {{ service.price | '%.2f' }} {{ _('currency') }} ({{ service.duration_minutes }} {{ _('min') }})</option>
                    {% endfor %}
                </select>
            </div>

            <div class="form-group">
                <label for="booking_date">{{ _('Date:') }}</label>
                <input type="date" id="booking_date" name="booking_date" required min="{{ 'now' | date('%Y-%m-%d') }}">
            </div>

            <div class="form-group">
                <label for="booking_time">{{ _('Time:') }}</label>
                <select id="booking_time" name="booking_time" required>
                    <option value="">{{ _('Choose a date first') }}</option>
                </select>
            </div>
            
            <button type="submit" class="button">{{ _('Confirm Booking') }}</button>
        </form>
    </main>

    <footer>
        <p>&copy; 2024 BookSlot. {{ _('All rights reserved.') }}</p>
    </footer>

    <script>
        document.addEventListener('DOMContentLoaded', function() {
            const bookingDateInput = document.getElementById('booking_date');
            const bookingTimeSelect = document.getElementById('booking_time');
            const serviceSelect = document.getElementById('service_name');
            const availabilityData = {{ availability | tojson }};
            const servicesData = {{ services | tojson }};

            function getDayName(dateString) {
                const date = new Date(dateString);
                const days = ['sunday', 'monday', 'tuesday', 'wednesday', 'thursday', 'friday', 'saturday'];
                return days[date.getDay()];
            }

            function generateTimeSlots() {
                const selectedDate = bookingDateInput.value;
                const selectedService = serviceSelect.value;
                
                bookingTimeSelect.innerHTML = `<option value="">{{ _('Select a time') }}</option>`;

                if (!selectedDate || !selectedService) {
                    return;
                }

                const dayName = getDayName(selectedDate);
                const dayAvailability = availabilityData[dayName];

                if (!dayAvailability || !dayAvailability.is_available) {
                    return;
                }

                const service = servicesData.find(s => s.name === selectedService);
                if (!service) {
                    return;
                }
                const serviceDuration = service.duration_minutes;

                dayAvailability.slots.forEach(slot => {
                    let [startHour, startMinute] = slot.start_time.split(':').map(Number);
                    let [endHour, endMinute] = slot.end_time.split(':').map(Number);

                    let currentTime = new Date(`${selectedDate}T${slot.start_time}:00`);
                    let endTime = new Date(`${selectedDate}T${slot.end_time}:00`);

                    while (currentTime.getTime() + serviceDuration * 60 * 1000 <= endTime.getTime()) {
                        const optionValue = currentTime.toTimeString().slice(0, 5);
                        const optionText = optionValue;
                        const now = new Date();
                        const bookingDateTime = new Date(`${selectedDate}T${optionValue}:00`);

                        if (bookingDateTime > now) {
                            const option = document.createElement('option');
                            option.value = optionValue;
                            option.textContent = optionText;
                            bookingTimeSelect.appendChild(option);
                        }
                        currentTime.setMinutes(currentTime.getMinutes() + serviceDuration);
                    }
                });
            }

            bookingDateInput.addEventListener('change', generateTimeSlots);
            serviceSelect.addEventListener('change', generateTimeSlots);

            const today = new Date();
            const yyyy = today.getFullYear();
            const mm = String(today.getMonth() + 1).padStart(2, '0');
            const dd = String(today.getDate()).padStart(2, '0');
            bookingDateInput.min = `${yyyy}-${mm}-${dd}`;
        });
    </script>
</body>
</html>
