<!DOCTYPE html>
<html lang="{{ locale }}">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ owner.business_name }} - {{ _('Book an Appointment') }}</title>
    <link rel="stylesheet" href="/static/css/style.css">
</head>
<body>
    <div class="container">
        <header class="header">
            <h1 class="business-name">{{ owner.business_name }}</h1>
            <div class="language-toggle">
                <a href="?lang=en" class="{{ 'active' if locale == 'en' else '' }}">EN</a> |
                <a href="?lang=ar" class="{{ 'active' if locale == 'ar' else '' }}">AR</a> |
                <a href="?lang=fr" class="{{ 'active' if locale == 'fr' else '' }}">FR</a>
            </div>
        </header>

        <main class="booking-section">
            <p class="owner-name-tag">{{ owner.name }}</p>
            <h2 class="section-title">{{ _('Book Your Service') }}</h2>
            <p class="description">{{ _('Please select a service, date, and time that works for you.') }}</p>

            {% if error_message %}
                <div class="error-message">{{ error_message }}</div>
            {% endif %}

            <form action="/book/{{ owner.slug }}" method="post" class="booking-form">
                <div class="form-group">
                    <label for="service_name">{{ _('Service') }}</label>
                    <select id="service_name" name="service_name" required>
                        <option value="">{{ _('Select a service') }}</option>
                        {% for service in owner.services_json %}
                            <option value="{{ service.name }}">{{ service.name }} ({{ service.duration_minutes }} {{ _('minutes') }})</option>
                        {% endfor %}
                    </select>
                </div>

                <div class="form-group">
                    <label for="booking_date">{{ _('Date') }}</label>
                    <input type="date" id="booking_date" name="booking_date" required>
                </div>

                <div class="form-group">
                    <label for="booking_time">{{ _('Time') }}</label>
                    <input type="time" id="booking_time" name="booking_time" required>
                </div>

                <div class="form-group">
                    <label for="customer_name">{{ _('Your Name') }}</label>
                    <input type="text" id="customer_name" name="customer_name" placeholder="{{ _('e.g., John Doe') }}" required>
                </div>

                <div class="form-group">
                    <label for="customer_email">{{ _('Your Email') }}</label>
                    <input type="email" id="customer_email" name="customer_email" placeholder="{{ _('e.g., john.doe@example.com') }}" required>
                </div>

                <div class="form-group">
                    <label for="customer_phone">{{ _('Your Phone (WhatsApp)') }}</label>
                    <input type="text" id="customer_phone" name="customer_phone" placeholder="{{ _('e.g., +15551234567') }}" required>
                </div>
                
                <button type="submit" class="btn-primary">{{ _('Book Now') }}</button>
            </form>
        </main>

        <footer class="footer">
            <p>&copy; 2023 BookSlot. {{ _('All rights reserved.') }}</p>
        </footer>
    </div>
    <script src="/static/js/main.js"></script>
</body>
</html>
