<!DOCTYPE html><html lang="{{ current_locale }}" dir="{{ 'rtl' if current_locale == 'ar' else 'ltr' }}"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>{{ gettext("Book with") }} {{ owner.business_name }}</title><script src="https://cdn.tailwindcss.com"></script><style>.rtl { direction: rtl; } .rtl .text-right { text-align: left; } .rtl .text-left { text-align: right; }</style></head><body class="bg-gray-100 flex items-center justify-center min-h-screen p-4 {{ 'rtl' if current_locale == 'ar' else '' }}"><div class="bg-white p-8 rounded-lg shadow-md w-full max-w-lg"><div class="flex justify-end mb-4 space-x-2"><a href="?lang=en" class="text-indigo-600 hover:underline">English</a><a href="?lang=ar" class="text-indigo-600 hover:underline">العربية</a><a href="?lang=fr" class="text-indigo-600 hover:underline">Français</a></div><h1 class="text-3xl font-bold mb-6 text-center">{{ owner.business_name }}</h1><p class="text-lg text-gray-700 mb-8 text-center">{{ gettext("Book your service easily and quickly.") }}</p>{% if error %}<div class="bg-red-100 border border-red-400 text-red-700 px-4 py-3 rounded relative mb-4" role="alert"><span class="block sm:inline">{{ error }}</span></div>{% endif %}<form action="/{{ owner.slug }}/book" method="post" class="space-y-6"><div><label for="service_name" class="block text-sm font-medium text-gray-700">{{ gettext("Select Service") }}</label><select id="service_name" name="service_name" required class="mt-1 block w-full px-3 py-2 border border-gray-300 rounded-md shadow-sm focus:outline-none focus:ring-indigo-500 focus:border-indigo-500 sm:text-sm"><option value="">{{ gettext("Choose a service...") }}</option>{% for service in services %}<option value="{{ service.name }}">{{ service.name }} ({{ service.price|currency(service.currency, current_locale) }})</option>{% endfor %}</select></div><div><label for="booking_date" class="block text-sm font-medium text-gray-700">{{ gettext("Select Date") }}</label><input type="date" id="booking_date" name="booking_date" required class="mt-1 block w-full px-3 py-2 border border-gray-300 rounded-md shadow-sm focus:outline-none focus:ring-indigo-500 focus:border-indigo-500 sm:text-sm"></div><div><label for="booking_time" class="block text-sm font-medium text-gray-700">{{ gettext("Select Time") }}</label><input type="time" id="booking_time" name="booking_time" required class="mt-1 block w-full px-3 py-2 border border-gray-300 rounded-md shadow-sm focus:outline-none focus:ring-indigo-500 focus:border-indigo-500 sm:text-sm"></div><div><label for="customer_name" class="block text-sm font-medium text-gray-700">{{ gettext("Your Name") }}</label><input type="text" id="customer_name" name="customer_name" required class="mt-1 block w-full px-3 py-2 border border-gray-300 rounded-md shadow-sm focus:outline-none focus:ring-indigo-500 focus:border-indigo-500 sm:text-sm"></div><div><label for="customer_email" class="block text-sm font-medium text-gray-700">{{ gettext("Your Email") }}</label><input type="email" id="customer_email" name="customer_email" required class="mt-1 block w-full px-3 py-2 border border-gray-300 rounded-md shadow-sm focus:outline-none focus:ring-indigo-500 focus:border-indigo-500 sm:text-sm"></div><div><label for="customer_phone" class="block text-sm font-medium text-gray-700">{{ gettext("Your Phone Number (Optional)") }}</label><input type="tel" id="customer_phone" name="customer_phone" class="mt-1 block w-full px-3 py-2 border border-gray-300 rounded-md shadow-sm focus:outline-none focus:ring-indigo-500 focus:border-indigo-500 sm:text-sm"></div><input type="hidden" name="csrf_token" value="{{ csrf_token }}"><button type="submit" class="w-full flex justify-center py-3 px-4 border border-transparent rounded-md shadow-sm text-base font-medium text-white bg-indigo-600 hover:bg-indigo-700 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-indigo-500">{{ gettext("Book Now") }}</button></form></div></body></html>
