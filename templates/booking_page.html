<!DOCTYPE html>
<html lang="{{ request.state.locale }}" dir="{{ 'rtl' if request.state.locale == 'ar' else 'ltr' }}">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ title }}</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/tailwindcss/2.2.19/tailwind.min.css">
    <style>
        body { font-family: sans-serif; }
        .lang-switcher { position: absolute; top: 1rem; right: 1rem; }
        .rtl .lang-switcher { left: 1rem; right: auto; }
        @media (max-width: 768px) {
            .lang-switcher { top: 0.5rem; right: 0.5rem; }
        }
    </style>
</head>
<body class="bg-gray-100 flex flex-col items-center min-h-screen">
    <div class="lang-switcher">
        <a href="{{ request.url|urlencode('lang', 'en') }}" class="text-blue-500 hover:underline mx-1">English</a>
        <a href="{{ request.url|urlencode('lang', 'ar') }}" class="text-blue-500 hover:underline mx-1">العربية</a>
        <a href="{{ request.url|urlencode('lang', 'fr') }}" class="text-blue-500 hover:underline mx-1">Français</a>
    </div>

    <div class="bg-white p-6 rounded-lg shadow-md w-full max-w-lg mt-8 md:mt-16 mx-4">
        <h1 class="text-3xl font-bold text-center mb-6 text-blue-600">{{ owner.business_name }}</h1>
        <p class="text-center text-gray-700 mb-8">{{ _("Book your appointment easily and quickly.") }}</p>

        {% if error_message %}
            <p class="bg-red-100 border border-red-400 text-red-700 px-4 py-3 rounded relative mb-4" role="alert">
                {{ error_message }}
            </p>
        {% endif %}

        <form action="/bookslot/{{ owner.slug }}/submit" method="post" id="booking-form">
            <div class="mb-4">
                <label for="customer_name" class="block text-gray-700 text-sm font-bold mb-2">{{ _("Your Name") }}:</label>
                <input type="text" id="customer_name" name="customer_name" value="{{ customer_name or '' }}" required
                       class="shadow appearance-none border rounded w-full py-2 px-3 text-gray-700 leading-tight focus:outline-none focus:shadow-outline">
            </div>
            <div class="mb-4">
                <label for="customer_email" class="block text-gray-700 text-sm font-bold mb-2">{{ _("Your Email") }}:</label>
                <input type="email" id="customer_email" name="customer_email" value="{{ customer_email or '' }}" required
                       class="shadow appearance-none border rounded w-full py-2 px-3 text-gray-700 leading-tight focus:outline-none focus:shadow-outline">
            </div>
            <div class="mb-4">
                <label for="customer_phone" class="block text-gray-700 text-sm font-bold mb-2">{{ _("Your Phone Number (Optional)") }}:</label>
                <input type="text" id="customer_phone" name="customer_phone" value="{{ customer_phone or '' }}"
                       class="shadow appearance-none border rounded w-full py-2 px-3 text-gray-700 leading-tight focus:outline-none focus:shadow-outline">
                <p class="text-xs text-gray-500 mt-1">{{ _("Include country code, e.g., +1234567890. For WhatsApp notifications.") }}</p>
            </div>

            <div class="mb-4">
                <label for="service_name" class="block text-gray-700 text-sm font-bold mb-2">{{ _("Select Service") }}:</label>
                <select id="service_name" name="service_name" required
                        class="shadow appearance-none border rounded w-full py-2 px-3 text-gray-700 leading-tight focus:outline-none focus:shadow-outline">
                    <option value="">{{ _("Choose a service") }}</option>
                    {% for service in services %}
                        <option value="{{ service.name }}" data-duration="{{ service.duration }}"
                                {% if selected_service == service.name %}selected{% endif %}>
                            {{ service.name }} ({{ service.duration }} {{ _("min") }} - ${{ "%.2f"|format(service.price) }})
                        </option>
                    {% endfor %}
                </select>
            </div>

            <div class="mb-4">
                <label for="booking_date" class="block text-gray-700 text-sm font-bold mb-2">{{ _("Select Date") }}:</label>
                <input type="date" id="booking_date" name="booking_date" value="{{ selected_date or '' }}" required
                       class="shadow appearance-none border rounded w-full py-2 px-3 text-gray-700 leading-tight focus:outline-none focus:shadow-outline">
            </div>

            <div class="mb-6">
                <label for="booking_time" class="block text-gray-700 text-sm font-bold mb-2">{{ _("Select Time") }}:</label>
                <select id="booking_time" name="booking_time" required
                        class="shadow appearance-none border rounded w-full py-2 px-3 text-gray-700 leading-tight focus:outline-none focus:shadow-outline">
                    <option value="">{{ _("Choose a time") }}</option>
                    <!-- Times will be dynamically populated by JavaScript -->
                </select>
            </div>

            <button type="submit"
                    class="bg-blue-500 hover:bg-blue-700 text-white font-bold py-2 px-4 rounded focus:outline-none focus:shadow-outline w-full">
                {{ _("Book Now") }}
            </button>
        </form>
    </div>

    <script>
        const availabilityData = {{ availability | tojson }};
        const serviceSelect = document.getElementById('service_name');
        const bookingDateInput = document.getElementById('booking_date');
        const bookingTimeSelect = document.getElementById('booking_time');
        const selectedTime = "{{ selected_time or '' }}";

        function populateTimeSlots() {
            const selectedDateStr = bookingDateInput.value;
            const selectedServiceOption = serviceSelect.options[serviceSelect.selectedIndex];
            const serviceDuration = selectedServiceOption ? parseInt(selectedServiceOption.dataset.duration) : 0;

            bookingTimeSelect.innerHTML = '<option value="">{{ _("Choose a time") }}</option>';
            if (!selectedDateStr || !serviceDuration) {
                return;
            }

            const selectedDate = new Date(selectedDateStr + 'T00:00:00'); // Use T00:00:00 to avoid timezone issues
            const dayOfWeek = selectedDate.toLocaleString('en-us', { weekday: 'long' }).toLowerCase();

            const dayAvailability = availabilityData[dayOfWeek] || [];

            const now = new Date();
            const today = now.toISOString().split('T')[0];

            dayAvailability.forEach(slot => {
                let [startHour, startMinute] = slot.start.split(':').map(Number);
                let [endHour, endMinute] = slot.end.split(':').map(Number);

                let currentSlotTime = new Date(selectedDate);
                currentSlotTime.setHours(startHour, startMinute, 0, 0);

                let endSlotTime = new Date(selectedDate);
                endSlotTime.setHours(endHour, endMinute, 0, 0);

                while (currentSlotTime.getTime() + (serviceDuration * 60 * 1000) <= endSlotTime.getTime()) {
                    // Only add slots in the future
                    if (selectedDateStr > today || (selectedDateStr === today && currentSlotTime.getTime() > now.getTime())) {
                        const timeString = currentSlotTime.toLocaleTimeString('en-US', { hour: '2-digit', minute: '2-digit', hour12: false });
                        const option = document.createElement('option');
                        option.value = timeString;
                        option.textContent = timeString;
                        if (timeString === selectedTime) {
                            option.selected = true;
                        }
                        bookingTimeSelect.appendChild(option);
                    }
                    currentSlotTime.setMinutes(currentSlotTime.getMinutes() + serviceDuration);
                }
            });
        }

        serviceSelect.addEventListener('change', populateTimeSlots);
        bookingDateInput.addEventListener('change', populateTimeSlots);

        // Set min date for booking_date to today
        const today = new Date().toISOString().split('T')[0];
        bookingDateInput.setAttribute('min', today);

        // Initial population on page load if values are pre-filled (e.g., after error)
        document.addEventListener('DOMContentLoaded', () => {
            if (bookingDateInput.value && serviceSelect.value) {
                populateTimeSlots();
            }
        });
    </script>
</body>
</html>
