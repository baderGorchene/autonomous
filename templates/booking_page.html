<!DOCTYPE html>
<html lang="{{ current_locale }}">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ title }}</title>
    <link href="https://cdn.jsdelivr.net/npm/tailwindcss@2.2.19/dist/tailwind.min.css" rel="stylesheet">
</head>
<body class="bg-gray-100 min-h-screen flex flex-col">
    <header class="bg-indigo-600 text-white p-4 shadow-md">
        <div class="container mx-auto">
            <h1 class="text-2xl font-bold">{{ _("Book an Appointment with {owner_name}").format(owner_name=owner.name) }}</h1>
        </div>
        <div class="lang-switcher">
            <select onchange="window.location.href='/set_language/' + this.value">
                <option value="en" {% if current_locale == 'en' %}selected{% endif %}>English</option>
                <option value="ar" {% if current_locale == 'ar' %}selected{% endif %}>العربية</option>
                <option value="fr" {% if current_locale == 'fr' %}selected{% endif %}>Français</option>
            </select>
        </div>
    </header>
    <main class="container mx-auto p-4 flex-grow">
        <div class="bg-white p-6 rounded-lg shadow-md max-w-2xl mx-auto">
            <h2 class="text-xl font-semibold text-gray-800 mb-4">{{ _("Book Your Service") }}</h2>
            <form action="{{ request.url_for('submit_booking', owner_name=owner.name) }}" method="POST" class="space-y-4">
                <div>
                    <label for="service_id" class="block text-sm font-medium text-gray-700">{{ _("Select Service") }}</label>
                    <select id="service_id" name="service_id" required class="mt-1 block w-full border border-gray-300 rounded-md shadow-sm p-2 focus:ring-indigo-500 focus:border-indigo-500">
                        {% for service in services %}
                            <option value="{{ service.id }}">{{ service.name }} ({{ service.duration_minutes }} {{ _("minutes") }}) - {{ service.price | format_currency('USD', current_locale) }}</option>
                        {% endfor %}
                    </select>
                </div>
                <div>
                    <label for="customer_name" class="block text-sm font-medium text-gray-700">{{ _("Your Name") }}</label>
                    <input type="text" id="customer_name" name="customer_name" required class="mt-1 block w-full border border-gray-300 rounded-md shadow-sm p-2 focus:ring-indigo-500 focus:border-indigo-500">
                </div>
                <div>
                    <label for="customer_email" class="block text-sm font-medium text-gray-700">{{ _("Your Email") }}</label>
                    <input type="email" id="customer_email" name="customer_email" required class="mt-1 block w-full border border-gray-300 rounded-md shadow-sm p-2 focus:ring-indigo-500 focus:border-indigo-500">
                </div>
                <div>
                    <label for="customer_phone" class="block text-sm font-medium text-gray-700">{{ _("Your Phone (optional)") }}</label>
                    <input type="text" id="customer_phone" name="customer_phone" class="mt-1 block w-full border border-gray-300 rounded-md shadow-sm p-2 focus:ring-indigo-500 focus:border-indigo-500">
                </div>
                <div>
                    <label for="booking_date" class="block text-sm font-medium text-gray-700">{{ _("Date") }}</label>
                    <input type="date" id="booking_date" name="booking_date" required class="mt-1 block w-full border border-gray-300 rounded-md shadow-sm p-2 focus:ring-indigo-500 focus:border-indigo-500">
                </div>
                <div>
                    <label for="booking_time" class="block text-sm font-medium text-gray-700">{{ _("Time") }}</label>
                    <input type="time" id="booking_time" name="booking_time" required class="mt-1 block w-full border border-gray-300 rounded-md shadow-sm p-2 focus:ring-indigo-500 focus:border-indigo-500">
                </div>
                <button type="submit" class="bg-indigo-600 text-white py-2 px-4 rounded-md hover:bg-indigo-700 transition-colors w-full">{{ _("Book Now") }}</button>
            </form>
        </div>
    </main>
    <footer class="bg-gray-800 text-white p-4 text-center mt-8">
        <p>&copy; 2023 BookSlot. {{ _("All rights reserved.") }}</p>
    </footer>
</body>
</html>
