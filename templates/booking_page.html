<!DOCTYPE html>
<html lang="{{ request.state.lang }}">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ owner.business_name }} - {{ _('Book an Appointment') }}</title>
    <link rel="stylesheet" href="/static/style.css">
</head>
<body>
    <div class="container">
        <h1>{{ _('Book an Appointment with {business_name}')|format(business_name=owner.business_name) }}</h1>
        <p>{{ _('Your booking page URL:') }} <a href="bookslot.app/{{ owner_slug }}">bookslot.app/{{ owner_slug }}</a></p>
        <p>
            <a href="{{ request.url|urlencode('lang', 'en') }}">English</a> |
            <a href="{{ request.url|urlencode('lang', 'ar') }}">العربية</a> |
            <a href="{{ request.url|urlencode('lang', 'fr') }}">Français</a>
        </p>

        {% if error %}
            <p class="error">{{ error }}</p>
        {% endif %}

        <form action="/{{ owner_slug }}/book" method="post">
            <label for="customer_name">{{ _('Your Name') }}:</label>
            <input type="text" id="customer_name" name="customer_name" value="{{ customer_name if customer_name else '' }}" required>

            <label for="customer_email">{{ _('Your Email') }}:</label>
            <input type="email" id="customer_email" name="customer_email" value="{{ customer_email if customer_email else '' }}" required>

            <label for="customer_phone">{{ _('Your Phone Number (optional, for WhatsApp confirmation)') }}:</label>
            <input type="tel" id="customer_phone" name="customer_phone" value="{{ customer_phone if customer_phone else '' }}">

            <label for="service_name">{{ _('Select Service') }}:</label>
            <select id="service_name" name="service_name" required>
                <option value="">{{ _('-- Please select a service --') }}</option>
                {% for service in services %}
                    <option value="{{ service.name }}" {% if selected_service == service.name %}selected{% endif %}>
                        {{ service.name }} - {{ service.duration }} {{ _('min') }} - {{ service.price }}
                    </option>
                {% endfor %}
            </select>

            <label for="booking_date">{{ _('Select Date') }}:</label>
            <input type="date" id="booking_date" name="booking_date" value="{{ selected_date if selected_date else '' }}" required>

            <label for="booking_time">{{ _('Select Time') }}:</label>
            <select id="booking_time" name="booking_time" required>
                <option value="">{{ _('-- Please select a time --') }}</option>
                {# This will be dynamically populated by JavaScript based on availability #}
                {% if selected_time %}
                    <option value="{{ selected_time }}" selected>{{ selected_time }}</option>
                {% endif %}
            </select>

            <button type="submit">{{ _('Book Now') }}</button>
        </form>
    </div>

    <script>
        const ownerAvailability = {{ availability | tojson }};
        const bookingDateInput = document.getElementById('booking_date');
        const bookingTimeSelect = document.getElementById('booking_time');

        function generateTimeSlots(date) {
            bookingTimeSelect.innerHTML = '<option value="">{{ _('-- Please select a time --') }}</option>';
            if (!date) return;

            const selectedDate = new Date(date);
            const dayOfWeek = selectedDate.getDay(); // Sunday is 0, Monday is 1, ..., Saturday is 6
            const adjustedDayOfWeek = (dayOfWeek === 0) ? 6 : dayOfWeek - 1; // Convert to 0=Mon, ..., 6=Sun

            const availableSlots = ownerAvailability.filter(slot => slot.day_of_week === adjustedDayOfWeek);

            if (availableSlots.length === 0) {
                const option = document.createElement('option');
                option.value = '';
                option.textContent = '{{ _('No availability for this day.') }}';
                bookingTimeSelect.appendChild(option);
                return;
            }

            availableSlots.forEach(slot => {
                let startTime = parseTime(slot.start_time);
                const endTime = parseTime(slot.end_time);
                const duration = 30; // Assuming a standard slot duration, or fetch from selected service

                while (startTime < endTime) {
                    const timeString = formatTime(startTime);
                    const option = document.createElement('option');
                    option.value = timeString;
                    option.textContent = timeString;
                    bookingTimeSelect.appendChild(option);
                    startTime.setMinutes(startTime.getMinutes() + duration);
                }
            });
            // Re-select previously selected time if present
            const selectedTimeValue = "{{ selected_time if selected_time else '' }}";
            if (selectedTimeValue) {
                bookingTimeSelect.value = selectedTimeValue;
            }
        }

        function parseTime(timeString) {
            const [hours, minutes] = timeString.split(':').map(Number);
            const date = new Date();
            date.setHours(hours, minutes, 0, 0);
            return date;
        }

        function formatTime(date) {
            return date.toLocaleTimeString('en-US', { hour: '2-digit', minute: '2-digit', hour12: false });
        }

        bookingDateInput.addEventListener('change', (event) => {
            generateTimeSlots(event.target.value);
        });

        // Initialize time slots if a date is already selected (e.g., after form submission with error)
        if (bookingDateInput.value) {
            generateTimeSlots(bookingDateInput.value);
        }
    </script>
</body>
</html>
