<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ owner.business_name }} - {{ gettext('Book an Appointment') }}</title>
    <link rel="stylesheet" href="/static/style.css">
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>{{ owner.business_name }}</h1>
            <div class="language-selector">
                <form action="/set-language" method="post" style="display: inline;">
                    <button type="submit" name="lang" value="en">English</button>
                </form>
                <form action="/set-language" method="post" style="display: inline;">
                    <button type="submit" name="lang" value="ar">العربية</button>
                </form>
                <form action="/set-language" method="post" style="display: inline;">
                    <button type="submit" name="lang" value="fr">Français</button>
                </form>
            </div>
        </div>

        <h2>{{ gettext('Book Your Appointment') }}</h2>

        {% if error_message %}
            <p style="color: red;">{{ error_message }}</p>
        {% endif %}

        <form action="/{{ owner.slug }}/book" method="post">
            <label for="customer_name">{{ gettext('Your Name') }}:</label>
            <input type="text" id="customer_name" name="customer_name" required>

            <label for="customer_email">{{ gettext('Your Email') }}:</label>
            <input type="email" id="customer_email" name="customer_email" required>

            <label for="customer_phone">{{ gettext('Your Phone Number (Optional, for WhatsApp notifications)') }}:</label>
            <input type="tel" id="customer_phone" name="customer_phone">

            <label for="service_name">{{ gettext('Select Service') }}:</label>
            <select id="service_name" name="service_name" required>
                {% for service in services %}
                    <option value="{{ service.name }}">{{ service.name }} ({{ service.duration_minutes }} min){% if service.price %} - ${{ service.price }}{% endif %}</option>
                {% else %}
                    <option value="">{{ gettext('No services available') }}</option>
                {% endfor %}
            </select>

            <label for="booking_date">{{ gettext('Select Date') }}:</label>
            <input type="date" id="booking_date" name="booking_date" required>

            <label for="booking_time">{{ gettext('Select Time') }}:</label>
            <input type="time" id="booking_time" name="booking_time" required>

            <button type="submit">{{ gettext('Confirm Booking') }}</button>
        </form>
    </div>
</body>
</html>
