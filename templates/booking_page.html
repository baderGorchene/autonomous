<!DOCTYPE html>
<html lang="{{ locale }}">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% trans %}BookSlot for{% endtrans %} {{ owner.business_name }}</title>
    <link rel="stylesheet" href="/static/css/style.css">
</head>
<body>
    <header>
        <h1>{{ owner.business_name }}</h1>
        <p>{% trans %}Book your slot with{% endtrans %} {{ owner.name }}!</p>
        <nav>
            <a href="?lang=en">English</a> |
            <a href="?lang=ar">العربية</a> |
            <a href="?lang=fr">Français</a>
        </nav>
    </header>
    <main>
        {% if error_message %}
            <p style="color: red;">{{ error_message }}</p>
        {% endif %}

        <form action="/{{ owner.slug }}/book" method="post">
            <label for="customer_name">{% trans %}Your Name{% endtrans %}:</label>
            <input type="text" id="customer_name" name="customer_name" required><br>

            <label for="customer_email">{% trans %}Your Email{% endtrans %}:</label>
            <input type="email" id="customer_email" name="customer_email" required><br>

            <label for="customer_phone">{% trans %}Your Phone (for WhatsApp updates){% endtrans %}:</label>
            <input type="text" id="customer_phone" name="customer_phone"><br>

            <label for="service_name">{% trans %}Select a Service{% endtrans %}:</label>
            <select id="service_name" name="service_name" required>
                {% for service in services %}
                    <option value="{{ service.name }}">{{ service.name }} ({{ service.duration_minutes }} {% trans %}minutes{% endtrans %})</option>
                {% else %}
                    <option value="">{% trans %}No services available{% endtrans %}</option>
                {% endfor %}
            </select><br>

            <label for="booking_date">{% trans %}Select a Date{% endtrans %}:</label>
            <input type="date" id="booking_date" name="booking_date" required><br>

            <label for="booking_time">{% trans %}Select a Time{% endtrans %}:</label>
            <input type="time" id="booking_time" name="booking_time" required><br>

            <button type="submit">{% trans %}Book Now{% endtrans %}</button>
        </form>
    </main>
    <script src="/static/js/booking_page.js"></script>
</body>
</html>
