<!DOCTYPE html>
<html lang="{{ current_lang }}">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ owner.business_name }} - {{ _('Book an Appointment') }}</title>
    <link href="https://cdn.jsdelivr.net/npm/tailwindcss@2.2.19/dist/tailwind.min.css" rel="stylesheet">
    <style>
        .lang-toggle a {
            padding: 0.5rem;
            border-radius: 0.25rem;
            text-decoration: none;
            color: #4a5568;
        }
        .lang-toggle a.active {
            background-color: #cbd5e0;
            font-weight: bold;
        }
        @media (max-width: 767px) {
            .container {
                padding: 1rem;
            }
        }
    </style>
</head>
<body class="bg-gray-100 min-h-screen flex flex-col">
    <header class="bg-white shadow-sm p-4">
        <div class="max-w-4xl mx-auto flex justify-between items-center">
            <h1 class="text-2xl font-bold text-gray-800">{{ owner.business_name }}</h1>
            <div class="lang-toggle flex items-center space-x-2">
                <a href="{{ request.url|update_query_param('lang', 'en') }}" class="{{ 'active' if current_lang == 'en' }}">EN</a>
                <a href="{{ request.url|update_query_param('lang', 'ar') }}" class="{{ 'active' if current_lang == 'ar' }}">AR</a>
                <a href="{{ request.url|update_query_param('lang', 'fr') }}" class="{{ 'active' if current_lang == 'fr' }}">FR</a>
            </div>
        </div>
    </header>

    <main class="flex-grow container mx-auto p-4 md:p-8">
        <div class="bg-white rounded-lg shadow-md p-6 md:p-8">
            <h2 class="text-xl md:text-2xl font-semibold mb-6 text-center text-gray-800">{{ _('Book Your Appointment') }}</h2>

            {% if error %}
                <div class="bg-red-100 border border-red-400 text-red-700 px-4 py-3 rounded relative mb-4" role="alert">
                    <strong class="font-bold">{{ _('Error!') }}</strong>
                    <span class="block sm:inline">{{ error }}</span>
                </div>
            {% endif %}

            <form action="{{ base_url }}{{ owner.slug }}/book" method="post" class="space-y-4">
                <div>
                    <label for="customer_name" class="block text-sm font-medium text-gray-700">{{ _('Your Name') }}</label>
                    <input type="text" id="customer_name" name="customer_name" required class="mt-1 block w-full px-3 py-2 border border-gray-300 rounded-md shadow-sm focus:outline-none focus:ring-indigo-500 focus:border-indigo-500 sm:text-sm">
                </div>
                <div>
                    <label for="customer_email" class="block text-sm font-medium text-gray-700">{{ _('Your Email') }}</label>
                    <input type="email" id="customer_email" name="customer_email" required class="mt-1 block w-full px-3 py-2 border border-gray-300 rounded-md shadow-sm focus:outline-none focus:ring-indigo-500 focus:border-indigo-500 sm:text-sm">
                </div>
                <div>
                    <label for="customer_phone" class="block text-sm font-medium text-gray-700">{{ _('Your Phone Number (Optional)') }}</label>
                    <input type="tel" id="customer_phone" name="customer_phone" class="mt-1 block w-full px-3 py-2 border border-gray-300 rounded-md shadow-sm focus:outline-none focus:ring-indigo-500 focus:border-indigo-500 sm:text-sm">
                </div>
                <div>
                    <label for="service_name" class="block text-sm font-medium text-gray-700">{{ _('Select Service') }}</label>
                    <select id="service_name" name="service_name" required class="mt-1 block w-full px-3 py-2 border border-gray-300 rounded-md shadow-sm focus:outline-none focus:ring-indigo-500 focus:border-indigo-500 sm:text-sm">
                        <option value="">{{ _('-- Please choose a service --') }}</option>
                        {% for service in services %}
                            <option value="{{ service.name }}" data-price="{{ service.price }}" data-duration="{{ service.duration_minutes }}">
                                {{ service.name }} ({{ service.price|format_currency(current_lang) }}) - {{ service.duration_minutes }} {{ _('min') }}
                            </option>
                        {% endfor %}
                    </select>
                </div>
                <div>
                    <label for="booking_date" class="block text-sm font-medium text-gray-700">{{ _('Preferred Date') }}</label>
                    <input type="date" id="booking_date" name="booking_date" required class="mt-1 block w-full px-3 py-2 border border-gray-300 rounded-md shadow-sm focus:outline-none focus:ring-indigo-500 focus:border-indigo-500 sm:text-sm">
                </div>
                <div>
                    <label for="booking_time" class="block text-sm font-medium text-gray-700">{{ _('Preferred Time') }}</label>
                    <input type="time" id="booking_time" name="booking_time" required class="mt-1 block w-full px-3 py-2 border border-gray-300 rounded-md shadow-sm focus:outline-none focus:ring-indigo-500 focus:border-indigo-500 sm:text-sm">
                    <p class="text-xs text-gray-500 mt-1">{{ _('Times are shown in your local timezone.') }}</p>
                </div>
                <div>
                    <label for="message" class="block text-sm font-medium text-gray-700">{{ _('Message (Optional)') }}</label>
                    <textarea id="message" name="message" rows="3" class="mt-1 block w-full px-3 py-2 border border-gray-300 rounded-md shadow-sm focus:outline-none focus:ring-indigo-500 focus:border-indigo-500 sm:text-sm"></textarea>
                </div>
                <button type="submit" class="w-full flex justify-center py-2 px-4 border border-transparent rounded-md shadow-sm text-sm font-medium text-white bg-indigo-600 hover:bg-indigo-700 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-indigo-500">
                    {{ _('Book Now') }}
                </button>
            </form>
        </div>
    </main>

    <footer class="bg-gray-800 text-white text-center p-4 mt-8">
        <p>&copy; {{ now().year }} BookSlot. {{ _('All rights reserved.') }}</p>
    </footer>

    <script>
        document.addEventListener('DOMContentLoaded', function() {
            const serviceSelect = document.getElementById('service_name');
            const priceDisplay = document.getElementById('service_price_display');
            const durationDisplay = document.getElementById('service_duration_display');

            function updateServiceDetails() {
                const selectedOption = serviceSelect.options[serviceSelect.selectedIndex];
                const price = selectedOption.dataset.price;
                const duration = selectedOption.dataset.duration;

                if (priceDisplay) priceDisplay.textContent = price ? `Price: $${parseFloat(price).toFixed(2)}` : '';
                if (durationDisplay) durationDisplay.textContent = duration ? `Duration: ${duration} min` : '';
            }

            if (serviceSelect) {
                serviceSelect.addEventListener('change', updateServiceDetails);
                updateServiceDetails();
            }
        });
    </script>
</body>
</html>
