<!DOCTYPE html>
<html lang="{{ current_lang }}">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ _('Book with %s') % owner.business_name }}</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/tailwindcss/2.2.19/tailwind.min.css">
</head>
<body class="bg-gray-100 font-sans leading-normal tracking-normal">
    <div class="container mx-auto p-4 max-w-md bg-white shadow-md rounded-lg mt-10">
        <div class="flex justify-between items-center mb-6">
            <h1 class="text-3xl font-bold text-center w-full">{{ _('Book with %s') % owner.business_name }}</h1>
            <div>
                <a href="{{ request.url|urlencode('lang', 'en') }}" class="text-blue-500 hover:underline mx-2">English</a>
                <a href="{{ request.url|urlencode('lang', 'ar') }}" class="text-blue-500 hover:underline mx-2">العربية</a>
                <a href="{{ request.url|urlencode('lang', 'fr') }}" class="text-blue-500 hover:underline mx-2">Français</a>
            </div>
        </div>

        {% if error_message %}
        <div class="bg-red-100 border border-red-400 text-red-700 px-4 py-3 rounded relative mb-4" role="alert">
            <span class="block sm:inline">{{ error_message }}</span>
        </div>
        {% endif %}

        <form action="/{{ owner.slug }}/book?lang={{ current_lang }}" method="POST" class="space-y-4">
            <div>
                <label for="customer_name" class="block text-sm font-medium text-gray-700">{{ _('Your Name') }}</label>
                <input type="text" id="customer_name" name="customer_name" class="mt-1 block w-full border border-gray-300 rounded-md shadow-sm p-2" required>
            </div>
            <div>
                <label for="customer_email" class="block text-sm font-medium text-gray-700">{{ _('Your Email') }}</label>
                <input type="email" id="customer_email" name="customer_email" class="mt-1 block w-full border border-gray-300 rounded-md shadow-sm p-2" required>
            </div>
            <div>
                <label for="customer_phone" class="block text-sm font-medium text-gray-700">{{ _('Your Phone Number (optional)') }}</label>
                <input type="text" id="customer_phone" name="customer_phone" class="mt-1 block w-full border border-gray-300 rounded-md shadow-sm p-2">
            </div>
            <div>
                <label for="service_name" class="block text-sm font-medium text-gray-700">{{ _('Select Service') }}</label>
                <select id="service_name" name="service_name" class="mt-1 block w-full border border-gray-300 rounded-md shadow-sm p-2" required>
                    {% for service in services %}
                        <option value="{{ service.name }}">{{ service.name }} - {{ service.duration }} {{ _('mins') }} - ${{ service.price }}</option>
                    {% else %}
                        <option value="">{{ _('No services available') }}</option>
                    {% endfor %}
                </select>
            </div>
            <div>
                <label for="booking_date" class="block text-sm font-medium text-gray-700">{{ _('Select Date') }}</label>
                <input type="date" id="booking_date" name="booking_date" class="mt-1 block w-full border border-gray-300 rounded-md shadow-sm p-2" required>
            </div>
            <div>
                <label for="booking_time" class="block text-sm font-medium text-gray-700">{{ _('Select Time') }}</label>
                <input type="time" id="booking_time" name="booking_time" class="mt-1 block w-full border border-gray-300 rounded-md shadow-sm p-2" required>
            </div>
            <button type="submit" class="w-full bg-blue-500 hover:bg-blue-700 text-white font-bold py-2 px-4 rounded">{{ _('Book Now') }}</button>
        </form>
    </div>
</body>
</html>
