<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>{{ owner.business_name }} - {{ _('Book a Service') }}</title><link rel="stylesheet" href="/static/style.css"></head><body><div class="container"><h1>{{ owner.business_name }}</h1><p>{{ _('Welcome! Book your service below.') }}</p><div class="language-switcher"><a href="{{ request.url|urlencode('lang', 'en') }}">EN</a> | <a href="{{ request.url|urlencode('lang', 'ar') }}">AR</a> | <a href="{{ request.url|urlencode('lang', 'fr') }}">FR</a></div>{% if error_message %}<p class="error-message">{{ error_message }}</p>{% endif %}<form action="/{{ owner.slug }}/book" method="post"><label for="customer_name">{{ _('Your Name') }}:</label><input type="text" id="customer_name" name="customer_name" required><label for="customer_email">{{ _('Your Email') }}:</label><input type="email" id="customer_email" name="customer_email" required><label for="customer_phone">{{ _('Your Phone Number (optional, for WhatsApp updates)') }}:</label><input type="tel" id="customer_phone" name="customer_phone"><label for="service_name">{{ _('Select Service') }}:</label><select id="service_name" name="service_name" required><option value="">-- {{ _('Choose a service') }} --</option>{% for service in services %}<option value="{{ service.name }}">{{ service.name }} ({{ service.duration }} {{ _('min') }})</option>{% endfor %}</select><label for="booking_date">{{ _('Select Date') }}:</label><input type="date" id="booking_date" name="booking_date" required><label for="booking_time">{{ _('Select Time') }}:</label><input type="time" id="booking_time" name="booking_time" required><button type="submit">{{ _('Book Now') }}</button></form></div></body></html>
