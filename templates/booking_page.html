{% extends "base.html" %}
{% block title %}{{ _("Book with ") }}{{ owner.business_name }}{% endblock %}
{% block content %}
<div class="container booking-page">
    <h1>{{ _("Book your slot with ") }}{{ owner.business_name }}</h1>
    {% if owner.description %}
        <p>{{ owner.description }}</p>
    {% endif %}

    <form action="/book/{{ owner.slug }}/submit" method="post">
        <div class="form-group">
            <label for="customer_name">{{ _("Your Name") }}:</label>
            <input type="text" id="customer_name" name="customer_name" required>
        </div>
        <div class="form-group">
            <label for="customer_email">{{ _("Your Email") }}:</label>
            <input type="email" id="customer_email" name="customer_email" required>
        </div>
        <div class="form-group">
            <label for="customer_phone">{{ _("Your Phone Number (optional, for WhatsApp notifications)") }}:</label>
            <input type="text" id="customer_phone" name="customer_phone">
        </div>

        <div class="form-group">
            <label for="service_name">{{ _("Select a Service") }}:</label>
            <select id="service_name" name="service_name" required>
                <option value="">{{ _("-- Please choose a service --") }}</option>
                {% for service in services %}
                    <option value="{{ service.name }}">{{ service.name }} ({{ service.duration }} min, {{ service.price }} USD)</option>
                {% endfor %}
            </select>
        </div>

        <div class="form-group">
            <label for="booking_date_str">{{ _("Select a Date") }}:</label>
            <input type="date" id="booking_date_str" name="booking_date_str" required>
        </div>

        <div class="form-group">
            <label for="booking_time">{{ _("Select a Time Slot") }}:</label>
            <select id="booking_time" name="booking_time" required>
                <option value="">{{ _("-- Please choose a time --") }}</option>
                <!-- Options will be populated by JavaScript based on date and availability -->
            </select>
        </div>

        <button type="submit">{{ _("Book Now") }}</button>
    </form>
</div>
{% endblock %}

{% block scripts %}
<script>
    // This is a simplified client-side logic.
    // A real implementation would fetch availability dynamically from the server.
    const availabilityData = JSON.parse('{{ availability | tojson }}'); // Assuming availability is passed as JSON string
    const servicesData = JSON.parse('{{ services | tojson }}');
    const bookingDateInput = document.getElementById('booking_date_str');
    const bookingTimeSelect = document.getElementById('booking_time');

    function getDayOfWeek(dateString) {
        const date = new Date(dateString);
        return date.getDay(); // 0 for Sunday, 1 for Monday, etc.
    }

    function populateTimeSlots() {
        const selectedDate = bookingDateInput.value;
        bookingTimeSelect.innerHTML = '<option value="">{{ _("-- Please choose a time --") }}</option>';

        if (!selectedDate) return;

        const dayOfWeek = getDayOfWeek(selectedDate);
        const dayAvailability = availabilityData[dayOfWeek.toString()];

        if (dayAvailability && dayAvailability.length > 0) {
            const start = dayAvailability[0].start_time;
            const end = dayAvailability[0].end_time;
            
            // Simple time slot generation (e.g., every 30 mins)
            let currentTime = new Date(`2000-01-01T${start}:00`);
            const endTime = new Date(`2000-01-01T${end}:00`);

            while (currentTime < endTime) {
                const timeString = currentTime.toTimeString().slice(0, 5);
                const option = document.createElement('option');
                option.value = timeString;
                option.textContent = timeString;
                bookingTimeSelect.appendChild(option);
                currentTime.setMinutes(currentTime.getMinutes() + 30); // 30 minute intervals
            }
        } else {
            const option = document.createElement('option');
            option.value = '';
            option.textContent = '{{ _("No availability for this day") }}';
            bookingTimeSelect.appendChild(option);
        }
    }

    bookingDateInput.addEventListener('change', populateTimeSlots);

    // Set min date to today
    const today = new Date();
    const yyyy = today.getFullYear();
    const mm = String(today.getMonth() + 1).padStart(2, '0'); // Months start at 0!
    const dd = String(today.getDate()).padStart(2, '0');
    bookingDateInput.min = `${yyyy}-${mm}-${dd}`;

    // Initial population if a date is pre-selected (e.g., on error re-render)
    populateTimeSlots();

</script>
{% endblock %}
