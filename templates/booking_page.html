<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>{{ owner.business_name }} - {{ request.state.gettext("Book an Appointment") }}</title></head><body><h1>{{ owner.business_name }}</h1><p>{{ request.state.gettext("Book an appointment with") }} {{ owner.name }}.</p>{% if error %}<p style="color: red;">{{ error }}</p>{% endif %}<form method="post"><label for="customer_name">{{ request.state.gettext("Your Name") }}:</label><input type="text" id="customer_name" name="customer_name" required><br><label for="customer_email">{{ request.state.gettext("Your Email") }}:</label><input type="email" id="customer_email" name="customer_email" required><br><label for="customer_phone">{{ request.state.gettext("Your Phone") }}:</label><input type="tel" id="customer_phone" name="customer_phone"><br><label for="service">{{ request.state.gettext("Select Service") }}:</label><select id="service" name="service" required><option value="">-- {{ request.state.gettext("Choose a service") }} --</option>{% for service in services %}<option value="{{ service.name }}">{{ service.name }} ({{ service.duration }} {{ request.state.gettext("min") }}, {{ service.price }} {{ request.state.gettext("currency") }})</option>{% endfor %}</select><br><label for="booking_date">{{ request.state.gettext("Select Date") }}:</label><input type="date" id="booking_date" name="booking_date" value="{{ current_date }}" required><br><label for="booking_time">{{ request.state.gettext("Select Time") }}:</label><input type="time" id="booking_time" name="booking_time" required><br><button type="submit">{{ request.state.gettext("Book Now") }}</button></form><div><a href="{{ request.url | urlencode('lang', 'en') }}">English</a> | <a href="{{ request.url | urlencode('lang', 'ar') }}">العربية</a> | <a href="{{ request.url | urlencode('lang', 'fr') }}">Français</a></div></body></html>
