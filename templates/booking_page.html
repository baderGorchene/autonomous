<!DOCTYPE html>
<html lang="{{ current_locale }}">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ _('Book with') }} {{ owner.business_name }}</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@picocss/pico@1/css/pico.min.css">
    <style>
        body { padding: 20px; }
        .container { max-width: 600px; margin: auto; }
        .time-slot-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(100px, 1fr));
            gap: 10px;
            margin-top: 15px;
        }
        .time-slot-grid button {
            width: 100%;
            padding: 10px;
            background-color: var(--pico-primary-background);
            color: var(--pico-primary);
            border: 1px solid var(--pico-primary);
            border-radius: var(--pico-border-radius);
            cursor: pointer;
            transition: background-color 0.2s, color 0.2s;
        }
        .time-slot-grid button:hover,
        .time-slot-grid button.selected {
            background-color: var(--pico-primary);
            color: var(--pico-primary-inverse);
        }
        .date-selector {
            display: flex;
            gap: 10px;
            overflow-x: auto;
            padding-bottom: 10px;
            margin-bottom: 20px;
        }
        .date-selector button {
            flex-shrink: 0;
            min-width: 100px;
        }
    </style>
</head>
<body>
    <div class="container">
        <nav class="container-fluid">
            <ul>
                <li><strong>BookSlot</strong></li>
            </ul>
            <ul>
                <li><a href="{{ request.url|urlencode('lang', 'en') }}" role="button">EN</a></li>
                <li><a href="{{ request.url|urlencode('lang', 'ar') }}" role="button">AR</a></li>
                <li><a href="{{ request.url|urlencode('lang', 'fr') }}" role="button">FR</a></li>
            </ul>
        </nav>

        <h1>{{ owner.business_name }}</h1>
        <p>{{ _('Book a service with') }} {{ owner.name }}</p>

        <form action="/book/{{ owner.slug }}" method="post">
            <fieldset>
                <legend>{{ _('Your Details') }}</legend>
                <label for="customer_name">{{ _('Name') }}</label>
                <input type="text" id="customer_name" name="customer_name" required>

                <label for="customer_email">{{ _('Email') }}</label>
                <input type="email" id="customer_email" name="customer_email" required>

                <label for="customer_phone">{{ _('Phone Number (WhatsApp preferred)') }}</label>
                <input type="tel" id="customer_phone" name="customer_phone" placeholder="+1234567890" required>
            </fieldset>

            <fieldset>
                <legend>{{ _('Service Selection') }}</legend>
                <label for="service_name">{{ _('Select a Service') }}</label>
                <select id="service_name" name="service_name" required>
                    {% for service in services %}
                        <option value="{{ service.name }}">{{ service.name }} ({{ service.duration_minutes }} {{ _('min') }} - {{ service.price }} USD)</option>
                    {% endfor %}
                </select>
            </fieldset>

            <fieldset>
                <legend>{{ _('Select Date and Time') }}</legend>
                <div class="date-selector">
                    {% for date_str, slots in available_slots.items() %}
                        <button type="button" class="date-button" data-date="{{ date_str }}">{{ date_str }}</button>
                    {% endfor %}
                </div>
                <input type="hidden" id="booking_date" name="booking_date" required>

                <label for="booking_time">{{ _('Available Times for') }} <span id="selected_date_display"></span></label>
                <div id="time_slots_container" class="time-slot-grid">
                    <p>{{ _('Please select a date first.') }}</p>
                </div>
                <input type="hidden" id="booking_time" name="booking_time" required>
            </fieldset>

            <button type="submit">{{ _('Book Now') }}</button>
        </form>
    </div>

    <script>
        const dateButtons = document.querySelectorAll('.date-button');
        const timeSlotsContainer = document.getElementById('time_slots_container');
        const bookingDateInput = document.getElementById('booking_date');
        const bookingTimeInput = document.getElementById('booking_time');
        const selectedDateDisplay = document.getElementById('selected_date_display');
        const availableSlots = {{ available_slots | tojson }};

        dateButtons.forEach(button => {
            button.addEventListener('click', () => {
                dateButtons.forEach(btn => btn.classList.remove('selected'));
                button.classList.add('selected');
                const selectedDate = button.dataset.date;
                bookingDateInput.value = selectedDate;
                selectedDateDisplay.textContent = selectedDate;
                renderTimeSlots(selectedDate);
            });
        });

        function renderTimeSlots(date) {
            timeSlotsContainer.innerHTML = '';
            const slots = availableSlots[date];
            if (slots && slots.length > 0) {
                slots.forEach(time => {
                    const button = document.createElement('button');
                    button.type = 'button';
                    button.textContent = time;
                    button.addEventListener('click', () => {
                        document.querySelectorAll('#time_slots_container button').forEach(btn => btn.classList.remove('selected'));
                        button.classList.add('selected');
                        bookingTimeInput.value = time;
                    });
                    timeSlotsContainer.appendChild(button);
                });
            } else {
                timeSlotsContainer.innerHTML = `<p>{{ _('No available slots for this date.') }}</p>`;
            }
            bookingTimeInput.value = ''; // Reset time selection on date change
        }

        // Initialize with the first date selected
        if (dateButtons.length > 0) {
            dateButtons[0].click();
        }
    </script>
</body>
</html>
