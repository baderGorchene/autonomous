<!DOCTYPE html>
<html lang="{{ request.session.get('locale', 'en') }}">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ owner.business_name }} - {{ _('Book an Appointment') }}</title>
    <link href="https://cdn.jsdelivr.net/npm/tailwindcss@2.2.19/dist/tailwind.min.css" rel="stylesheet">
    <style>
        body { font-family: sans-serif; }
        .service-card { cursor: pointer; }
        .service-card.selected { border-color: #3b82f6; background-color: #eff6ff; }
        .day-button { @apply px-4 py-2 border rounded-md text-sm font-medium; }
        .day-button.selected { @apply bg-blue-500 text-white; }
        .time-slot { @apply px-3 py-2 border rounded-md text-sm cursor-pointer; }
        .time-slot.selected { @apply bg-green-500 text-white; }
        .time-slot.unavailable { @apply bg-gray-200 text-gray-500 cursor-not-allowed; }
    </style>
</head>
<body class="bg-gray-100 min-h-screen flex flex-col items-center py-8">
    <div class="max-w-md w-full bg-white p-6 rounded-lg shadow-md">
        <div class="flex justify-end mb-4">
            <a href="{{ url_for('set_locale', locale_code='en') }}" class="text-blue-500 hover:underline mx-1">EN</a> |
            <a href="{{ url_for('set_locale', locale_code='ar') }}" class="text-blue-500 hover:underline mx-1">AR</a> |
            <a href="{{ url_for('set_locale', locale_code='fr') }}" class="text-blue-500 hover:underline mx-1">FR</a>
        </div>
        <h1 class="text-3xl font-bold text-center text-gray-800 mb-6">{{ owner.business_name }}</h1>
        <p class="text-center text-gray-600 mb-8">{{ _('Book your appointment easily!') }}</p>

        {% if error %}
        <div class="bg-red-100 border border-red-400 text-red-700 px-4 py-3 rounded relative mb-4" role="alert">
            <strong class="font-bold">{{ _('Error!') }}</strong>
            <span class="block sm:inline">{{ error }}</span>
        </div>
        {% endif %}

        <form action="{{ url_for('submit_booking', owner_slug=owner.slug) }}" method="POST" id="bookingForm">
            <div class="mb-6">
                <label for="customer_name" class="block text-gray-700 text-sm font-bold mb-2">{{ _('Your Name') }}:</label>
                <input type="text" id="customer_name" name="customer_name" required
                       class="shadow appearance-none border rounded w-full py-2 px-3 text-gray-700 leading-tight focus:outline-none focus:shadow-outline">
            </div>
            <div class="mb-6">
                <label for="customer_email" class="block text-gray-700 text-sm font-bold mb-2">{{ _('Your Email') }}:</label>
                <input type="email" id="customer_email" name="customer_email" required
                       class="shadow appearance-none border rounded w-full py-2 px-3 text-gray-700 leading-tight focus:outline-none focus:shadow-outline">
            </div>
            <div class="mb-6">
                <label for="customer_phone" class="block text-gray-700 text-sm font-bold mb-2">{{ _('Your Phone (Optional)') }}:</label>
                <input type="tel" id="customer_phone" name="customer_phone"
                       class="shadow appearance-none border rounded w-full py-2 px-3 text-gray-700 leading-tight focus:outline-none focus:shadow-outline">
            </div>

            <div class="mb-6">
                <label class="block text-gray-700 text-sm font-bold mb-2">{{ _('Select a Service') }}:</label>
                <div class="grid grid-cols-1 gap-4">
                    {% for service in services %}
                    <div class="service-card border-2 border-gray-200 p-4 rounded-lg flex justify-between items-center"
                         data-service-name="{{ service.name }}"
                         data-service-duration="{{ service.duration_minutes }}">
                        <div>
                            <h3 class="font-semibold text-lg">{{ service.name }}</h3>
                            <p class="text-gray-600 text-sm">{{ service.description }}</p>
                        </div>
                        <span class="font-bold text-blue-600">${{ service.price | '%.2f' % }}</span>
                    </div>
                    {% endfor %}
                </div>
                <input type="hidden" name="service_name" id="selected_service_name" required>
            </div>

            <div class="mb-6">
                <label class="block text-gray-700 text-sm font-bold mb-2">{{ _('Select a Date') }}:</label>
                <div id="calendar" class="grid grid-cols-7 gap-2 text-center mb-4">
                    <!-- Dates will be dynamically loaded here -->
                </div>
                <input type="hidden" name="booking_date" id="selected_booking_date" required>
            </div>

            <div class="mb-6" id="timeSlotsContainer" style="display: none;">
                <label class="block text-gray-700 text-sm font-bold mb-2">{{ _('Select a Time Slot') }}:</label>
                <div id="timeSlots" class="grid grid-cols-3 md:grid-cols-4 gap-2">
                    <!-- Time slots will be dynamically loaded here -->
                </div>
                <input type="hidden" name="booking_time" id="selected_booking_time" required>
            </div>

            <button type="submit"
                    class="w-full bg-blue-500 hover:bg-blue-700 text-white font-bold py-2 px-4 rounded focus:outline-none focus:shadow-outline">
                {{ _('Confirm Booking') }}
            </button>
        </form>
    </div>

    <script>
        const services = {{ services | tojson }};
        const availability = {{ availability | tojson }};
        const serviceCards = document.querySelectorAll('.service-card');
        const selectedServiceNameInput = document.getElementById('selected_service_name');
        const selectedBookingDateInput = document.getElementById('selected_booking_date');
        const selectedBookingTimeInput = document.getElementById('selected_booking_time');
        const calendarDiv = document.getElementById('calendar');
        const timeSlotsContainer = document.getElementById('timeSlotsContainer');
        const timeSlotsDiv = document.getElementById('timeSlots');

        let selectedService = null;
        let selectedDate = null;
        let selectedTime = null;

        // Service selection logic
        serviceCards.forEach(card => {
            card.addEventListener('click', () => {
                serviceCards.forEach(sc => sc.classList.remove('selected', 'border-blue-500', 'bg-blue-50'));
                card.classList.add('selected', 'border-blue-500', 'bg-blue-50');
                selectedService = {
                    name: card.dataset.serviceName,
                    duration: parseInt(card.dataset.serviceDuration)
                };
                selectedServiceNameInput.value = selectedService.name;
                resetTimeSelection();
                renderCalendar();
            });
        });

        function resetTimeSelection() {
            selectedDate = null;
            selectedTime = null;
            selectedBookingDateInput.value = '';
            selectedBookingTimeInput.value = '';
            timeSlotsContainer.style.display = 'none';
            timeSlotsDiv.innerHTML = '';
        }

        function renderCalendar() {
            calendarDiv.innerHTML = '';
            const today = new Date();
            today.setHours(0, 0, 0, 0); // Normalize to start of day
            const daysOfWeek = ['Sun', 'Mon', 'Tue', 'Wed', 'Thu', 'Fri', 'Sat'];

            for (let i = 0; i < 30; i++) { // Show 30 days
                const date = new Date();
                date.setDate(today.getDate() + i);
                const dayOfWeek = daysOfWeek[date.getDay()];
                const formattedDate = date.toISOString().split('T')[0]; // YYYY-MM-DD
                const displayDate = date.getDate();
                const displayMonth = date.toLocaleString('{{ request.session.get("locale", "en") }}', { month: 'short' });

                const dayButton = document.createElement('button');
                dayButton.type = 'button';
                dayButton.classList.add('day-button', 'flex', 'flex-col', 'items-center', 'justify-center', 'h-16', 'w-full', 'hover:bg-gray-200');
                dayButton.innerHTML = `<span class="text-xs font-semibold">${_('${dayOfWeek}')}</span><span class="text-lg font-bold">${displayDate}</span><span class="text-xs">${displayMonth}</span>`;
                dayButton.dataset.date = formattedDate;
                dayButton.dataset.dayOfWeek = dayOfWeek;

                if (selectedDate === formattedDate) {
                    dayButton.classList.add('selected');
                }

                dayButton.addEventListener('click', () => {
                    selectedDate = formattedDate;
                    selectedBookingDateInput.value = formattedDate;
                    renderCalendar(); // Re-render to highlight selected date
                    renderTimeSlots(dayOfWeek, formattedDate);
                });
                calendarDiv.appendChild(dayButton);
            }
        }

        function generateTimeSlots(dayOfWeek, dateStr) {
            const availableSlots = availability[dayOfWeek] || [];
            const generatedSlots = [];
            const bookingDuration = selectedService ? selectedService.duration : 60; // Default 60 min if no service selected

            availableSlots.forEach(slot => {
                let current = new Date(`${dateStr}T${slot.start_time}:00`);
                let end = new Date(`${dateStr}T${slot.end_time}:00`);

                while (current.getTime() + bookingDuration * 60 * 1000 <= end.getTime()) {
                    const time = current.toTimeString().substring(0, 5);
                    generatedSlots.push(time);
                    current.setMinutes(current.getMinutes() + bookingDuration);
                }
            });
            return generatedSlots;
        }

        function renderTimeSlots(dayOfWeek, dateStr) {
            if (!selectedService) {
                timeSlotsContainer.style.display = 'none';
                return;
            }

            timeSlotsDiv.innerHTML = '';
            const slots = generateTimeSlots(dayOfWeek, dateStr);
            const now = new Date();
            const selectedDateTime = new Date(dateStr);

            if (slots.length === 0) {
                timeSlotsDiv.innerHTML = `<p class="col-span-full text-center text-gray-50">{{ _('No available slots for this day.') }}</p>`;
                timeSlotsContainer.style.display = 'block';
                return;
            }

            slots.forEach(slotTime => {
                const [hour, minute] = slotTime.split(':').map(Number);
                const slotStart = new Date(selectedDateTime.getFullYear(), selectedDateTime.getMonth(), selectedDateTime.getDate(), hour, minute);
                
                const isPast = slotStart.getTime() < now.getTime();

                const timeSlotButton = document.createElement('button');
                timeSlotButton.type = 'button';
                timeSlotButton.classList.add('time-slot', 'hover:bg-gray-200');
                if (isPast) {
                    timeSlotButton.classList.add('unavailable');
                    timeSlotButton.disabled = true;
                } else if (selectedTime === slotTime) {
                    timeSlotButton.classList.add('selected');
                }
                timeSlotButton.textContent = slotTime;
                timeSlotButton.dataset.time = slotTime;

                timeSlotButton.addEventListener('click', () => {
                    if (!timeSlotButton.disabled) {
                        document.querySelectorAll('.time-slot').forEach(ts => ts.classList.remove('selected', 'bg-green-500', 'text-white'));
                        timeSlotButton.classList.add('selected', 'bg-green-500', 'text-white');
                        selectedTime = slotTime;
                        selectedBookingTimeInput.value = slotTime;
                    }
                });
                timeSlotsDiv.appendChild(timeSlotButton);
            });
            timeSlotsContainer.style.display = 'block';
        }

        // Initial render
        renderCalendar();
    </script>
</body>
</html>
