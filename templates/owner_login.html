{% extends "base.html" %}

{% block title %}{{ _('Owner Login') }}{% endblock %}

{% block content %}
<div class="max-w-md mx-auto bg-white p-8 rounded-lg shadow-md mt-10">
    <h1 class="text-3xl font-bold text-gray-800 mb-6 text-center">{{ _('Login to Your Dashboard') }}</h1>
    {% if error %}
        <div class="bg-red-100 border border-red-400 text-red-700 px-4 py-3 rounded relative mb-4" role="alert">
            <strong class="font-bold">{{ _('Error!') }}</strong>
            <span class="block sm:inline">{{ error }}</span>
        </div>
    {% endif %}
    <form action="/login" method="post" class="space-y-4">
        <div>
            <label for="email" class="block text-sm font-medium text-gray-700">{{ _('Email Address') }}</label>
            <input type="email" id="email" name="email" required class="mt-1 block w-full px-3 py-2 border border-gray-300 rounded-md shadow-sm focus:outline-none focus:ring-indigo-500 focus:border-indigo-500">
        </div>
        <div>
            <label for="password" class="block text-sm font-medium text-gray-700">{{ _('Password') }}</label>
            <input type="password" id="password" name="password" required class="mt-1 block w-full px-3 py-2 border border-gray-300 rounded-md shadow-sm focus:outline-none focus:ring-indigo-500 focus:border-indigo-500">
        </div>
        <button type="submit" class="w-full flex justify-center py-2 px-4 border border-transparent rounded-md shadow-sm text-sm font-medium text-white bg-indigo-600 hover:bg-indigo-700 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-indigo-500">
            {{ _('Login') }}
        </button>
    </form>
    <p class="mt-6 text-center text-sm text-gray-600">
        {{ _('Don\'t have an account?') }}
        <a href="/register" class="font-medium text-indigo-600 hover:text-indigo-500">{{ _('Register here') }}</a>
    </p>
</div>
{% endblock %}
