<!DOCTYPE html>
<html lang="{{ current_locale() }}">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ title }} - BookSlot</title>
    <link rel="stylesheet" href="/static/style.css">
</head>
<body>
    <div class="container">
        <h1>{{ _("Register for BookSlot") }}</h1>
        {% if error %}
            <p style="color: red;">{{ error }}</p>
        {% endif %}
        <form action="/register" method="post">
            <label for="name">{{ _("Your Name:") }}</label>
            <input type="text" id="name" name="name" required>

            <label for="email">{{ _("Email:") }}</label>
            <input type="email" id="email" name="email" required>

            <label for="password">{{ _("Password:") }}</label>
            <input type="password" id="password" name="password" required>

            <label for="business_name">{{ _("Business Name:") }}</label>
            <input type="text" id="business_name" name="business_name" required>

            <label for="slug">{{ _("Desired Booking Page URL (e.g., bookslot.app/your-business):") }}</label>
            <input type="text" id="slug" name="slug" pattern="^[a-z0-9-]+$" title="{{ _('Lowercase letters, numbers, and hyphens only') }}" required>

            <label for="phone">{{ _("Your Phone Number (for WhatsApp notifications, optional):") }}</label>
            <input type="tel" id="phone" name="phone">

            <button type="submit">{{ _("Register") }}</button>
        </form>
        <p>{{ _("Already have an account?") }} <a href="/login">{{ _("Login here") }}</a></p>

        <div class="language-selector">
            <form action="/set-language-redirect" method="post" style="display:inline;">
                <input type="hidden" name="lang" value="en">
                <button type="submit" {% if current_locale() == 'en' %}disabled{% endif %}>English</button>
            </form>
            <form action="/set-language-redirect" method="post" style="display:inline;">
                <input type="hidden" name="lang" value="ar">
                <button type="submit" {% if current_locale() == 'ar' %}disabled{% endif %}>العربية</button>
            </form>
            <form action="/set-language-redirect" method="post" style="display:inline;">
                <input type="hidden" name="lang" value="fr">
                <button type="submit" {% if current_locale() == 'fr' %}disabled{% endif %}>Français</button>
            </form>
        </div>
    </div>
</body>
</html>
