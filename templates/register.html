{% extends "base.html" %}
{% block title %}{{ _("Register") }}{% endblock %}
{% block content %}
<div class="container">
    <h1>{{ _("Create your BookSlot account") }}</h1>
    {% if error %}
        <p class="error-message">{{ error }}</p>
    {% endif %}
    <form action="/register" method="post">
        <label for="name">{{ _("Your Name") }}:</label>
        <input type="text" id="name" name="name" required>

        <label for="email">{{ _("Email") }}:</label>
        <input type="email" id="email" name="email" required>

        <label for="password">{{ _("Password") }}:</label>
        <input type="password" id="password" name="password" required>

        <label for="business_name">{{ _("Business Name") }}:</label>
        <input type="text" id="business_name" name="business_name" required>

        <label for="slug">{{ _("Your Booking Page URL (e.g., bookslot.app/your-name)") }}:</label>
        <input type="text" id="slug" name="slug" pattern="^[a-z0-9-]+$" title="{{ _('Only lowercase letters, numbers, and hyphens') }}" required>

        <button type="submit">{{ _("Register") }}</button>
    </form>
    <p>{{ _("Already have an account?") }} <a href="/login">{{ _("Login here") }}</a></p>
</div>
{% endblock %}
