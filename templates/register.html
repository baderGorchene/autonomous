<!DOCTYPE html>
<html lang="{{ request.state.lang }}" dir="{{ 'rtl' if request.state.lang == 'ar' else 'ltr' }}">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ title }}</title>
    <link href="https://cdn.jsdelivr.net/npm/tailwindcss@2.2.19/dist/tailwind.min.css" rel="stylesheet">
    <style>
        body { font-family: sans-serif; }
        .rtl { direction: rtl; text-align: right; }
        .ltr { direction: ltr; text-align: left; }
    </style>
</head>
<body class="bg-gray-100 min-h-screen flex items-center justify-center">
    <div class="bg-white p-8 rounded-lg shadow-md w-full max-w-md">
        <h1 class="text-2xl font-bold mb-4 text-center">{{ _("Register Your Business") }}</h1>
        {% if error %}
            <p class="text-red-500 mb-4 text-center">{{ error }}</p>
        {% endif %}
        <form method="POST" action="/register" class="space-y-4">
            <div>
                <label for="name" class="block text-sm font-medium text-gray-700">{{ _("Your Name") }}</label>
                <input type="text" id="name" name="name" required class="mt-1 block w-full border border-gray-300 rounded-md shadow-sm p-2">
            </div>
            <div>
                <label for="email" class="block text-sm font-medium text-gray-700">{{ _("Email") }}</label>
                <input type="email" id="email" name="email" required class="mt-1 block w-full border border-gray-300 rounded-md shadow-sm p-2">
            </div>
            <div>
                <label for="password" class="block text-sm font-medium text-gray-700">{{ _("Password") }}</label>
                <input type="password" id="password" name="password" required class="mt-1 block w-full border border-gray-300 rounded-md shadow-sm p-2">
            </div>
            <div>
                <label for="business_name" class="block text-sm font-medium text-gray-700">{{ _("Business Name") }}</label>
                <input type="text" id="business_name" name="business_name" required class="mt-1 block w-full border border-gray-300 rounded-md shadow-sm p-2">
            </div>
            <div>
                <label for="slug" class="block text-sm font-medium text-gray-700">{{ _("Your Booking Page URL (e.g., bookslot.app/your-slug)") }}</label>
                <input type="text" id="slug" name="slug" required pattern="^[a-z0-9-]+$" title="{{ _("Lowercase letters, numbers, and hyphens only") }}" class="mt-1 block w-full border border-gray-300 rounded-md shadow-sm p-2">
            </div>
            <div>
                <label for="phone" class="block text-sm font-medium text-gray-700">{{ _("Phone Number (Optional)") }}</label>
                <input type="tel" id="phone" name="phone" class="mt-1 block w-full border border-gray-300 rounded-md shadow-sm p-2">
            </div>
            <button type="submit" class="w-full bg-blue-500 text-white py-2 px-4 rounded-md hover:bg-blue-600">{{ _("Register") }}</button>
        </form>
        <p class="mt-4 text-center text-gray-600">{{ _("Already have an account?") }} <a href="/login" class="text-blue-500 hover:underline">{{ _("Login here") }}</a></p>
        <div class="mt-6 flex justify-center space-x-4">
            <a href="{{ request.url|update_query_param('lang', 'en') }}" class="text-blue-500 hover:underline">English</a>
            <a href="{{ request.url|update_query_param('lang', 'ar') }}" class="text-blue-500 hover:underline">العربية</a>
            <a href="{{ request.url|update_query_param('lang', 'fr') }}" class="text-blue-500 hover:underline">Français</a>
        </div>
    </div>
</body>
</html>
