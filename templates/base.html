<!DOCTYPE html>
<html lang="{{ request.cookies.get('lang', 'en') }}">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}{{ _('BookSlot App') }}{% endblock %}</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background-color: #f8f9fa; color: #343a40; }
        .navbar { background-color: #ffffff; border-bottom: 1px solid #e9ecef; }
        .navbar-brand { font-weight: bold; color: #007bff !important; }
        .footer { background-color: #343a40; color: white; padding: 1rem 0; margin-top: 3rem; text-align: center; }
        .container { max-width: 960px; margin-top: 20px; }
        .card { border: none; border-radius: 0.5rem; box-shadow: 0 0.125rem 0.25rem rgba(0, 0, 0, 0.075); }
        .btn-primary { background-color: #007bff; border-color: #007bff; }
        .btn-primary:hover { background-color: #0056b3; border-color: #0056b3; }
        .alert { margin-top: 1rem; }
        .dashboard-container .card-link { color: #007bff; text-decoration: none; }
        .dashboard-container .card-link:hover { text-decoration: underline; }
        .dashboard-container .list-group-item-action { transition: background-color 0.2s ease; }
        .dashboard-container .list-group-item-action:hover { background-color: #f1f1f1; }
        .booking-page-container .booking-form { max-width: 500px; margin: 0 auto; }
        .confirmation-container { padding: 50px 0; }
        .confirmation-container h1 { font-size: 2.5rem; }
        .confirmation-container .lead { font-size: 1.25rem; }
        .service-item, .slot-item { background-color: #f2f2f2; border: 1px solid #e0e0e0; padding: 10px; margin-bottom: 10px; border-radius: 5px; }
        .service-item .btn-danger, .slot-item .btn-outline-danger { margin-top: 10px; }
        .language-toggle .btn { border: 1px solid #ced4da; }
    </style>
</head>
<body>
    <nav class="navbar navbar-expand-lg navbar-light">
        <div class="container-fluid">
            <a class="navbar-brand" href="/">BookSlot</a>
            <div class="d-flex ms-auto language-toggle">
                <form action="/set-language" method="post" class="d-inline me-2">
                    <input type="hidden" name="lang" value="en">
                    <button type="submit" class="btn btn-sm {% if request.cookies.get('lang', 'en') == 'en' %}btn-primary{% else %}btn-light{% endif %}">EN</button>
                </form>
                <form action="/set-language" method="post" class="d-inline me-2">
                    <input type="hidden" name="lang" value="ar">
                    <button type="submit" class="btn btn-sm {% if request.cookies.get('lang') == 'ar' %}btn-primary{% else %}btn-light{% endif %}">AR</button>
                </form>
                <form action="/set-language" method="post" class="d-inline">
                    <input type="hidden" name="lang" value="fr">
                    <button type="submit" class="btn btn-sm {% if request.cookies.get('lang') == 'fr' %}btn-primary{% else %}btn-light{% endif %}">FR</button>
                </form>
            </div>
        </div>
    </nav>

    <main>
        {% block content %}
        {% endblock %}
    </main>

    <footer class="footer">
        <div class="container">
            <p>&copy; 2024 BookSlot. {{ _('All rights reserved.') }}</p>
        </div>
    </footer>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js" integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz" crossorigin="anonymous"></script>
</body>
</html>
