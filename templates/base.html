<!DOCTYPE html>
<html lang="{{ request.session.get('lang', 'en') }}">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}BookSlot{% endblock %}</title>
    <link rel="stylesheet" href="/static/css/style.css">
</head>
<body>
    <header>
        <nav>
            <a href="/" class="logo">BookSlot</a>
            <div class="lang-toggle">
                <a href="{{ request.url|urlencode('lang', 'en') }}">EN</a> |
                <a href="{{ request.url|urlencode('lang', 'ar') }}">AR</a> |
                <a href="{{ request.url|urlencode('lang', 'fr') }}">FR</a>
            </div>
        </nav>
    </header>
    <main>
        {% block content %}{% endblock %}
    </main>
    <footer>
        <p>&copy; 2023 BookSlot</p>
    </footer>
    {% block scripts %}{% endblock %}
</body>
</html>
