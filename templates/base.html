<!DOCTYPE html>
<html lang="{{ locale }}">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}BookSlot{% endblock %}</title>
    <link rel="stylesheet" href="/static/css/style.css">
</head>
<body>
    <div class="container">
        <header>
            <h1>BookSlot</h1>
            <div class="locale-switcher">
                <a href="{{ request.url|urlencode('locale', 'en') }}">English</a> |
                <a href="{{ request.url|urlencode('locale', 'ar') }}">العربية</a> |
                <a href="{{ request.url|urlencode('locale', 'fr') }}">Français</a>
            </div>
        </header>
        <main>
            {% block content %}{% endblock %}
        </main>
    </div>
</body>
</html>
