<!-- templates/base.html -->
<!DOCTYPE html>
<html lang="{{ current_locale }}">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}BookSlot{% endblock %}</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="/static/css/style.css">
</head>
<body class="bg-gray-100 font-sans antialiased">
    <header class="bg-white shadow-sm p-4">
        <div class="container mx-auto flex justify-between items-center">
            <a href="/" class="text-2xl font-bold text-blue-600">BookSlot</a>
            <nav>
                {% if owner %}
                <a href="/dashboard" class="text-gray-700 hover:text-blue-600 mr-4">{{ _("Dashboard") }}</a>
                <a href="/logout" class="text-gray-700 hover:text-blue-600">{{ _("Logout") }}</a>
                {% else %}
                <a href="/login" class="text-gray-700 hover:text-blue-600 mr-4">{{ _("Login") }}</a>
                <a href="/signup" class="text-gray-700 hover:text-blue-600">{{ _("Sign Up") }}</a>
                {% endif %}
            </nav>
        </div>
    </header>

    <main>
        {% block content %}{% endblock %}
    </main>

    <footer class="bg-gray-800 text-white p-4 mt-8">
        <div class="container mx-auto text-center">
            <p>&copy; 2023 BookSlot. {{ _("All rights reserved.") }}</p>
        }
    </footer>
</body>
</html>
