<!DOCTYPE html><html lang="{{ lang }}"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>{% block title %}{% endblock %}</title><link href="https://cdn.jsdelivr.net/npm/tailwindcss@2.2.19/dist/tailwind.min.css" rel="stylesheet"><script src="https://unpkg.com/htmx.org@1.9.10" integrity="sha384-D1Kt99CQxQhEo2jJyrLFw8NgS7iR93NrXLhNG5HTFGTr5QkV4HtPimX+KrRzOukE" crossorigin="anonymous"></script><style>@import url('https://fonts.googleapis.com/css2?family=Cairo:wght@400;700&family=Poppins:wght@400;600&display=swap'); body { font-family: 'Poppins', sans-serif; } html[lang='ar'] body { font-family: 'Cairo', sans-serif; text-align: right; direction: rtl; } .text-right-rtl { text-align: right; } .text-left-rtl { text-align: left; } .flex-row-reverse-rtl { flex-direction: row-reverse; } </style></head><body class="bg-gray-100 flex flex-col min-h-screen"><header class="bg-white shadow-sm py-4"><div class="container mx-auto px-4 flex justify-between items-center"><h1 class="text-2xl font-bold text-indigo-600"><a href="/">BookSlot</a></h1><nav><div class="flex space-x-4"><a href="{{ request.url|urlencode('lang', 'en') }}" class="text-gray-600 hover:text-indigo-600 {% if lang == 'en' %}font-bold{% endif %}">English</a><a href="{{ request.url|urlencode('lang', 'ar') }}" class="text-gray-600 hover:text-indigo-600 {% if lang == 'ar' %}font-bold{% endif %}">العربية</a><a href="{{ request.url|urlencode('lang', 'fr') }}" class="text-gray-600 hover:text-indigo-600 {% if lang == 'fr' %}font-bold{% endif %}">Français</a></div></nav></div></header><main class="flex-grow container mx-auto px-4 py-8">{% block content %}{% endblock %}</main><footer class="bg-gray-200 py-4 text-center text-gray-600 text-sm">© 2023 BookSlot. All rights reserved.</footer></body></html>
