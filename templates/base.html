<!DOCTYPE html>
<html lang="{{ lang }}">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}BookSlot{% endblock %}</title>
    <link rel="stylesheet" href="/static/css/style.css">
    {% block head_extra %}{% endblock %}
</head>
<body>
    <header>
        <nav>
            <a href="/">BookSlot</a>
            <div class="language-selector">
                {% set current_url = request.url %}
                <a href="{{ current_url|urlencode('lang', 'en') }}" class="lang-btn {% if lang == 'en' %}active{% endif %}">EN</a>
                <a href="{{ current_url|urlencode('lang', 'ar') }}" class="lang-btn {% if lang == 'ar' %}active{% endif %}">AR</a>
                <a href="{{ current_url|urlencode('lang', 'fr') }}" class="lang-btn {% if lang == 'fr' %}active{% endif %}">FR</a>
            </div>
        </nav>
    </header>
    <main>
        {% block content %}{% endblock %}
    </main>
    <footer>
        <p>&copy; 2023 BookSlot</p>
    </footer>
    <script src="/static/js/script.js"></script>
    {% block body_extra %}{% endblock %}
</body>
</html>
