<!DOCTYPE html>
<html lang="{{ request.state.locale }}">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}BookSlot{% endblock %}</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body { font-family: sans-serif; }
        .container { max-width: 960px; margin: auto; padding: 20px; }
        .header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; }
        .lang-toggle { margin-left: auto; }
        .lang-toggle a { margin-left: 10px; text-decoration: none; color: #007bff; }
    </style>
    {% block head %}{% endblock %}
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>{% block page_title %}{% endblock %}</h1>
            <div class="lang-toggle">
                {% set current_url = request.url %}
                <a href="{{ current_url|urlencode('lang', 'en') }}">English</a>
                <a href="{{ current_url|urlencode('lang', 'ar') }}">العربية</a>
                <a href="{{ current_url|urlencode('lang', 'fr') }}">Français</a>
            </div>
        </div>
        {% block content %}{% endblock %}
    </div>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    {% block scripts %}{% endblock %}
</body>
</html>
