<!DOCTYPE html>
<html lang="{{ lang }}">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}BookSlot{% endblock %}</title>
    <link href="https://cdn.jsdelivr.net/npm/tailwindcss@2.2.19/dist/tailwind.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.3/css/all.min.css" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; }
        .locale-switcher {
            position: absolute;
            top: 1rem;
            {% if lang == 'ar' %}
            left: 1rem;
            {% else %}
            right: 1rem;
            {% endif %}
            z-index: 10;
        }
    </style>
    {% block head %}{% endblock %}
</head>
<body class="bg-gray-100 text-gray-900 flex flex-col min-h-screen">
    <div class="locale-switcher">
        <a href="{{ request.url|urlencode('lang', 'en') }}" class="px-2 py-1 rounded-md {% if lang == 'en' %}bg-blue-500 text-white{% else %}bg-gray-200{% endif %}">EN</a>
        <a href="{{ request.url|urlencode('lang', 'ar') }}" class="px-2 py-1 rounded-md {% if lang == 'ar' %}bg-blue-500 text-white{% else %}bg-gray-200{% endif %}">AR</a>
        <a href="{{ request.url|urlencode('lang', 'fr') }}" class="px-2 py-1 rounded-md {% if lang == 'fr' %}bg-blue-500 text-white{% else %}bg-gray-200{% endif %}">FR</a>
    </div>
    <header class="bg-white shadow-sm py-4">
        <div class="container mx-auto px-4 flex justify-between items-center">
            <h1 class="text-2xl font-bold text-blue-600">BookSlot</h1>
            <nav>
                {% block nav %}{% endblock %}
            </nav>
        </div>
    </header>
    <main class="flex-grow container mx-auto px-4 py-8">
        {% block content %}{% endblock %}
    </main>
    <footer class="bg-gray-800 text-white py-4 mt-8">
        <div class="container mx-auto px-4 text-center">
            <p>&copy; {{ _('2023 BookSlot. All rights reserved.') }}</p>
        </div>
    </footer>
    {% block scripts %}{% endblock %}
</body>
</html>
