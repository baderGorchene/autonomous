version: '3.8'

services:
  db:
    image: postgres:13-alpine
    volumes:
      - postgres_data:/var/lib/postgresql/data/
    environment:
      POSTGRES_DB: bookslot_staging_db
      POSTGRES_USER: bookslot_user
      POSTGRES_PASSWORD: bookslot_password
    # ports:
    #   - "5432:5432" # Exposing for local debugging if needed, not strictly for app
    restart: unless-stopped

  app:
    build: .
    command: uvicorn src.main:app --host 0.0.0.0 --port 8000
    volumes:
      - .:/app
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: postgresql://bookslot_user:bookslot_password@db:5432/bookslot_staging_db
      SECRET_KEY: ${SECRET_KEY}
      SENDGRID_API_KEY: ${SENDGRID_API_KEY}
      TWILIO_ACCOUNT_SID: ${TWILIO_ACCOUNT_SID}
      TWILIO_AUTH_TOKEN: ${TWILIO_AUTH_TOKEN}
      TWILIO_WHATSAPP_NUMBER: ${TWILIO_WHATSAPP_NUMBER}
      GEMINI_API_KEY: ${GEMINI_API_KEY}
      TESTING: "False"
    depends_on:
      - db
    restart: unless-stopped

volumes:
  postgres_data:
