version: '3.8'

services:
  web:
    build: .
    ports:
      - "8000:8000"
    env_file:
      - .env # Load environment variables from .env file
    depends_on:
      - db
    volumes:
      - .:/app # Mount the current directory into the container for live reloading (development only)
               # For production, remove this line to ensure code is from the build context
    command: ["uvicorn", "src.main:app", "--reload", "--host", "0.0.0.0", "--port", "8000"] # For development with reload
    # For production, remove the 'command' line to use the CMD from Dockerfile (gunicorn)

  db:
    image: postgres:13-alpine
    restart: always
    environment:
      POSTGRES_DB: bookslot_db
      POSTGRES_USER: user
      POSTGRES_PASSWORD: password
    volumes:
      - db_data:/var/lib/postgresql/data # Persist database data

volumes:
  db_data: