{% extends "base.html" %}
{% block title %}{{ _('Register') }}{% endblock %}

{% block content %}
<div class="max-w-md mx-auto bg-white p-8 border border-gray-200 rounded-lg shadow-md mt-10">
    <h2 class="text-3xl font-bold text-gray-800 mb-6 text-center">{{ _('Create your BookSlot Account') }}</h2>

    <form action="/register" method="post" class="space-y-6">
        <div>
            <label for="name" class="block text-sm font-medium text-gray-700">{{ _('Your Name') }}</label>
            <input type="text" id="name" name="name" required
                   class="mt-1 block w-full border border-gray-300 rounded-md shadow-sm py-2 px-3 focus:outline-none focus:ring-indigo-500 focus:border-indigo-500 sm:text-sm">
        </div>

        <div>
            <label for="email" class="block text-sm font-medium text-gray-700">{{ _('Email address') }}</label>
            <input type="email" id="email" name="email" required autocomplete="email"
                   class="mt-1 block w-full border border-gray-300 rounded-md shadow-sm py-2 px-3 focus:outline-none focus:ring-indigo-500 focus:border-indigo-500 sm:text-sm">
        </div>

        <div>
            <label for="phone" class="block text-sm font-medium text-gray-700">{{ _('Phone Number (Optional)') }}</label>
            <input type="tel" id="phone" name="phone"
                   class="mt-1 block w-full border border-gray-300 rounded-md shadow-sm py-2 px-3 focus:outline-none focus:ring-indigo-500 focus:border-indigo-500 sm:text-sm">
        </div>

        <div>
            <label for="password" class="block text-sm font-medium text-gray-700">{{ _('Password') }}</label>
            <input type="password" id="password" name="password" required autocomplete="new-password"
                   class="mt-1 block w-full border border-gray-300 rounded-md shadow-sm py-2 px-3 focus:outline-none focus:ring-indigo-500 focus:border-indigo-500 sm:text-sm">
        </div>

        <button type="submit" class="w-full flex justify-center py-2 px-4 border border-transparent rounded-md shadow-sm text-sm font-medium text-white bg-indigo-600 hover:bg-indigo-700 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-indigo-500">
            {{ _('Sign up') }}
        </button>
    </form>

    <p class="mt-6 text-center text-sm text-gray-600">
        {{ _('Already have an account?') }} <a href="/login" class="font-medium text-indigo-600 hover:text-indigo-500">{{ _('Login') }}</a>
    </p>
</div>
{% endblock %}
