{% extends "base.html" %}
{% block title %}Setup Services & Availability - BookSlot{% endblock %}
{% block content %}
<div class="row">
    <div class="col-md-12">
        <h2 class="mb-4">Setup Services & Availability</h2>
        <div class="card shadow mb-4">
            <div class="card-body">
                <h4 class="card-title mb-3">Add a Service</h4>
                <form method="POST" action="/setup/service">
                    <div class="row">
                        <div class="col-md-4 mb-3">
                            <label class="form-label">Service Name</label>
                            <input type="text" class="form-control" name="name" required placeholder="e.g. Haircut">
                        </div>
                        <div class="col-md-3 mb-3">
                            <label class="form-label">Duration (minutes)</label>
                            <input type="number" class="form-control" name="duration_minutes" required value="30">
                        </div>
                        <div class="col-md-3 mb-3">
                            <label class="form-label">Price ($)</label>
                            <input type="number" step="0.01" class="form-control" name="price" required value="25.00">
                        </div>
                        <div class="col-md-2 mb-3 d-flex align-items-end">
                            <button type="submit" class="btn btn-success w-100">Add Service</button>
                        </div>
                    </div>
                </form>
            </div>
        </div>

        <div class="card shadow">
            <div class="card-body">
                <h4 class="card-title mb-3">Add Availability Rule</h4>
                <form method="POST" action="/setup/availability">
                    <div class="row">
                        <div class="col-md-3 mb-3">
                            <label class="form-label">Recurrence Type</label>
                            <select class="form-select" name="recurrence_type">
                                <option value="WEEKLY">Weekly</option>
                                <option value="DAILY">Daily</option>
                            </select>
                        </div>
                        <div class="col-md-3 mb-3">
                            <label class="form-label">Days (e.g. MON,TUE,WED)</label>
                            <input type="text" class="form-control" name="recurrence_value" value="MON,TUE,WED,THU,FRI">
                        </div>
                        <div class="col-md-2 mb-3">
                            <label class="form-label">Start Time</label>
                            <input type="time" class="form-control" name="start_time" value="09:00" required>
                        </div>
                        <div class="col-md-2 mb-3">
                            <label class="form-label">End Time</label>
                            <input type="time" class="form-control" name="end_time" value="17:00" required>
                        </div>
                        <div class="col-md-2 mb-3 d-flex align-items-end">
                            <button type="submit" class="btn btn-primary w-100">Add Rule</button>
                        </div>
                    </div>
                </form>
            </div>
        </div>
        <div class="mt-4">
            <a href="/dashboard" class="btn btn-secondary"><i class="bi bi-arrow-left me-1"></i> Back to Dashboard</a>
        </div>
    </div>
</div>
{% endblock %}
