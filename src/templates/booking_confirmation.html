{% extends "base.html" %}
{% block title %}{{ _('Booking Confirmation') }}{% endblock %}

{% block content %}
<div class="max-w-md mx-auto bg-white p-8 border border-gray-200 rounded-lg shadow-md text-center">
    <h2 class="text-3xl font-bold text-green-600 mb-4">{{ _('Booking Confirmed!') }}</h2>
    <p class="text-gray-700 mb-6">{{ _('Thank you for your booking.') }} {{ _('A confirmation email has been sent to you.') }}</p>
    <a href="/book/{{ owner.name }}" class="inline-block bg-indigo-600 text-white px-6 py-3 rounded-md hover:bg-indigo-700 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-indigo-500">
        {{ _('Book Another Service') }}
    </a>
</div>
{% endblock %}
