{% extends "base.html" %}
{% block title %}{{ _('Profile') }}{% endblock %}

{% block content %}
<div class="max-w-md mx-auto bg-white p-8 border border-gray-200 rounded-lg shadow-md mt-10">
    <h2 class="text-3xl font-bold text-gray-800 mb-6 text-center">{{ _('Your Profile') }}</h2>

    {% if message %}
    <div class="bg-green-100 border border-green-400 text-green-700 px-4 py-3 rounded relative mb-4" role="alert">
        <span class="block sm:inline">{{ message }}</span>
    </div>
    {% endif %}

    <form action="/profile" method="post" class="space-y-6">
        <div>
            <label for="name" class="block text-sm font-medium text-gray-700">{{ _('Name') }}</label>
            <input type="text" id="name" name="name" value="{{ owner.name }}" required
                   class="mt-1 block w-full border border-gray-300 rounded-md shadow-sm py-2 px-3 focus:outline-none focus:ring-indigo-500 focus:border-indigo-500 sm:text-sm">
        </div>

        <div>
            <label for="email" class="block text-sm font-medium text-gray-700">{{ _('Email address') }}</label>
            <input type="email" id="email" name="email" value="{{ owner.email }}" disabled
                   class="mt-1 block w-full border border-gray-300 bg-gray-50 rounded-md shadow-sm py-2 px-3 sm:text-sm cursor-not-allowed">
        </div>

        <div>
            <label for="phone" class="block text-sm font-medium text-gray-700">{{ _('Phone Number (Optional)') }}</label>
            <input type="tel" id="phone" name="phone" value="{{ owner.phone if owner.phone else '' }}"
                   class="mt-1 block w-full border border-gray-300 rounded-md shadow-sm py-2 px-3 focus:outline-none focus:ring-indigo-500 focus:border-indigo-500 sm:text-sm">
        </div>

        <button type="submit" class="w-full flex justify-center py-2 px-4 border border-transparent rounded-md shadow-sm text-sm font-medium text-white bg-indigo-600 hover:bg-indigo-700 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-indigo-500">
            {{ _('Update Profile') }}
        </button>
    </form>
</div>
{% endblock %}
