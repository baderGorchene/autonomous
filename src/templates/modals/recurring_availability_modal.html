<!-- Recurring Availability Modal -->
<div id="recurringAvailabilityModal" class="fixed z-10 inset-0 overflow-y-auto hidden" aria-labelledby="modal-title" role="dialog" aria-modal="true">
    <div class="flex items-end justify-center min-h-screen pt-4 px-4 pb-20 text-center sm:block sm:p-0">
        <div class="fixed inset-0 bg-gray-500 bg-opacity-75 transition-opacity" aria-hidden="true"></div>

        <span class="hidden sm:inline-block sm:align-middle sm:h-screen" aria-hidden="true">&#8203;</span>

        <div class="inline-block align-bottom bg-white rounded-lg text-left overflow-hidden shadow-xl transform transition-all sm:my-8 sm:align-middle sm:max-w-lg sm:w-full">
            <div class="bg-white px-4 pt-5 pb-4 sm:p-6 sm:pb-4">
                <div class="sm:flex sm:items-start">
                    <div class="mt-3 text-center sm:mt-0 sm:ml-4 sm:text-left w-full">
                        <h3 class="text-lg leading-6 font-medium text-gray-900" id="recurringAvailabilityModalTitle">
                            {{ _('Add Recurring Availability') }}
                        </h3>
                        <div class="mt-2">
                            <form id="recurringAvailabilityForm" class="space-y-4">
                                <input type="hidden" id="recurringAvailabilityId" name="id">
                                <div>
                                    <label for="recurringServiceId" class="block text-sm font-medium text-gray-700">{{ _('Service (Optional)') }}</label>
                                    <select id="recurringServiceId" name="service_id" class="mt-1 block w-full pl-3 pr-10 py-2 text-base border-gray-300 focus:outline-none focus:ring-indigo-500 focus:border-indigo-500 sm:text-sm rounded-md">
                                        <!-- Options populated by JS -->
                                    </select>
                                    <p class="mt-1 text-xs text-gray-500">{{ _('Leave blank for general availability across all services.') }}</p>
                                </div>
                                <div>
                                    <label for="recurringDayOfWeek" class="block text-sm font-medium text-gray-700">{{ _('Day of Week') }}</label>
                                    <select id="recurringDayOfWeek" name="day_of_week" required class="mt-1 block w-full pl-3 pr-10 py-2 text-base border-gray-300 focus:outline-none focus:ring-indigo-500 focus:border-indigo-500 sm:text-sm rounded-md">
                                        <option value="0">{{ _('Monday') }}</option>
                                        <option value="1">{{ _('Tuesday') }}</option>
                                        <option value="2">{{ _('Wednesday') }}</option>
                                        <option value="3">{{ _('Thursday') }}</option>
                                        <option value="4">{{ _('Friday') }}</option>
                                        <option value="5">{{ _('Saturday') }}</option>
                                        <option value="6">{{ _('Sunday') }}</option>
                                    </select>
                                </div>
                                <div class="grid grid-cols-2 gap-4">
                                    <div>
                                        <label for="recurringStartTime" class="block text-sm font-medium text-gray-700">{{ _('Start Time') }}</label>
                                        <input type="time" id="recurringStartTime" name="start_time" required class="mt-1 block w-full border-gray-300 rounded-md shadow-sm focus:ring-indigo-500 focus:border-indigo-500 sm:text-sm">
                                    </div>
                                    <div>
                                        <label for="recurringEndTime" class="block text-sm font-medium text-gray-700">{{ _('End Time') }}</label>
                                        <input type="time" id="recurringEndTime" name="end_time" required class="mt-1 block w-full border-gray-300 rounded-md shadow-sm focus:ring-indigo-500 focus:border-indigo-500 sm:text-sm">
                                    </div>
                                </div>
                                <div class="grid grid-cols-2 gap-4">
                                    <div>
                                        <label for="recurringStartDate" class="block text-sm font-medium text-gray-700">{{ _('Start Date (Optional)') }}</label>
                                        <input type="date" id="recurringStartDate" name="start_date" class="mt-1 block w-full border-gray-300 rounded-md shadow-sm focus:ring-indigo-500 focus:border-indigo-500 sm:text-sm">
                                        <p class="mt-1 text-xs text-gray-500">{{ _('Rule becomes active from this date.') }}</p>
                                    </div>
                                    <div>
                                        <label for="recurringEndDate" class="block text-sm font-medium text-gray-700">{{ _('End Date (Optional)') }}</label>
                                        <input type="date" id="recurringEndDate" name="end_date" class="mt-1 block w-full border-gray-300 rounded-md shadow-sm focus:ring-indigo-500 focus:border-indigo-500 sm:text-sm">
                                        <p class="mt-1 text-xs text-gray-500">{{ _('Rule ceases to be active after this date.') }}</p>
                                    </div>
                                </div>
                                <div class="flex items-center">
                                    <input type="checkbox" id="recurringIsActive" name="is_active" class="h-4 w-4 text-indigo-600 focus:ring-indigo-500 border-gray-300 rounded">
                                    <label for="recurringIsActive" class="ml-2 block text-sm text-gray-900">{{ _('Is Active') }}</label>
                                </div>
                                <p id="recurringAvailabilityMessage" class="mt-2 text-sm"></p>
                                <div class="bg-gray-50 px-4 py-3 sm:flex sm:flex-row-reverse sm:px-6">
                                    <button type="submit" class="w-full inline-flex justify-center rounded-md border border-transparent shadow-sm px-4 py-2 bg-indigo-600 text-base font-medium text-white hover:bg-indigo-700 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-indigo-500 sm:ml-3 sm:w-auto sm:text-sm">
                                        {{ _('Save') }}
                                    </button>
                                    <button type="button" id="cancelRecurringAvailabilityBtn" class="mt-3 w-full inline-flex justify-center rounded-md border border-gray-300 shadow-sm px-4 py-2 bg-white text-base font-medium text-gray-700 hover:bg-gray-50 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-indigo-500 sm:mt-0 sm:ml-3 sm:w-auto sm:text-sm">
                                        {{ _('Cancel') }}
                                    </button>
                                </div>
                            </form>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>

<script>
    document.addEventListener('DOMContentLoaded', function() {
        const recurringAvailabilityModal = document.getElementById('recurringAvailabilityModal');
        const recurringAvailabilityForm = document.getElementById('recurringAvailabilityForm');
        const recurringAvailabilityIdInput = document.getElementById('recurringAvailabilityId');
        const recurringAvailabilityMessage = document.getElementById('recurringAvailabilityMessage');
        const cancelRecurringAvailabilityBtn = document.getElementById('cancelRecurringAvailabilityBtn');

        cancelRecurringAvailabilityBtn.addEventListener('click', function() {
            recurringAvailabilityModal.classList.add('hidden');
        });

        recurringAvailabilityForm.addEventListener('submit', async function(event) {
            event.preventDefault();
            const formData = new FormData(recurringAvailabilityForm);
            const data = Object.fromEntries(formData.entries());

            // Convert empty string for optional fields to null
            if (data.service_id === '') data.service_id = null;
            else data.service_id = parseInt(data.service_id);
            if (data.start_date === '') data.start_date = null;
            if (data.end_date === '') data.end_date = null;
            data.day_of_week = parseInt(data.day_of_week);
            data.is_active = document.getElementById('recurringIsActive').checked;

            const recurringId = recurringAvailabilityIdInput.value;
            const method = recurringId ? 'PATCH' : 'POST';
            const url = recurringId ? `/owner/recurring-availabilities/${recurringId}` : '/owner/recurring-availabilities';

            try {
                const response = await fetch(url, {
                    method: method,
                    headers: {
                        'Content-Type': 'application/json',
                        'Authorization': `Bearer ${localStorage.getItem('access_token')}`
                    },
                    body: JSON.stringify(data)
                });

                if (response.ok) {
                    recurringAvailabilityMessage.textContent = '{{ _("Recurring availability saved successfully!") }}';
                    recurringAvailabilityMessage.className = 'mt-2 text-sm text-green-600';
                    setTimeout(() => {
                        recurringAvailabilityModal.classList.add('hidden');
                        window.location.reload(); // Reload to show updated list
                    }, 1500);
                } else {
                    const errorData = await response.json();
                    recurringAvailabilityMessage.textContent = `{{ _("Error saving recurring availability:") }} ${errorData.detail || response.statusText}`;
                    recurringAvailabilityMessage.className = 'mt-2 text-sm text-red-600';
                }
            } catch (error) {
                recurringAvailabilityMessage.textContent = `{{ _("Network error:") }} ${error}`;
                recurringAvailabilityMessage.className = 'mt-2 text-sm text-red-600';
            }
        });
    });
</script>
