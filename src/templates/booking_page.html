<!DOCTYPE html>
<html lang="{{ locale }}">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ gettext('Book a Slot with') }} {{ owner.name }}</title>
    <link rel="stylesheet" href="/static/css/style.css">
</head>
<body>
    <header>
        <h1>{{ gettext('Book a Slot with') }} {{ owner.name }}</h1>
        <div class="lang-toggle">
            <a href="#" onclick="changeLanguage('en'); return false;">EN</a> |
            <a href="#" onclick="changeLanguage('ar'); return false;">AR</a> |
            <a href="#" onclick="changeLanguage('fr'); return false;">FR</a>
        </div>
    </header>
    <main>
        {% if error %}
            <p style="color: red;">{{ error }}</p>
        {% endif %}
        <form action="/booking/{{ owner.name }}/submit" method="post">
            <label for="customer_name">{{ gettext('Your Name') }}:</label>
            <input type="text" id="customer_name" name="customer_name" required><br>

            <label for="customer_email">{{ gettext('Your Email') }}:</label>
            <input type="email" id="customer_email" name="customer_email" required><br>

            <label for="customer_phone">{{ gettext('Your Phone (Optional)') }}:</label>
            <input type="text" id="customer_phone" name="customer_phone"><br>

            <label for="service_id">{{ gettext('Select Service') }}:</label>
            <select id="service_id" name="service_id" required>
                {% for service in services %}
                    <option value="{{ service.id }}">{{ service.name }} ({{ service.price | currency_format(locale) }} - {{ service.duration_minutes }} {{ gettext('minutes') }})</option>
                {% endfor %}
            </select><br>

            <label for="booking_date">{{ gettext('Date') }}:</label>
            <input type="date" id="booking_date" name="booking_date" required min="{{ 'now' | strftime('%Y-%m-%d') }}"><br>

            <label for="booking_time">{{ gettext('Time') }}:</label>
            <input type="time" id="booking_time" name="booking_time" required><br>

            <button type="submit">{{ gettext('Book Now') }}</button>
        </form>
    </main>
    <footer>
        <p>&copy; 2023 BookSlot. {{ gettext('All rights reserved.') }}</p>
    </footer>
    <script>
        function changeLanguage(lang) {
            document.cookie = "lang=" + lang + "; path=/; max-age=31536000";
            location.reload();
        }
    </script>
</body>
</html>
