<!DOCTYPE html>
<html lang="{{ request.cookies.get('lang', 'en') }}">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ _("Book with", request) }} {{ owner.name }}</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/tailwindcss/2.2.19/tailwind.min.css">
    <style>
        body { font-family: 'Inter', sans-serif; background-color: #f4f7f6; color: #333; }
        .container { max-width: 600px; }
        .form-input { border: 1px solid #e2e8f0; padding: 0.75rem; border-radius: 0.375rem; width: 100%; }
        .btn-primary { background-color: #4c51bf; color: white; padding: 0.75rem 1.5rem; border-radius: 0.375rem; transition: background-color 0.2s; }
        .btn-primary:hover { background-color: #5a62d8; }
        .lang-toggle button { background: none; border: none; padding: 0.5rem; cursor: pointer; font-weight: bold; color: #4a5568; }
        .lang-toggle button.active { color: #4c51bf; text-decoration: underline; }
    </style>
</head>
<body class="flex flex-col items-center justify-center min-h-screen p-4">
    <div class="lang-toggle flex space-x-2 mb-4">
        <form action="/set_language" method="post" class="inline">
            <input type="hidden" name="lang" value="en">
            <button type="submit" class="{% if current_locale == 'en' %}active{% endif %}">EN</button>
        </form>
        <form action="/set_language" method="post" class="inline">
            <input type="hidden" name="lang" value="ar">
            <button type="submit" class="{% if current_locale == 'ar' %}active{% endif %}">AR</button>
        </form>
        <form action="/set_language" method="post" class="inline">
            <input type="hidden" name="lang" value="fr">
            <button type="submit" class="{% if current_locale == 'fr' %}active{% endif %}">FR</button>
        </form>
    </div>

    <div class="container bg-white p-8 rounded-lg shadow-md w-full">
        <h1 class="text-3xl font-bold text-center mb-6">{{ _("Book an Appointment with", request) }} {{ owner.name }}</h1>
        <p class="text-center text-gray-600 mb-8">{{ _("Choose a service and a time slot that works for you.", request) }}</p>

        {% if error %}
            <div class="bg-red-100 border border-red-400 text-red-700 px-4 py-3 rounded relative mb-4" role="alert">
                <strong class="font-bold">{{ _("Error!", request) }}</strong>
                <span class="block sm:inline">{{ error }}</span>
            </div>
        {% endif %}

        <form action="/bookslot.app/{{ owner.name }}/submit" method="post" class="space-y-6">
            <div>
                <label for="service_id" class="block text-sm font-medium text-gray-700 mb-1">{{ _("Select Service", request) }}</label>
                <select id="service_id" name="service_id" required class="form-input">
                    <option value="">{{ _("Choose a service", request) }}</option>
                    {% for service in services %}
                        <option value="{{ service.id }}">{{ service.name }} ({{ format_currency(service.price / 100, request) }}) - {{ service.duration_minutes }} {{ _("min", request) }}</option>
                    {% endfor %}
                </select>
            </div>

            <div>
                <label for="booking_date" class="block text-sm font-medium text-gray-700 mb-1">{{ _("Select Date", request) }}</label>
                <input type="date" id="booking_date" name="booking_date" required class="form-input">
            </div>

            <div>
                <label for="booking_time" class="block text-sm font-medium text-gray-700 mb-1">{{ _("Select Time", request) }}</label>
                <input type="time" id="booking_time" name="booking_time" required class="form-input">
            </div>

            <div>
                <label for="customer_name" class="block text-sm font-medium text-gray-700 mb-1">{{ _("Your Name", request) }}</label>
                <input type="text" id="customer_name" name="customer_name" placeholder="{{ _('e.g., John Doe', request) }}" required class="form-input">
            </div>

            <div>
                <label for="customer_email" class="block text-sm font-medium text-gray-700 mb-1">{{ _("Your Email", request) }}</label>
                <input type="email" id="customer_email" name="customer_email" placeholder="{{ _('e.g., john.doe@example.com', request) }}" required class="form-input">
            </div>

            <div>
                <label for="customer_phone" class="block text-sm font-medium text-gray-700 mb-1">{{ _("Your Phone Number", request) }}</label>
                <input type="tel" id="customer_phone" name="customer_phone" placeholder="{{ _('e.g., +15551234567', request) }}" required class="form-input">
            </div>

            <button type="submit" class="btn-primary w-full">{{ _("Book Now", request) }}</button>
        </form>
    </div>

    <script>
        const today = new Date().toISOString().split('T')[0];
        document.getElementById('booking_date').setAttribute('min', today);
    </script>
</body>
</html>
