<!-- src/templates/booking_page.html -->
<!DOCTYPE html>
<html lang="{{ current_locale }}">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ _("Book with {owner_name}").format(owner_name=owner.name) }}</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <style>
        body { font-family: 'Inter', sans-serif; }
        input[type="date"]::-webkit-calendar-picker-indicator,
        input[type="time"]::-webkit-calendar-picker-indicator {
            filter: invert(0.5) sepia(1) saturate(5) hue-rotate(175deg); /* Tailwind indigo-600 approx */
        }
    </style>
</head>
<body class="bg-gray-100 min-h-screen flex flex-col items-center justify-center p-4">
    <div class="bg-white shadow-lg rounded-lg p-6 sm:p-8 max-w-lg w-full">
        <h1 class="text-3xl font-bold text-gray-900 text-center mb-2">{{ owner.name }}</h1>
        <p class="text-gray-600 text-center mb-6">{{ _("Book your service below.") }}</p>

        {% for message in error_message %}
        <div class="mb-4 p-3 rounded-md {% if message.category == 'error' %}bg-red-100 text-red-700{% elif message.category == 'success' %}bg-green-100 text-green-700{% else %}bg-blue-100 text-blue-700{% endif %}">
            {{ message.message }}
        </div>
        {% endfor %}

        <form action="/book/{{ owner.name }}/submit" method="POST" class="space-y-6">
            <div>
                <label for="service_id" class="block text-sm font-medium text-gray-700">{{ _("Select Service") }}</label>
                <select id="service_id" name="service_id" required class="mt-1 block w-full pl-3 pr-10 py-2 text-base border-gray-300 focus:outline-none focus:ring-indigo-500 focus:border-indigo-500 sm:text-sm rounded-md">
                    <option value="">{{ _("Choose a service") }}</option>
                    {% for service in services %}
                    <option value="{{ service.id }}">{{ service.name }} - ${{ "%.2f"|format(service.price) }} ({{ service.duration_minutes }} {{ _("min") }})</option>
                    {% endfor %}
                </select>
            </div>

            <div>
                <label for="customer_name" class="block text-sm font-medium text-gray-700">{{ _("Your Name") }}</label>
                <input type="text" name="customer_name" id="customer_name" required class="mt-1 block w-full border-gray-300 rounded-md shadow-sm py-2 px-3 focus:outline-none focus:ring-indigo-500 focus:border-indigo-500 sm:text-sm" placeholder="{{ _('John Doe') }}">
            </div>

            <div>
                <label for="customer_email" class="block text-sm font-medium text-gray-700">{{ _("Your Email") }}</label>
                <input type="email" name="customer_email" id="customer_email" required class="mt-1 block w-full border-gray-300 rounded-md shadow-sm py-2 px-3 focus:outline-none focus:ring-indigo-500 focus:border-indigo-500 sm:text-sm" placeholder="{{ _('john.doe@example.com') }}">
            </div>

            <div>
                <label for="customer_phone" class="block text-sm font-medium text-gray-700">{{ _("Your Phone (WhatsApp preferred)") }}</label>
                <input type="tel" name="customer_phone" id="customer_phone" class="mt-1 block w-full border-gray-300 rounded-md shadow-sm py-2 px-3 focus:outline-none focus:ring-indigo-500 focus:border-indigo-500 sm:text-sm" placeholder="{{ _('+1234567890') }}">
            </div>

            <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
                <div>
                    <label for="booking_date" class="block text-sm font-medium text-gray-700">{{ _("Date") }}</label>
                    <input type="date" name="booking_date" id="booking_date" required class="mt-1 block w-full border-gray-300 rounded-md shadow-sm py-2 px-3 focus:outline-none focus:ring-indigo-500 focus:border-indigo-500 sm:text-sm">
                </div>
                <div>
                    <label for="booking_time" class="block text-sm font-medium text-gray-700">{{ _("Time") }}</label>
                    <input type="time" name="booking_time" id="booking_time" required class="mt-1 block w-full border-gray-300 rounded-md shadow-sm py-2 px-3 focus:outline-none focus:ring-indigo-500 focus:border-indigo-500 sm:text-sm">
                </div>
            </div>

            <div>
                <button type="submit" class="w-full flex justify-center py-2 px-4 border border-transparent rounded-md shadow-sm text-sm font-medium text-white bg-indigo-600 hover:bg-indigo-700 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-indigo-500">
                    {{ _("Book Now") }}
                </button>
            </div>
        </form>

        <div class="mt-8 flex justify-center space-x-4">
            <a href="/set_locale/en" class="text-sm font-medium text-gray-700 hover:text-indigo-600 {% if current_locale == 'en' %}font-bold{% endif %}">English</a>
            <a href="/set_locale/ar" class="text-sm font-medium text-gray-700 hover:text-indigo-600 {% if current_locale == 'ar' %}font-bold{% endif %}">العربية</a>
            <a href="/set_locale/fr" class="text-sm font-medium text-gray-700 hover:text-indigo-600 {% if current_locale == 'fr' %}font-bold{% endif %}">Français</a>
        </div>
    </div>
</body>
</html>
