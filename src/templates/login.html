{% extends "base.html" %}
{% block title %}{{ _('Login') }}{% endblock %}

{% block content %}
<div class="max-w-md mx-auto bg-white p-8 border border-gray-200 rounded-lg shadow-md mt-10">
    <h2 class="text-3xl font-bold text-gray-800 mb-6 text-center">{{ _('Login to BookSlot') }}</h2>

    <form action="/token" method="post" class="space-y-6">
        <div>
            <label for="username" class="block text-sm font-medium text-gray-700">{{ _('Email address') }}</label>
            <input type="email" id="username" name="username" required autocomplete="email"
                   class="mt-1 block w-full border border-gray-300 rounded-md shadow-sm py-2 px-3 focus:outline-none focus:ring-indigo-500 focus:border-indigo-500 sm:text-sm">
        </div>

        <div>
            <label for="password" class="block text-sm font-medium text-gray-700">{{ _('Password') }}</label>
            <input type="password" id="password" name="password" required autocomplete="current-password"
                   class="mt-1 block w-full border border-gray-300 rounded-md shadow-sm py-2 px-3 focus:outline-none focus:ring-indigo-500 focus:border-indigo-500 sm:text-sm">
        </div>

        <button type="submit" class="w-full flex justify-center py-2 px-4 border border-transparent rounded-md shadow-sm text-sm font-medium text-white bg-indigo-600 hover:bg-indigo-700 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-indigo-500">
            {{ _('Sign in') }}
        </button>
    </form>

    <p class="mt-6 text-center text-sm text-gray-600">
        {{ _('Don’t have an account?') }} <a href="/register" class="font-medium text-indigo-600 hover:text-indigo-500">{{ _('Sign up') }}</a>
    </p>
</div>
{% endblock %}
