<div class="fixed bottom-4 right-4 bg-white p-2 rounded-lg shadow-lg">
    <div class="flex space-x-2">
        {% for lang_code, lang_name in languages.items() %}
            <a href="/set-language/{{ lang_code }}"
               class="px-3 py-1 rounded-md text-sm font-medium
                      {% if request.state.locale == lang_code %}bg-blue-500 text-white{% else %}bg-gray-200 text-gray-700 hover:bg-gray-300{% endif %}">
                {{ lang_name }}
            </a>
        {% endfor %}
    </div>
</div>
