<!DOCTYPE html>
<html lang="{{ request.cookies.get('lang', 'en') }}">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ gettext('Owner Details') }} - {{ owner.name }}</title>
    <link rel="stylesheet" href="/static/css/style.css">
</head>
<body>
    <header>
        <h1>{{ gettext('Owner Details') }}</h1>
        <nav>
            <a href="/admin/dashboard">{{ gettext('Admin Dashboard') }}</a>
            <a href="/logout">{{ gettext('Logout') }}</a>
            <div class="lang-toggle">
                <a href="#" onclick="changeLanguage('en'); return false;">EN</a> |
                <a href="#" onclick="changeLanguage('ar'); return false;">AR</a> |
                <a href="#" onclick="changeLanguage('fr'); return false;">FR</a>
            </div>
        </nav>
    </header>
    <main>
        <h2>{{ gettext('Details for') }} {{ owner.name }}</h2>
        <form action="/admin/owners/{{ owner.id }}/update" method="POST">
            <label for="name">{{ gettext('Name') }}:</label>
            <input type="text" id="name" name="name" value="{{ owner.name }}" required><br>

            <label for="email">{{ gettext('Email') }}:</label>
            <input type="email" id="email" name="email" value="{{ owner.email }}" required><br>

            <label for="phone">{{ gettext('Phone') }}:</label>
            <input type="text" id="phone" name="phone" value="{{ owner.phone if owner.phone else '' }}"><br>

            <label for="subscription_status">{{ gettext('Subscription Status') }}:</label>
            <select id="subscription_status" name="subscription_status">
                <option value="free" {% if owner.subscription_status == 'free' %}selected{% endif %}>{{ gettext('Free') }}</option>
                <option value="premium" {% if owner.subscription_status == 'premium' %}selected{% endif %}>{{ gettext('Premium') }}</option>
            </select><br>

            <label for="is_admin">{{ gettext('Is Admin') }}:</label>
            <input type="checkbox" id="is_admin" name="is_admin" value="True" {% if owner.is_admin %}checked{% endif %}><br>

            <button type="submit">{{ gettext('Update Owner') }}</button>
        </form>

        <form action="/admin/owners/{{ owner.id }}/delete" method="POST" onsubmit="return confirm('{{ gettext('Are you sure you want to delete this owner?') }}');" style="margin-top: 20px;">
            <button type="submit" style="background-color: red; color: white;">{{ gettext('Delete Owner') }}</button>
        </form>
    </main>
    <footer>
        <p>&copy; 2023 BookSlot. {{ gettext('All rights reserved.') }}</p>
    </footer>
    <script>
        function changeLanguage(lang) {
            document.cookie = "lang=" + lang + "; path=/; max-age=31536000";
            location.reload();
        }
    </script>
</body>
</html>
